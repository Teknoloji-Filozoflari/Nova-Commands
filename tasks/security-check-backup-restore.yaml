schema_version: 2
kind: task
id: security-check-backup-restore
name:
  tr: 9) Yedek ve geri yükleme tatbikatı
  en: 9) Backup and restore drill
summary:
  tr: Yedek var mı / okunabilir mi — gerçek restore’u kontrollü ortamda planla.
  en: Do backups exist/read? Plan real restore in a controlled environment.
description:
  tr: |-
    Neden: Alınmayan veya doğrulanmayan yedek felakette işe yaramaz; kör restore üretimi ezer.

    Kontrol listesi durumları (Nova yerel): unchecked / ok / review / na.
    Örnekler belgeleme içindir — otomatik çalışmaz.

    Platform dürüstlüğü: restic CLI Linux/macOS/Windows/BSD’de aynıdır; yol/kimlik bilgisi OS’e göre
    değişir. Windows wbadmin/VSS bu bankada birinci sınıf değil — restic yoksa na veya kendi yolunu
    belgeleyin. Örneklerde secret yok.

    İsteğe bağlı düzeltme: Drill: boş staging dizine restore → dosya örnekle → üretim yoluna basmadan
    hash karşılaştır. Başarısızsa yalnız staging’i sil; prod’a dokunma.
  en: |-
    Why: Missing/unverified backups fail in disasters; blind restore can wipe production.

    Checklist states (Nova local): unchecked / ok / review / na.
    Examples are documentation only — never auto-run.

    Platform honesty: the restic CLI is the same on Linux/macOS/Windows/BSD; paths/credentials differ
    by OS. Windows wbadmin/VSS are not first-class here — if restic is absent, mark na or document
    your path. No secrets in examples.

    Optional fix: Drill: restore to empty staging → sample files → compare hashes before touching
    prod. On failure, delete staging only; do not touch prod.
category: backup
tags:
- security
- checklist
- backup
intent:
  tr:
  - güvenlik kontrol 9
  - sunucu güvenlik kontrolü
  - 9) Yedek ve geri yükleme tatbikatı
  en:
  - security check 9
  - server security checklist
  - 9) Backup and restore drill
implementations:
- id: restic-unix
  platforms:
  - linux
  - macos
  - bsd
  shells:
  - bash
  commands:
  - restic
  examples:
  - command: restic version
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Araç var mı. Yoksa na veya başka yedek yolunu kaydet.
      en: Is the tool present? Else na or document another backup path.
  - command: restic -r /path/to/repo snapshots
    risk: caution
    shell: bash
    privilege: user
    explanation:
      tr: 'Snapshot listesi (parola gerekir; yol yer tutucu). Sağlıklı: taze snapshot.'
      en: 'Snapshot list (needs password; path placeholder). Healthy: fresh snapshot.'
  - command: restic -r /path/to/repo check
    risk: caution
    shell: bash
    privilege: user
    explanation:
      tr: Repo bütünlüğü (uzun sürebilir; yazmaz).
      en: Repo integrity (may be slow; non-writing).
  notes:
    tr: Örneklerde secret yok. Geri yüklemeyi önce boş dizine deneyin.
    en: No secrets in examples. Trial-restore into an empty directory first.
- id: restic-windows
  platforms:
  - windows
  shells:
  - powershell
  commands:
  - restic
  examples:
  - command: restic version
    risk: safe
    shell: powershell
    privilege: none
    explanation:
      tr: restic PATH’te mi. Yoksa na; wbadmin/VSS bu bankada birinci sınıf değil.
      en: Is restic on PATH? Else na; wbadmin/VSS are not first-class in this bank.
  - command: restic -r C:\path\to\repo snapshots
    risk: caution
    shell: powershell
    privilege: user
    explanation:
      tr: Snapshot listesi (parola gerekir; yol yer tutucu).
      en: Snapshot list (needs password; path placeholder).
  - command: restic -r C:\path\to\repo check
    risk: caution
    shell: powershell
    privilege: user
    explanation:
      tr: Repo bütünlüğü (yazmaz).
      en: Repo integrity (non-writing).
related_commands:
- restic
- borg
- rclone
- rsync
verification:
