schema_version: 2
kind: task
id: security-check-firewall-ports
name:
  tr: 4) Güvenlik duvarı ve dinleyen portlar
  en: 4) Firewall and listening ports
summary:
  tr: Yerel dinleyen portlar + firewall durumu — kural silme/ekleme yok; uzak tarama yok.
  en: Local listening ports + firewall status — no rule add/delete; no remote scanning.
description:
  tr: |-
    Neden: Gereksiz dinleyen servisler saldırı yüzeyi; yanlış firewall kuralı hizmeti keser.

    Kontrol listesi durumları (Nova yerel): unchecked / ok / review / na.
    Örnekler belgeleme içindir — otomatik çalışmaz.

    Platform dürüstlüğü: ufw Debian/Ubuntu ailesi; firewalld Fedora/RHEL/openSUSE ailesi; nftables
    düşük seviye (Alpine/Void/Gentoo ve sarmalayıcısız host’lar); pf BSD; Windows netsh/advfirewall.
    macOS’ta Application Firewall (socketfilterfw) ayrıdır — bu bankada henüz yok; pfctl macOS’ta da
    vardır ama çoğu masaüstünde kapalı olabilir.

    İsteğe bağlı düzeltme: Kural eklemeden önce mevcut policy yedeği alın. ufw --force reset / geniş
    allow kör önerilmez. Değişiklik sonrası hizmeti doğrula; rollback için önceki ruleset.
  en: |-
    Why: Unnecessary listeners are attack surface; wrong firewall rules outage services.

    Checklist states (Nova local): unchecked / ok / review / na.
    Examples are documentation only — never auto-run.

    Platform honesty: ufw is Debian/Ubuntu-family; firewalld is Fedora/RHEL/openSUSE-family;
    nftables is lower-level (Alpine/Void/Gentoo and unwrapped hosts); pf is BSD; Windows uses
    netsh/advfirewall. macOS Application Firewall (socketfilterfw) is separate and not yet in this
    bank; pfctl exists on macOS but is often inactive on desktops.

    Optional fix: Backup policy before adding rules. Blind ufw --force reset / wide allow is not
    recommended. Verify service after change; keep prior ruleset for rollback.
category: security
tags:
- security
- checklist
- firewall
- network
intent:
  tr:
  - güvenlik kontrol 4
  - sunucu güvenlik kontrolü
  - 4) Güvenlik duvarı ve dinleyen portlar
  en:
  - security check 4
  - server security checklist
  - 4) Firewall and listening ports
implementations:
- id: linux-ss
  platforms:
  - linux
  shells:
  - bash
  commands:
  - ss
  examples:
  - command: ss -tulpn
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: 'Yerel dinleyiciler. Sağlıklı: bilinen servisler. Şüpheli: tanınmayan 0.0.0.0 dinleyiciler.'
      en: 'Local listeners. Healthy: known services. Suspicious: unknown 0.0.0.0 listeners.'
  notes:
    tr: nmap ile dış tarama bu rehberde yok.
    en: No external nmap scanning in this guide.
- id: linux-ufw
  platforms:
  - linux
  distributions:
  - debian
  - ubuntu
  shells:
  - bash
  commands:
  - ufw
  examples:
  - command: sudo ufw status verbose
    risk: safe
    shell: bash
    privilege: elevated
    explanation:
      tr: ufw durumu (Debian/Ubuntu ailesi). Kurulu değilse na — firewalld ile karıştırma.
      en: ufw status (Debian/Ubuntu family). If absent, na — do not treat as firewalld.
- id: linux-firewalld
  platforms:
  - linux
  distributions:
  - fedora
  - rhel
  - rocky
  - almalinux
  - opensuse-leap
  - opensuse-tumbleweed
  - sles
  shells:
  - bash
  commands:
  - firewall-cmd
  examples:
  - command: firewall-cmd --state
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: firewalld durumu (Fedora/RHEL/openSUSE ailesi). ufw değildir.
      en: firewalld state (Fedora/RHEL/openSUSE family). Not ufw.
- id: linux-nft
  platforms:
  - linux
  distributions:
  - alpine
  - void
  - gentoo
  - arch
  shells:
  - bash
  commands:
  - nft
  examples:
  - command: sudo nft list ruleset
    risk: safe
    shell: bash
    privilege: elevated
    explanation:
      tr: 'nftables kuralları (salt okuma). ufw/firewalld sarmalayıcısı varsa önce onları kullanın.'
      en: 'nftables ruleset (read-only). If ufw/firewalld wraps the host, prefer those first.'
- id: windows-net
  platforms:
  - windows
  shells:
  - powershell
  commands:
  - get-nettcpconnection
  - netsh
  examples:
  - command: Get-NetTCPConnection -State Listen | Select-Object LocalAddress,LocalPort,OwningProcess
    risk: safe
    shell: powershell
    privilege: none
    explanation:
      tr: Dinleyen TCP portları (ufw/ss değildir).
      en: Listening TCP ports (not ufw/ss).
  - command: netsh advfirewall show allprofiles
    risk: safe
    shell: cmd
    privilege: none
    explanation:
      tr: Windows Defender Firewall profil durumları (kural silmez).
      en: Windows Defender Firewall profile status (does not delete rules).
- id: bsd-pf
  platforms:
  - bsd
  shells:
  - bash
  commands:
  - pfctl
  - netstat-bsd
  examples:
  - command: netstat -an -p tcp | head -n 40
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: BSD netstat ile yerel soket özeti (Linux ss değildir).
      en: BSD netstat local socket summary (not Linux ss).
  - command: sudo pfctl -s info
    risk: safe
    shell: bash
    privilege: elevated
    explanation:
      tr: PF özeti (FreeBSD/OpenBSD). ufw/firewalld değildir.
      en: PF summary (FreeBSD/OpenBSD). Not ufw/firewalld.
- id: macos-listeners
  platforms:
  - macos
  shells:
  - zsh
  commands:
  - lsof
  - pfctl
  examples:
  - command: lsof -nP -iTCP -sTCP:LISTEN
    risk: safe
    shell: zsh
    privilege: none
    explanation:
      tr: macOS dinleyen TCP soketleri.
      en: macOS listening TCP sockets.
  - command: sudo pfctl -s info
    risk: safe
    shell: zsh
    privilege: elevated
    explanation:
      tr: pf özeti (varsa). Application Firewall (socketfilterfw) ayrıdır ve bu bankada henüz yok; na olabilir.
      en: pf summary if present. Application Firewall (socketfilterfw) is separate and not yet in this bank; may be na.
related_commands:
- ss
- ufw
- firewall-cmd
- nft
- pfctl
- netsh
- get-nettcpconnection
- lsof
- netstat-bsd
