schema_version: 2
kind: task
id: list-running-services
name:
  tr: Çalışan servisleri listele
  en: List running services
summary:
  tr: systemd / BSD service / Windows Get-Service / launchctl ile servis durumu.
  en: Service state via systemd / BSD service / Windows Get-Service / launchctl.
category: system
intent:
  tr:
  - servis listesi
  - systemctl status
  - hangi servisler aktif
  en:
  - list services
  - systemctl status
  - which services are active
implementations:
- id: linux-systemctl
  commands:
  - systemctl
  examples:
  - command: systemctl list-units --type=service --state=running
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Çalışan systemd servis birimlerini listeler (OpenRC/runit değildir).
      en: Lists running systemd service units (not OpenRC/runit).
  operating_systems:
  - linux
  platforms:
  - linux
  shells:
  - bash
  distributions:
  - arch
  - endeavouros
  - manjaro
  - debian
  - ubuntu
  - fedora
  - rhel
  - rocky
  - almalinux
  - opensuse-leap
  - opensuse-tumbleweed
  - nixos
  notes:
    tr: systemd host’lar içindir. Alpine/Gentoo OpenRC ve Void runit ayrı uygulamalardır.
    en: For systemd hosts. Alpine/Gentoo OpenRC and Void runit are separate implementations.
- id: alpine-gentoo-openrc
  commands:
  - rc-status
  - rc-service
  examples:
  - command: rc-status
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: OpenRC runlevel servis durumunu listeler (systemctl değildir).
      en: Lists OpenRC runlevel service status (not systemctl).
  operating_systems:
  - linux
  platforms:
  - linux
  shells:
  - bash
  distributions:
  - alpine
  - gentoo
- id: void-runit
  commands:
  - sv
  examples:
  - command: ls /var/service
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Void’ta etkin runit servis bağlarını listeler; durum için sv status kullanın.
      en: Lists enabled Void runit service links; use sv status for state.
  - command: sv status /var/service/*
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Etkin runit servislerinin durumunu sorar.
      en: Queries status of enabled runit services.
  operating_systems:
  - linux
  platforms:
  - linux
  shells:
  - bash
  distributions:
  - void
- id: bsd-service
  commands:
  - service
  examples:
  - command: service -e
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: rc.conf ile etkinleştirilmiş servisleri listeler.
      en: Lists services enabled via rc.conf.
  operating_systems:
  - freebsd
  - netbsd
  - dragonflybsd
  platforms:
  - bsd
  shells:
  - bash
- id: openbsd-rcctl
  commands:
  - rcctl
  examples:
  - command: rcctl ls started
    risk: safe
    shell: ksh
    privilege: none
    explanation:
      tr: Başlatılmış servisleri listeler.
      en: Lists started services.
  operating_systems:
  - openbsd
  platforms:
  - bsd
  shells:
  - ksh
- id: windows-get-service
  commands:
  - get-service
  examples:
  - command: Get-Service | Where-Object Status -eq Running
    risk: safe
    shell: powershell
    privilege: none
    explanation:
      tr: Yerel servisleri listeler.
      en: Lists local services.
  operating_systems:
  - windows
  platforms:
  - windows
  shells:
  - powershell
- id: macos-launchctl
  commands:
  - launchctl
  examples:
  - command: launchctl list
    risk: safe
    shell: zsh
    privilege: none
    explanation:
      tr: GUI etki alanı özetini basmaya çalışır (ortama göre değişir).
      en: Attempts to print GUI domain summary (varies by environment).
  operating_systems:
  - macos
  platforms:
  - macos
  shells:
  - zsh
verification:
  status: draft
  sources:
  - man 1 systemctl
  - https://wiki.alpinelinux.org/wiki/OpenRC
  - https://wiki.gentoo.org/wiki/OpenRC
  - https://docs.voidlinux.org/config/services/index.html
  - man 8 service
  - man 8 rcctl
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.management/get-service
  notes: NV-121 multi-OS fill; still draft — not human-verified.
description:
  tr: 'Servis modelleri eşitlenmez: systemctl ≠ rc-status/rc-service ≠ sv ≠ service ≠ Get-Service ≠ launchctl.'
  en: 'Service models are not equated: systemctl ≠ rc-status/rc-service ≠ sv ≠ service ≠ Get-Service ≠ launchctl.'
tags:
- services
- systemd
- openrc
- runit
related_commands:
- systemctl
- rc-status
- rc-service
- sv
- service
- rcctl
- get-service
- sc
- launchctl
- sysrc
related_tasks:
- inspect-system-logs
- check-open-ports
