schema_version: 2
kind: task
id: security-check-updates
name:
  tr: 2) Güncellemeler
  en: 2) Updates
summary:
  tr: Bekleyen güvenlik güncellemelerini listele; yükseltme zorunlu değil (bazı yollar indirir/derleme planı gösterir).
  en: List pending security updates; upgrade not required (some paths download or show build plans).
description:
  tr: |-
    Neden: Eski paketler bilinen CVElerin kapısını açık bırakır; kör full-upgrade bakım penceresi ister.

    Kontrol listesi durumları (Nova yerel): unchecked / ok / review / na.
    Örnekler belgeleme içindir — otomatik çalışmaz.

    Platform dürüstlüğü: pacman ≠ apt ≠ dnf; freebsd-update (taban) ≠ pkg (paketler); Nix ≠ NixOS —
    NixOS’ta birincil yol nixos-rebuild’tur, nix-env değildir.

    İsteğe bağlı düzeltme: Bakım penceresinde ilgili PM ile yükselt; önce snapshot/backup.
  en: |-
    Why: Stale packages leave known CVEs open; blind full-upgrade needs a maintenance window.

    Checklist states (Nova local): unchecked / ok / review / na.
    Examples are documentation only — never auto-run.

    Platform honesty: pacman ≠ apt ≠ dnf; freebsd-update (base) ≠ pkg (packages); Nix ≠ NixOS —
    on NixOS the primary path is nixos-rebuild, not nix-env.

    Optional fix: Upgrade in a maintenance window with the matching PM; snapshot/backup first.
category: packages
tags:
- security
- checklist
- updates
- packages
intent:
  tr:
  - güvenlik kontrol 2
  - sunucu güvenlik kontrolü
  - 2) Güncellemeler
  en:
  - security check 2
  - server security checklist
  - 2) Updates
implementations:
- id: arch-check
  platforms:
  - linux
  distributions:
  - arch
  shells:
  - bash
  commands:
  - pacman
  examples:
  - command: checkupdates || pacman -Qu
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: 'Bekleyen yükseltmeler (checkupdates pacman-contrib). Sağlıklı: kısa/boş liste. Şüpheli: uzun
        kritik listesi.'
      en: 'Pending upgrades (checkupdates from pacman-contrib). Healthy: short/empty. Suspicious: long
        critical list.'
  notes:
    tr: Kurulum/yükseltme yapmaz; Arch tercihli kontrol.
    en: Does not install/upgrade; Arch-preferred check.
- id: debian-check
  platforms:
  - linux
  distributions:
  - debian
  - ubuntu
  shells:
  - bash
  commands:
  - apt
  examples:
  - command: apt list --upgradable 2>/dev/null | head
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Yükseltilebilir paket önizlemesi (yazmaz).
      en: Upgradable package preview (non-writing).
- id: fedora-check
  platforms:
  - linux
  distributions:
  - fedora
  shells:
  - bash
  commands:
  - dnf
  examples:
  - command: dnf check-update
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Güncelleme listesi; çıkış 100 = güncelleme var (dnf).
      en: Update list; exit 100 means updates available (dnf).
- id: nixos-check
  platforms:
  - linux
  distributions:
  - nixos
  shells:
  - bash
  commands:
  - nixos-rebuild
  examples:
  - command: sudo nixos-rebuild dry-build
    risk: caution
    shell: bash
    privilege: elevated
    explanation:
      tr: 'Ne derleneceğini/indirileceğini gösterir; derlemez, aktive etmez, switch yapmaz.
        nix-env veya düz Nix kurulum değildir. Ağ/cache sorgusu olabilir.'
      en: 'Shows what would be built/downloaded; does not build, activate, or switch.
        Not nix-env or plain Nix package install. May query caches/network.'
    warnings:
    - tr: dry-build sistem neslini değiştirmez; yine de sudo ve olası ağ/cache sorgusu ister.
      en: dry-build does not change the system generation; still needs sudo and may query caches/network.
  notes:
    tr: Nix ≠ NixOS; bu uygulama yalnız NixOS host içindir.
    en: Nix ≠ NixOS; this implementation is for NixOS hosts only.
- id: windows-winget
  platforms:
  - windows
  shells:
  - powershell
  commands:
  - winget
  examples:
  - command: winget list --upgrade-available
    risk: safe
    shell: powershell
    privilege: none
    explanation:
      tr: 'Yükseltilebilir WinGet paketlerini listeler (yazmaz). `winget upgrade --all` uygular — kullanma.'
      en: 'Lists packages with upgrades available (non-writing). `winget upgrade --all` applies updates — do not use here.'
- id: macos-softwareupdate
  platforms:
  - macos
  shells:
  - zsh
  commands:
  - softwareupdate
  examples:
  - command: softwareupdate --list
    risk: safe
    shell: zsh
    privilege: none
    explanation:
      tr: Apple güncelleme listesi (indirmez).
      en: Apple update list (does not download).
- id: freebsd-check
  platforms:
  - bsd
  distributions:
  - freebsd-release
  shells:
  - bash
  commands:
  - pkg
  - freebsd-update
  examples:
  - command: pkg version -l '<'
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: pkg paketlerinde yükseltme adayları (taban sistemi değildir).
      en: pkg package upgrade candidates (not the FreeBSD base system).
  - command: sudo freebsd-update fetch
    risk: caution
    shell: bash
    privilege: elevated
    explanation:
      tr: 'Taban yamalarını /var/db/freebsd-update altına indirir ve değişecek dosyaları listeler;
        `install` uygulamaz. `show` komutu yoktur (showconfig ≠ yama özeti). pkg upgrade değildir.'
      en: 'Downloads base patches into /var/db/freebsd-update and lists files that would change;
        does not `install`. There is no `show` command (showconfig ≠ patch summary). Not pkg upgrade.'
    warnings:
    - tr: fetch ağdan indirir ve disk yazar; yalnızca listelemek değildir. install çalıştırmayın.
      en: fetch downloads over the network and writes to disk; it is not list-only. Do not run install.
related_commands:
- pacman
- apt
- dnf
- rpm
- nixos-rebuild
- softwareupdate
- winget
- freebsd-update
- pkg
verification:
  status: draft
  sources:
  - man 8 pacman
  - man 8 apt
  - man 8 dnf
  - https://nixos.org/manual/nixos/stable/#sec-upgrading
  - softwareupdate --help
  - https://learn.microsoft.com/windows/package-manager/winget/list
  - https://man.freebsd.org/cgi/man.cgi?query=freebsd-update&sektion=8
  - https://man.freebsd.org/cgi/man.cgi?query=pkg&sektion=8
  - https://wiki.nixos.org/wiki/Nixos-rebuild
  notes: NV-119 content audit; stage 2 stays draft — not human-verified on live platforms.
related_tasks:
- update-system
- security-check-os-accounts
- security-check-ssh
