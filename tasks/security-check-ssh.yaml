schema_version: 2
kind: task
id: security-check-ssh
name:
  tr: 3) SSH yüzeyi
  en: 3) SSH surface
summary:
  tr: sshd durumu ve etkili ayarlar — salt okunur; parola auth’u kör kapatma yok.
  en: sshd status and effective settings — read-only; no blind password-auth disable.
description:
  tr: |-
    Neden: SSH kilidi host’a erişimi keser; önce ikinci oturum ve yedek config gerekir.

    Kontrol listesi durumları (Nova yerel): unchecked / ok / review / na.
    Örnekler belgeleme içindir — otomatik çalışmaz.

    Platform dürüstlüğü: Linux’ta systemctl birim adı ssh/sshd dağıtıma göre değişir; BSD’de
    service/rc.d; macOS’ta Remote Login/launchd; Windows’ta OpenSSH Server Get-Service. Hepsi için
    `sshd -T` etkili ayar dökümü (yazmaz) ortak kalabilir.

    İsteğe bağlı düzeltme: Yedek config alın. Değişiklikten sonra sshd -t, servisi reload edin, ikinci
    oturumda doğrulayın. PasswordAuthentication kapatmadan önce anahtar girişini kanıtlayın.
  en: |-
    Why: Locking SSH out cuts host access; need a second session and config backup first.

    Checklist states (Nova local): unchecked / ok / review / na.
    Examples are documentation only — never auto-run.

    Platform honesty: Linux systemctl unit is ssh/sshd by distro; BSD uses service/rc.d; macOS uses
    Remote Login/launchd; Windows uses OpenSSH Server via Get-Service. Across them, `sshd -T` remains
    a non-writing effective-settings dump when OpenSSH is installed.

    Optional fix: Backup config. After edits: sshd -t, reload the service, verify in a second session.
    Prove key login before disabling PasswordAuthentication.
category: security
tags:
- security
- checklist
- ssh
intent:
  tr:
  - güvenlik kontrol 3
  - sunucu güvenlik kontrolü
  - 3) SSH yüzeyi
  en:
  - security check 3
  - server security checklist
  - 3) SSH surface
implementations:
- id: linux-sshd
  platforms:
  - linux
  shells:
  - bash
  commands:
  - systemctl
  - sshd
  - ss
  - journalctl
  examples:
  - command: systemctl is-active sshd || systemctl is-active ssh
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: 'Birim adı dağıtıma göre ssh/sshd. Sağlıklı: active. Şüpheli: failed + beklenmeyen restart döngüsü.'
      en: 'Unit name is ssh/sshd by distro. Healthy: active. Suspicious: failed + unexpected restart loop.'
  - command: sudo sshd -t && sudo sshd -T | grep -Ei 'passwordauthentication|permitrootlogin|pubkeyauthentication|port '
    risk: safe
    shell: bash
    privilege: elevated
    explanation:
      tr: Config test + etkili ayar dökümü (yazmaz).
      en: Config test + effective settings dump (non-writing).
  - command: ss -tlnp | grep -E ':22\s|:2222\s' || true
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Dinleyen SSH portları (yerel). Port taraması değildir.
      en: Listening SSH ports (local). Not a port scan.
- id: windows-sshd
  platforms:
  - windows
  shells:
  - powershell
  commands:
  - get-service
  - get-nettcpconnection
  - sshd
  examples:
  - command: Get-Service sshd -ErrorAction SilentlyContinue
    risk: safe
    shell: powershell
    privilege: none
    explanation:
      tr: Windows OpenSSH Server servisi. Yoksa checklist na (systemctl değildir).
      en: Windows OpenSSH Server service. If absent, checklist na (not systemctl).
  - command: Get-NetTCPConnection -State Listen | Where-Object { $_.LocalPort -in 22,2222 }
    risk: safe
    shell: powershell
    privilege: none
    explanation:
      tr: Yerel SSH dinleyicileri.
      en: Local SSH listeners.
  - command: sshd -t; sshd -T | Select-String -Pattern 'passwordauthentication|permitrootlogin|pubkeyauthentication|port '
    risk: safe
    shell: powershell
    privilege: elevated
    explanation:
      tr: OpenSSH kuruluduysa etkili ayar dökümü (yazmaz).
      en: Effective settings dump when OpenSSH is installed (non-writing).
- id: macos-sshd
  platforms:
  - macos
  shells:
  - zsh
  commands:
  - launchctl
  - sshd
  - lsof
  examples:
  - command: sudo launchctl print system/com.openssh.sshd 2>/dev/null | head -n 40 || echo 'remote-login-na'
    risk: safe
    shell: zsh
    privilege: elevated
    explanation:
      tr: Remote Login / OpenSSH launchd işi. Kapalıysa na olabilir (systemctl değildir).
      en: Remote Login / OpenSSH launchd job. May be na if disabled (not systemctl).
  - command: sudo sshd -t && sudo sshd -T | grep -Ei 'passwordauthentication|permitrootlogin|pubkeyauthentication|port '
    risk: safe
    shell: zsh
    privilege: elevated
    explanation:
      tr: Config test + etkili ayarlar.
      en: Config test + effective settings.
  - command: lsof -nP -iTCP:22 -sTCP:LISTEN || true
    risk: safe
    shell: zsh
    privilege: none
    explanation:
      tr: Yerel :22 dinleyicisi (uzak tarama değil).
      en: Local :22 listener (not a remote scan).
- id: bsd-sshd
  platforms:
  - bsd
  shells:
  - bash
  commands:
  - service
  - sshd
  - netstat-bsd
  examples:
  - command: service sshd status
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: FreeBSD/NetBSD rc.d sshd durumu (systemctl/launchctl değildir). OpenBSD’de rcctl ayrıdır.
      en: FreeBSD/NetBSD rc.d sshd status (not systemctl/launchctl). OpenBSD uses rcctl separately.
  - command: sudo sshd -t && sudo sshd -T | grep -Ei 'passwordauthentication|permitrootlogin|pubkeyauthentication|port '
    risk: safe
    shell: bash
    privilege: elevated
    explanation:
      tr: Config test + etkili ayarlar.
      en: Config test + effective settings.
  - command: netstat -an -p tcp | grep '\.22 '
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Yerel :22 soketleri (BSD netstat).
      en: Local :22 sockets (BSD netstat).
related_commands:
