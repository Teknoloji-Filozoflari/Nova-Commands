schema_version: 2
kind: task
id: inspect-system-logs
name:
  tr: Sistem günlüklerini incele
  en: Inspect system logs
summary:
  tr: journalctl / Get-WinEvent / log / dmesg ile okuma odaklı günlük inceleme.
  en: Read-oriented log inspection via journalctl / Get-WinEvent / log / dmesg.
category: system
intent:
  tr:
  - sistem logları
  - journalctl oku
  - hata günlükleri
  en:
  - system logs
  - read journalctl
  - error logs
implementations:
- id: linux-journalctl
  commands:
  - journalctl
  examples:
  - command: journalctl -xe --no-pager | tail -n 50
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: systemd journal son satırları (OpenRC/syslog yolu değildir).
      en: Recent systemd journal lines (not OpenRC/syslog path).
  operating_systems:
  - linux
  platforms:
  - linux
  shells:
  - bash
  distributions:
  - arch
  - debian
  - ubuntu
  - fedora
  - rhel
  - rocky
  - almalinux
  - opensuse-leap
  - opensuse-tumbleweed
  - nixos
  notes:
    tr: journalctl systemd ister. Alpine/Void/Gentoo OpenRC varsayılanında ayrı uygulama kullanın.
    en: journalctl needs systemd. On Alpine/Void/Gentoo OpenRC defaults use the other implementation.
- id: linux-syslog-file
  commands:
  - tail
  - dmesg
  examples:
  - command: tail -n 50 /var/log/messages
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Klasik syslog dosyasından son satırlar (yol distroya göre değişebilir).
      en: Last lines from a classic syslog file (path may vary by distro).
  - command: dmesg | tail -n 40
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Çekirdek halka tamponu — journalctl değildir.
      en: Kernel ring buffer — not journalctl.
  operating_systems:
  - linux
  platforms:
  - linux
  shells:
  - bash
  distributions:
  - alpine
  - void
  - gentoo
  notes:
    tr: '/var/log/messages veya /var/log/syslog yoksa na; journalctl varsaymayın.'
    en: 'If /var/log/messages or /var/log/syslog is absent, mark na; do not assume journalctl.'
- id: windows-winevent
  commands:
  - get-winevent
  examples:
  - command: Get-WinEvent -LogName System -MaxEvents 20
    risk: safe
    shell: powershell
    privilege: none
    explanation:
      tr: System kanalından son 20 olayı getirir.
      en: Fetches the latest 20 System-channel events.
  operating_systems:
  - windows
  platforms:
  - windows
  shells:
  - powershell
- id: macos-log
  commands:
  - log
  examples:
  - command: log show --last 5m --style compact
    risk: safe
    shell: zsh
    privilege: none
    explanation:
      tr: Son 5 dakikalık kompakt günlükten kuyruk alır.
      en: Tails a compact log from the last 5 minutes.
  operating_systems:
  - macos
  platforms:
  - macos
  shells:
  - zsh
- id: kernel-dmesg
  commands:
  - dmesg
  examples:
  - command: dmesg | tail -n 40
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Son çekirdek mesajları.
      en: Recent kernel messages.
  platforms:
  - linux
  - macos
  - bsd
  shells:
  - bash
verification:
  status: draft
  sources:
  - man 1 journalctl
  - man 1 log
  - man 1 dmesg
  - man 1 tail
  notes: NV-121 multi-OS fill; still draft — not human-verified.
tags:
- logs
- journal
related_commands:
- journalctl
- get-winevent
- log
- dmesg
- tail
- get-content
related_tasks:
- list-running-services
