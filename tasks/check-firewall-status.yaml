schema_version: 2
kind: task
id: check-firewall-status
name:
  tr: Güvenlik duvarı durumunu kontrol et
  en: Check firewall status
summary:
  tr: ufw / firewall-cmd / pfctl / netsh ile durum okuma (kural silme yok).
  en: Read status via ufw / firewall-cmd / pfctl / netsh (no rule deletes).
category: security
intent:
  tr:
  - firewall durumu
  - ufw status
  - pfctl kurallar
  en:
  - firewall status
  - ufw status
  - pfctl rules
implementations:
- id: linux-ufw
  commands:
  - ufw
  examples:
  - command: sudo ufw status verbose
    risk: safe
    shell: bash
    privilege: elevated
    explanation:
      tr: Aktif kuralları ve varsayılanları gösterir (Debian/Ubuntu ailesi).
      en: Shows active rules and defaults (Debian/Ubuntu family).
  platforms:
  - linux
  shells:
  - bash
  distributions:
  - debian
  - ubuntu
  - linux-mint
  - pop-os
  notes:
    tr: Kurulu değilse na — firewalld/nft ile karıştırma.
    en: If absent, na — do not treat as firewalld/nft.
- id: linux-firewalld
  commands:
  - firewall-cmd
  examples:
  - command: firewall-cmd --state
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Çalışıyorsa running yazar (Fedora/RHEL/openSUSE ailesi).
      en: Prints running when active (Fedora/RHEL/openSUSE family).
  platforms:
  - linux
  shells:
  - bash
  distributions:
  - fedora
  - rhel
  - rocky
  - almalinux
  - opensuse-leap
  - opensuse-tumbleweed
  - sles
- id: linux-nft
  commands:
  - nft
  examples:
  - command: sudo nft list ruleset
    risk: safe
    shell: bash
    privilege: elevated
    explanation:
      tr: nftables kurallarını listeler (ufw/firewalld sarmalayıcısı değilse ham tablo).
      en: Lists nftables ruleset (raw tables when not wrapped by ufw/firewalld).
  platforms:
  - linux
  shells:
  - bash
  distributions:
  - alpine
  - void
  - gentoo
  - arch
  - debian
  - fedora
  notes:
    tr: Birçok distroda düşük seviye araçtır; ufw/firewalld varsa önce onları tercih edin.
    en: Low-level on many distros; prefer ufw/firewalld when those are the host firewall.
- id: bsd-pfctl
  commands:
  - pfctl
  examples:
  - command: sudo pfctl -s info
    risk: safe
    shell: bash
    privilege: elevated
    explanation:
      tr: PF durum özetini gösterir.
      en: Shows PF status summary.
  platforms:
  - bsd
  - macos
  shells:
  - bash
- id: windows-netsh
  commands:
  - netsh
  examples:
  - command: netsh advfirewall show allprofiles
    risk: safe
    shell: cmd
    privilege: none
  operating_systems:
  - windows
  platforms:
  - windows
  shells:
  - cmd
verification:
  status: draft
  sources:
  - man 8 ufw
  - man 1 firewall-cmd
  - man 8 nft
  - man 8 pfctl
  notes: NV-121 multi-OS fill; still draft — not human-verified.
tags:
- firewall
- security
related_commands:
- ufw
- firewall-cmd
- nft
- iptables
- pfctl
- netsh
related_tasks:
- check-open-ports
