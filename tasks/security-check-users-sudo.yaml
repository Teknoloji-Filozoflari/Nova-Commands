schema_version: 2
kind: task
id: security-check-users-sudo
name:
  tr: 5) Kullanıcılar ve sudo
  en: 5) Users and sudo
summary:
  tr: Kimler login/sudo hakkına sahip — salt okunur; sudoers’a kör yazma yok.
  en: Who can login/sudo — read-only; no blind sudoers writes.
description:
  tr: |-
    Neden: Gereksiz sudo/NOPASSWD yatay hareketi kolaylaştırır; bozuk sudoers kilitleyebilir.

    Kontrol listesi durumları (Nova yerel): unchecked / ok / review / na.
    Örnekler belgeleme içindir — otomatik çalışmaz.

    Platform dürüstlüğü: Linux getent/sudo/visudo; macOS dscl + sudo; OpenBSD doas (sudo değildir);
    Windows’ta sudo yoktur — Administrators/UAC (whoami /groups). Get-LocalUser henüz bankada yok.

    İsteğe bağlı düzeltme: visudo/doas.conf ile düzenleyin; sözdizimini doğrulayın; ikinci root oturumu
    açık tutun. Hesap silme bu adımın parçası değil.
  en: |-
    Why: Unnecessary sudo/NOPASSWD eases lateral movement; broken sudoers can lock you out.

    Checklist states (Nova local): unchecked / ok / review / na.
    Examples are documentation only — never auto-run.

    Platform honesty: Linux getent/sudo/visudo; macOS dscl + sudo; OpenBSD doas (not sudo); Windows
    has no sudo — Administrators/UAC via whoami /groups. Get-LocalUser is not yet in the bank.

    Optional fix: Edit with visudo/doas.conf; verify syntax; keep a second root session. Account
    deletion is out of scope here.
category: security
tags:
- security
- checklist
- sudo
- users
intent:
  tr:
  - güvenlik kontrol 5
  - sunucu güvenlik kontrolü
  - 5) Kullanıcılar ve sudo
  en:
  - security check 5
  - server security checklist
  - 5) Users and sudo
implementations:
- id: linux-sudo
  platforms:
  - linux
  shells:
  - bash
  commands:
  - getent
  - id
  - sudo
  - visudo
  - last
  examples:
  - command: 'getent passwd | awk -F: ''$3>=1000 {print $1,$3}'''
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: İnsan kullanıcı adayları (UID≥1000; politika dağıtıma göre).
      en: Human user candidates (UID≥1000; policy varies by distro).
  - command: getent group sudo wheel | cat; sudo -l
    risk: safe
    shell: bash
    privilege: user
    explanation:
      tr: 'sudo/wheel üyelikleri + kendi sudo hakları. Şüpheli: bilinmeyen NOPASSWD ALL.'
      en: 'sudo/wheel membership + own sudo rights. Suspicious: unknown NOPASSWD ALL.'
  - command: sudo visudo -c
    risk: safe
    shell: bash
    privilege: elevated
    explanation:
      tr: sudoers sözdizimi kontrolü (yazmaz).
      en: sudoers syntax check (non-writing).
- id: windows-admins
  platforms:
  - windows
  shells:
  - powershell
  commands:
  - whoami
  - icacls
  examples:
  - command: whoami /groups
    risk: safe
    shell: cmd
    privilege: none
    explanation:
      tr: 'Grup üyelikleri. Şüpheli: beklenmeyen Administrators. Windows’ta sudo yoktur.'
      en: 'Group memberships. Suspicious: unexpected Administrators. Windows has no sudo.'
  - command: whoami /priv
    risk: safe
    shell: cmd
    privilege: none
    explanation:
      tr: Etkin ayrıcalıklar (UAC yüzeyi).
      en: Enabled privileges (UAC surface).
  notes:
    tr: Get-LocalUser/net localgroup henüz bankada yok; whoami ile yetinilir.
    en: Get-LocalUser/net localgroup not yet in the bank; whoami is the honest stopgap.
- id: macos-admin
  platforms:
  - macos
  shells:
  - zsh
  commands:
  - dscl
  - id
  - sudo
  - whoami
  examples:
  - command: dscl . -list /Users
    risk: safe
    shell: zsh
    privilege: none
    explanation:
      tr: Yerel dizin kullanıcıları (getent değildir).
      en: Local directory users (not getent).
  - command: id; groups; sudo -l
    risk: safe
    shell: zsh
    privilege: user
    explanation:
      tr: 'admin grup yüzeyi + kendi sudo hakları. Şüpheli: bilinmeyen NOPASSWD.'
      en: 'admin group surface + own sudo rights. Suspicious: unknown NOPASSWD.'
- id: bsd-priv
  platforms:
  - bsd
  shells:
  - bash
  commands:
  - id
  - who
  - doas
  - sudo
  - visudo
  examples:
  - command: id; who; groups
    risk: safe
    shell: bash
    privilege: none
    explanation:
      tr: Oturum kimliği ve gruplar.
      en: Session identity and groups.
  - command: sudo -l 2>/dev/null || doas -n true 2>/dev/null || echo 'priv-tool-na'
    risk: safe
    shell: bash
    privilege: user
    explanation:
      tr: FreeBSD’de sık sudo; OpenBSD’de doas. İkisini eşanlamlı sanma.
      en: FreeBSD often uses sudo; OpenBSD uses doas. Do not treat them as synonyms.
  - command: sudo visudo -c 2>/dev/null || echo 'visudo-na-check-doas-conf'
    risk: safe
    shell: bash
    privilege: elevated
    explanation:
      tr: sudoers sözdizimi (varsa). OpenBSD doas.conf ayrı dosyadır.
      en: sudoers syntax when present. OpenBSD doas.conf is a separate file.
