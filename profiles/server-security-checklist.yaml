schema_version: 2
kind: profile
id: server-security-checklist
name:
  tr: Sunucu güvenlik kontrolü
  en: Server security checklist
summary:
  tr: Homelab/sunucu için 10 aşamalı salt okunur güvenlik kontrol sırası. Otomatik çalışmaz; durum Nova’da
    yerel tutulur.
  en: 10-stage read-only security check sequence for homelab/servers. Never auto-runs; states stay local
    in Nova.
description:
  tr: 'Aşamalar: OS/hesap → güncellemeler → SSH → firewall/portlar → kullanıcılar/sudo → Docker → reverse
    proxy/TLS → DNS/VPN → yedek/restore drill → loglar/olay. Durumlar: unchecked/ok/review/na. Port taraması/saldırı
    adımı yok. Password auth/firewall kör kapatma yok.'
  en: 'Stages: OS/accounts → updates → SSH → firewall/ports → users/sudo → Docker → reverse proxy/TLS
    → DNS/VPN → backup/restore drill → logs/incident. States: unchecked/ok/review/na. No port-scan/attack
    steps. No blind password-auth/firewall lockdown.'
operating_systems:
- linux
- macos
- windows
server_platforms:
- docker-engine
