title:
  tr: Sanallaştırma (KVM / libvirt / QEMU)
  en: Virtualization (KVM / libvirt / QEMU)
summary:
  tr: Hipervizör katmanları ve virsh/qemu-img — konteyner orkestrasyonu değil.
  en: Hypervisor layers and virsh/qemu-img — not container orchestration.
