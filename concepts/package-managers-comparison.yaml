body:
  tr: "Aynı iş farklı dağıtımlarda farklı komutlarla yapılır. Aşağıdaki tablolar **sık\nokuma/kurulum**\
    \ yollarını özetler; bayrak uydurma yok. Ayrıntılı Markdown:\n`docs/package-managers-comparison.md`.\
    \ Arch satırları Nova tercihine göre önde.\n\n### Sistem güncelle / kur / ara (çekirdek + genişleme)\n\
    \n| Amaç | Arch (pacman) | Debian (apt) | Fedora (dnf) | openSUSE (zypper) | Alpine (apk) | Void (xbps)\
    \ |\n|------|---------------|--------------|--------------|-------------------|--------------|-------------|\n\
    | Yenile + yükselt | `pacman -Syu` | `apt update && apt upgrade` | `dnf upgrade` | Leap: `zypper update`\
    \ / TW: `zypper dup` | `apk update && apk upgrade` | `xbps-install -Su` |\n| Kur | `pacman -S ad`\
    \ | `apt install ad` | `dnf install ad` | `zypper install ad` | `apk add ad` | `xbps-install ad` |\n\
    | Kaldır | `pacman -Rns ad` | `apt purge ad` | `dnf remove ad` | `zypper remove ad` | `apk del ad`\
    \ | `xbps-remove ad` |\n| Ara | `pacman -Ss q` | `apt search q` | `dnf search q` | `zypper search\
    \ q` | `apk search q` | `xbps-query -Rs q` |\n\nGentoo: `emerge --sync` + `emerge -uDN @world` / `emerge\
    \ --ask ad`.  \nSolus: `eopkg upgrade` / `eopkg install`. Slackware: `slackpkg update` / `install`.\
    \  \nOpenWrt: `opkg update` / `opkg install` (flash alanı!).  \nAtomik Fedora: `rpm-ostree upgrade`\
    \ / `rpm-ostree install` (reboot).\n\n### Sorgulama (yerel)\n\n| Amaç | pacman | dpkg/apt | rpm/dnf\
    \ | xbps | apk |\n|------|--------|----------|---------|------|-----|\n| Kurulu mu? | `pacman -Q ad`\
    \ | `dpkg -l ad` | `rpm -q ad` | `xbps-query ad` | `apk info -e ad` |\n| Dosya → paket | `pacman -Qo\
    \ yol` | `dpkg -S yol` | `rpm -qf yol` | `xbps-query -o yol` | `apk info -W yol` |\n\n### Deklaratif\
    \ / profil\n\n| Amaç | Nix (modern) | Guix |\n|------|--------------|------|\n| Ara | `nix search\
    \ nixpkgs q` | `guix search q` |\n| Profil kur | `nix profile install nixpkgs#ad` | `guix install\
    \ ad` |\n| Geçici kabuk | `nix shell` / `nix develop` | `guix shell` |\n| Sistem uygula | `nixos-rebuild\
    \ switch` (NixOS) | `guix system …` (Guix System) |\n\nEski `nix-env` / klasik `nix-shell` modern\
    \ CLI ile **karıştırılmaz** — bkz. `nix-guix`.\n\n### Windows / macOS (Faz 5 draft)\n\n| Amaç | WinGet\
    \ | Homebrew | MacPorts |\n|------|--------|----------|----------|\n| Ara | `winget search` | `brew\
    \ search` | `port search` |\n| Kur | `winget install` | `brew install` | `sudo port install` |\n|\
    \ Liste | `winget list` | `brew list` | `port installed` |\n\nOS güncellemesi macOS’ta `softwareupdate`\
    \ — `brew upgrade` değildir. `brew` ≠ `port`.\n\n### BSD (Faz 6 draft)\n\n| Amaç | FreeBSD pkg | OpenBSD\
    \ pkg_add | NetBSD pkgin |\n|------|-------------|-----------------|--------------|\n| Ara | `pkg\
    \ search` | `pkg_info -Q` | `pkgin search` |\n| Liste / bilgi | `pkg info` | `pkg_info` | `pkgin list`\
    \ |\n| İndeks güncelle | `pkg update` | (FAQ) | `pkgin update` |\n\nFreeBSD Ports / pkgsrc **kaynak\
    \ ağaçlarıdır** (ayrı kayıt). DragonFly `pkg` ≠ FreeBSD `pkg`.\n\n**Kural:** Bilinmeyen paket adı\
    \ **uydurulmaz**. Yeni PM kayıtları çoğunlukla `draft`.\nNova Arch host’ta pacman notunu önce tutar.\n"
  en: "The same job uses different commands per distro. Tables below summarize **common\nupdate/install/query**\
    \ paths — no invented flags. Longer Markdown:\n`docs/package-managers-comparison.md`. Arch rows first\
    \ per Nova preference.\n\n### System update / install / search (core + expansion)\n\n| Goal | Arch\
    \ (pacman) | Debian (apt) | Fedora (dnf) | openSUSE (zypper) | Alpine (apk) | Void (xbps) |\n|------|---------------|--------------|--------------|-------------------|--------------|-------------|\n\
    | Refresh + upgrade | `pacman -Syu` | `apt update && apt upgrade` | `dnf upgrade` | Leap: `zypper\
    \ update` / TW: `zypper dup` | `apk update && apk upgrade` | `xbps-install -Su` |\n| Install | `pacman\
    \ -S name` | `apt install name` | `dnf install name` | `zypper install name` | `apk add name` | `xbps-install\
    \ name` |\n| Remove | `pacman -Rns name` | `apt purge name` | `dnf remove name` | `zypper remove name`\
    \ | `apk del name` | `xbps-remove name` |\n| Search | `pacman -Ss q` | `apt search q` | `dnf search\
    \ q` | `zypper search q` | `apk search q` | `xbps-query -Rs q` |\n\nGentoo: `emerge --sync` + `emerge\
    \ -uDN @world` / `emerge --ask name`.  \nSolus: `eopkg upgrade` / `eopkg install`. Slackware: `slackpkg\
    \ update` / `install`.  \nOpenWrt: `opkg update` / `opkg install` (watch flash!).  \nAtomic Fedora:\
    \ `rpm-ostree upgrade` / `rpm-ostree install` (reboot).\n\n### Local queries\n\n| Goal | pacman |\
    \ dpkg/apt | rpm/dnf | xbps | apk |\n|------|--------|----------|---------|------|-----|\n| Installed?\
    \ | `pacman -Q name` | `dpkg -l name` | `rpm -q name` | `xbps-query name` | `apk info -e name` |\n\
    | File → package | `pacman -Qo path` | `dpkg -S path` | `rpm -qf path` | `xbps-query -o path` | `apk\
    \ info -W path` |\n\n### Declarative / profiles\n\n| Goal | Nix (modern) | Guix |\n|------|--------------|------|\n\
    | Search | `nix search nixpkgs q` | `guix search q` |\n| Profile install | `nix profile install nixpkgs#name`\
    \ | `guix install name` |\n| Ephemeral shell | `nix shell` / `nix develop` | `guix shell` |\n| Apply\
    \ system | `nixos-rebuild switch` (NixOS) | `guix system …` (Guix System) |\n\nDo **not** mix legacy\
    \ `nix-env` / classic `nix-shell` with the modern CLI —\nsee `nix-guix`.\n\n### Windows / macOS (Faz\
    \ 5 draft)\n\n| Goal | WinGet | Homebrew | MacPorts |\n|------|--------|----------|----------|\n|\
    \ Search | `winget search` | `brew search` | `port search` |\n| Install | `winget install` | `brew\
    \ install` | `sudo port install` |\n| List | `winget list` | `brew list` | `port installed` |\n\n\
    OS updates on macOS use `softwareupdate` — not `brew upgrade`. `brew` ≠ `port`.\n\n### BSD (Faz 6\
    \ draft)\n\n| Goal | FreeBSD pkg | OpenBSD pkg_add | NetBSD pkgin |\n|------|-------------|-----------------|--------------|\n\
    | Search | `pkg search` | `pkg_info -Q` | `pkgin search` |\n| List / info | `pkg info` | `pkg_info`\
    \ | `pkgin list` |\n| Update index | `pkg update` | (see FAQ) | `pkgin update` |\n\nFreeBSD Ports\
    \ / pkgsrc are **source trees** (separate records). DragonFly `pkg` ≠ FreeBSD `pkg`.\n\n**Rule:**\
    \ unknown package names are **not invented**. New PM records are mostly\n`draft`. On Arch hosts Nova\
    \ keeps pacman notes first.\n"
