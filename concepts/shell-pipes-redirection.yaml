graded_examples:
- title:
    tr: Basit boru
    en: Simple pipe
  command: printf "b\na\nb\n" | sort | uniq -c
  explanation:
    tr: Satırları sıralar ve tekrarları sayar.
    en: Sorts lines and counts duplicates.
  difficulty: beginner
  risk: safe
  related_commands:
  - sort
  - uniq
- title:
    tr: Dosyaya yaz (dikkat)
    en: Write to file (careful)
  command: echo hello > /tmp/nova-guide-demo.txt
  explanation:
    tr: '> hedefi üzerine yazar; mevcut dosyayı siler. Öğrenme için /tmp kullanın.'
    en: '> overwrites the target; destroys existing content. Use /tmp while learning.'
  difficulty: intermediate
  risk: caution
  related_commands:
  - echo
  warnings:
  - tr: '> mevcut dosyayı siler; kritik yollarda kullanmayın.'
    en: '> truncates existing files; avoid critical paths.'
callouts:
- kind: warning
  text:
    tr: '>> ekler; > üzerine yazar. Yanlış yönlendirme veri kaybettirir.'
    en: '>> appends; > overwrites. Wrong redirection loses data.'
- kind: tip
  text:
    tr: Önce komutu tek başına çalıştırıp çıktıyı görün; sonra boru ekleyin.
    en: Run each stage alone first, then add the pipe.
safe_exercises:
- title:
    tr: /tmp üzerinde boru
    en: Pipe on /tmp
  prompt:
