body:
  tr: '## Üç standart akış


    Her süreç **stdin (0)**, **stdout (1)** ve **stderr (2)** ile başlar. Kabuk bunları dosyalara veya
    başka süreçlere bağlar.


    ## Yönlendirme


    | Operatör | Anlamı |

    |----------|--------|

    | `>` | stdout’u dosyaya yazar (üzerine yazar) |

    | `>>` | stdout’u sona ekler |

    | `<` | stdin’i dosyadan okur |

    | `2>` | stderr’i dosyaya yazar |

    | `2>&1` | stderr’i stdout’a birleştirir |


    ## Boru (`|`)


    Sol komutun stdout’u sağın stdin’ine bağlanır. Ara dosya gerekmez. stderr varsayılan olarak boruya
    girmez.


    Örnek: `cut -d: -f7 /etc/passwd | sort | uniq -c | sort -nr`


    ## tee ve xargs


    `tee` hem dosyaya hem boruya kopyalar. `xargs` stdin’i argümana çevirir.

    '
  en: '## Three standard streams


    Processes start with **stdin (0)**, **stdout (1)**, and **stderr (2)**. The shell attaches them to
    files or other processes.


    ## Redirection


    | Operator | Meaning |

    |----------|---------|

    | `>` | write stdout (truncate) |

    | `>>` | append stdout |

    | `<` | read stdin from a file |

    | `2>` | write stderr to a file |

    | `2>&1` | merge stderr into stdout |


    ## Pipes (`|`)


    Connect left stdout to right stdin. No intermediate file. stderr does not enter the pipe by default.


    Example: `cut -d: -f7 /etc/passwd | sort | uniq -c | sort -nr`


    ## tee and xargs


    `tee` copies to a file and downstream. `xargs` turns stdin into arguments.

    '
