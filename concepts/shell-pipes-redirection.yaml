graded_examples:
- title:
    tr: Basit boru
    en: Simple pipe
  command: printf "b\na\nb\n" | sort | uniq -c
  explanation:
    tr: Satırları sıralar ve tekrarları sayar.
    en: Sorts lines and counts duplicates.
  difficulty: beginner
  risk: safe
  related_commands:
  - sort
  - uniq
- title:
    tr: Dosyaya yaz (dikkat)
    en: Write to file (careful)
  command: echo hello > /tmp/nova-guide-demo.txt
  explanation:
    tr: '''> hedefi üzerine yazar; mevcut dosyayı siler. Öğrenme için /tmp kullanın.'
    en: '''> overwrites the target; destroys existing content. Use /tmp while learning.'
  difficulty: intermediate
  risk: caution
  related_commands:
  - echo
  warnings:
  - tr: '> mevcut dosyayı siler; kritik yollarda kullanmayın.'
    en: '> truncates existing files; avoid critical paths.'
- title:
    tr: Ekleme >>
    en: Append >>
  command: echo bir > /tmp/nova-a.txt; echo iki >> /tmp/nova-a.txt; cat /tmp/nova-a.txt
  explanation:
    tr: '> ilk satırı yazar; >> ikinciyi ekler.'
    en: '> writes the first line; >> appends the second.'
  difficulty: beginner
  risk: caution
  related_commands:
  - echo
  - cat
- title:
    tr: stderr ayır
    en: Split stderr
  command: ls /tmp /yok-xyz 2> /tmp/nova-err.txt; wc -l /tmp/nova-err.txt
  explanation:
    tr: Hata satırlarını ayrı dosyaya gönderir; stdout ekranda kalabilir.
    en: Sends error lines to a separate file; stdout may still show.
  difficulty: intermediate
  risk: caution
  related_commands:
  - ls
  - wc
- title:
    tr: passwd kabuk sayımı
    en: Shell counts from passwd
  command: 'cut -d: -f7 /etc/passwd | sort | uniq -c | sort -nr | head'
  explanation:
    tr: Sistemdeki kabuk yollarının kullanım sıklığına bakış (salt okuma).
    en: Read-only view of shell-path frequencies on the system.
  difficulty: intermediate
  risk: safe
  related_commands:
  - cut
  - sort
  - uniq
  - head
callouts:
- kind: warning
  text:
