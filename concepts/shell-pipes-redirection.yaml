id: shell-pipes-redirection
kind: nova-commands-concept
title:
  tr: Borular ve yönlendirme
  en: Pipes and redirection
summary:
  tr: stdin/stdout/stderr, `>`, `>>`, `<` ve `|` ile komut zincirleri.
  en: stdin/stdout/stderr, `>`, `>>`, `<`, and `|` pipelines.
difficulty: beginner
tags:
