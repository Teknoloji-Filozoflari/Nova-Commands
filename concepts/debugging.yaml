id: debugging
kind: nova-commands-concept
title:
  tr: Çalışma anı hata ayıklama
  en: Runtime debugging
summary:
  tr: strace, lsof, loglar ve süreç araçlarıyla “neden başarısız?” sorusuna yaklaşım.
  en: Approaching “why did it fail?” with strace, lsof, logs, and process tools.
difficulty: intermediate
