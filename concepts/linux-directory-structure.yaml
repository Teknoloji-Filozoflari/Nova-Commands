intro:
  tr: Linux’ta her şey tek bir ağaçtır; kök `/` dir. Bu rehber önemli dizinleri, mutlak/göreli yolu ve güvenli keşif komutlarını öğretir.
  en: On Linux everything hangs from one tree rooted at `/`. This guide teaches key directories, absolute/relative paths, and safe exploration commands.
body:
  tr: |
    ## Tek ağaç, kök `/`

    Windows’taki `C:`, `D:` sürücü harfleri yoktur. Diskler ve aygıtlar ağacın bir dalına **bağlanır** (`mount`). Önce haritayı öğrenin; sonra komutlarla güvenli şekilde dolaşın.

    ## Önemli dizinler

    | Dizin | İçeriği |
    |-------|---------|
    | `/` | Kök. Her şey bunun altındadır. |
    | `/home` | Kullanıcı evleri (`/home/ayse`). Kişisel dosya ve ayarlar. |
    | `/root` | root kullanıcısının evi ( `/home` altında değildir). |
    | `/etc` | Sistem ve servis yapılandırması (`passwd`, `fstab`, `hostname` …). |
    | `/bin`, `/sbin` | Temel kullanıcı ve yönetim komutları; birçok dağıtımda `/usr/bin` ve `/usr/sbin` bağlarıdır. |
    | `/usr` | Kurulu programlar, kütüphaneler, belgeler (`bin`, `lib`, `share`). |
    | `/var` | Değişen veri: günlükler (`/var/log`), önbellek, posta, veritabanı dosyaları. |
    | `/tmp` | Geçici dosyalar; yeniden başlatmada silinebilir. |
    | `/opt` | Üçüncü taraf / isteğe bağlı yazılımlar. |
    | `/dev` | Aygıt düğümleri (`/dev/sda`, `/dev/tty`, `/dev/null`). |
    | `/proc`, `/sys` | Çekirdek ve süreçlerin canlı görünümü; gerçek diskte yer tutmaz. |
    | `/boot` | Önyükleyici ve çekirdek dosyaları. |
    | `/mnt`, `/media` | Geçici bağlama noktaları (USB, ISO, …). |

    Dağıtıma göre birleşme noktaları (usr-merge) değişebilir; emin değilseniz `ls -ld` ve `man hier` ile bakın.

    ## Yol kavramları

    | Gösterim | Anlamı |
    |----------|--------|
    | `/etc/passwd` | Mutlak yol — nerede olursanız olun aynı hedef. |
    | `belgeler/not.txt` | Göreli yol — çalışma dizinine göre. |
    | `.` | Bulunduğunuz dizin. |
    | `..` | Bir üst dizin. |
    | `~` | Ev dizininiz. |
    | `cd -` | Bir önceki çalışma dizinine dönüş. |

    ## Keşif komutları

    `pwd` konumu yazar. `ls`, `ls -la`, `ls -lh` listeler. `cd` dizin değiştirir. `tree -L 2` (kuruluysa) ağacı çizer. `file` tür söyler; `stat` ayrıntı verir. `find` dar kalıpla arar; `du -sh` dizin özeti, `df -h` dosya sistemi doluluğu gösterir.

    ## Güvenli pratik

    Denemeleri `~/pratik` veya `/tmp` altında yapın. Sistem dizinlerinde (`/etc`, `/boot`, `/usr`) yazmayın; salt okuma ile keşfedin. `rm -rf /` veya yanlış boşluklu silme felakettir — bu rehber silme öğretmez.
  en: |
    ## One tree, root `/`

    There are no Windows-style `C:` / `D:` drive letters. Disks and devices are **mounted** onto a branch of the tree. Learn the map first; then explore with safe commands.

    ## Important directories

    | Directory | Contents |
    |-----------|----------|
    | `/` | Root of everything. |
    | `/home` | User homes (`/home/ada`). Personal files and settings. |
    | `/root` | root’s home (not under `/home`). |
    | `/etc` | System and service configuration (`passwd`, `fstab`, `hostname`, …). |
    | `/bin`, `/sbin` | Essential user and admin commands; often merged into `/usr/bin` and `/usr/sbin`. |
    | `/usr` | Installed programs, libraries, docs (`bin`, `lib`, `share`). |
    | `/var` | Variable data: logs (`/var/log`), caches, mail, database files. |
    | `/tmp` | Temporary files; may be cleared on reboot. |
    | `/opt` | Optional / third-party software. |
    | `/dev` | Device nodes (`/dev/sda`, `/dev/tty`, `/dev/null`). |
    | `/proc`, `/sys` | Live kernel/process views; not real on-disk storage. |
    | `/boot` | Bootloader and kernel files. |
    | `/mnt`, `/media` | Temporary mount points (USB, ISO, …). |

    Merge layouts (usr-merge) vary by distro; when unsure, check `ls -ld` and `man hier`.

    ## Path concepts

    | Form | Meaning |
    |------|---------|
    | `/etc/passwd` | Absolute — same target from anywhere. |
    | `docs/note.txt` | Relative — from the working directory. |
    | `.` | Current directory. |
    | `..` | Parent directory. |
    | `~` | Your home directory. |
    | `cd -` | Return to the previous working directory. |

    ## Exploration commands

    `pwd` prints location. `ls`, `ls -la`, `ls -lh` list. `cd` changes directory. `tree -L 2` (if installed) draws a tree. `file` reports type; `stat` shows detail. `find` searches with narrow patterns; `du -sh` summarizes a directory; `df -h` shows filesystem free space.

    ## Safe practice

    Practice under `~/practice` or `/tmp`. Do not write into system dirs (`/etc`, `/boot`, `/usr`); explore read-only. This guide does not teach destructive deletes.
