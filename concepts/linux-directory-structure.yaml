command_table:
- id: pwd
  purpose:
    tr: Çalışma dizinini yazdırır.
    en: Print working directory.
  learning_level: beginner
- id: ls
  purpose:
    tr: Dizin içeriğini listeler (-l/-a/-h sık kullanılır).
    en: List directory contents (-l/-a/-h common).
  learning_level: beginner
- id: cd
  purpose:
    tr: Çalışma dizinini değiştirir.
    en: Change the working directory.
  learning_level: beginner
- id: tree
  purpose:
    tr: Dizin ağacını görsel listeler (ayrı paket olabilir).
    en: List contents as a tree (may be a separate package).
  learning_level: beginner
- id: file
  purpose:
    tr: Dosya türünü içeriğine bakarak söyler.
    en: Determine file type from contents.
  learning_level: beginner
- id: stat
  purpose:
    tr: Boyut, izin, sahip ve zaman damgalarını gösterir.
    en: Show size, mode, owner, and timestamps.
  learning_level: beginner
- id: find
  purpose:
    tr: Ağaçta isim/tür ile dosya arar.
    en: Search a tree by name/type.
  learning_level: intermediate
- id: du
  purpose:
    tr: Dizin disk kullanımını özetler.
    en: Summarize directory disk usage.
  learning_level: beginner
- id: df
  purpose:
    tr: Dosya sistemi boş alanını gösterir.
    en: Report filesystem disk space usage.
  learning_level: beginner
graded_examples:
- title:
    tr: Konum ve ev
    en: Location and home
  command: pwd; ls -la ~
  explanation:
    tr: Çalışma dizinini ve evinizdeki (gizli dahil) girdileri görün.
    en: See the working directory and home entries including hidden ones.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  related_commands:
  - pwd
  - ls
- title:
    tr: /etc’ye bak (yazmadan)
    en: Peek at /etc (read-only)
  command: ls -lh /etc | head
  explanation:
    tr: Yapılandırma dizininin üstünü okunur boyutlarla listeler; hiçbir dosyayı düzenlemez.
    en: Lists the top of the config directory with human sizes; edits nothing.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  related_commands:
  - ls
  - head
- title:
    tr: Üst dizin ve geri dönüş
    en: Parent dir and return
  command: cd /tmp && pwd && cd - && pwd
  explanation:
    tr: /tmp’ye gidip cd - ile önceki dizine dönün; - anlamını pekiştirir.
    en: Go to /tmp then return with cd -; reinforces the dash meaning.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  related_commands:
  - cd
  - pwd
- title:
    tr: Ağaç (kuruluysa)
    en: Tree (if installed)
  command: tree -L 2 /usr 2>/dev/null || ls -la /usr
  explanation:
    tr: tree yoksa ls yedek planıdır. /usr altında iki seviye keşif.
    en: Falls back to ls if tree is missing. Two-level peek under /usr.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  related_commands:
  - tree
  - ls
- title:
    tr: Tür ve stat
    en: Type and stat
  command: file /bin/ls; stat -c '%A %U %G %n' /etc/hostname 2>/dev/null || stat /etc/hostname
  explanation:
    tr: file uzantıya güvenmez; stat izin/sahip özetler. GNU -c yoksa düz stat kullanın.
    en: file does not trust extensions; stat summarizes mode/owner. Use plain stat if GNU -c is absent.
  difficulty: intermediate
  risk: safe
  platforms:
  - linux
  related_commands:
  - file
  - stat
- title:
    tr: Dar find + du
    en: Narrow find + du
  command: find /etc -maxdepth 1 -name '*.conf' 2>/dev/null | head; du -sh /var/log 2>/dev/null || du -sh /tmp
  explanation:
    tr: Kökten geniş tarama yok; maxdepth ile conf’lara bakın. du ile log/tmp özeti (izin hatası olabilir — normal).
    en: No broad scan from root; list conf files with maxdepth. du summarizes log/tmp (permission errors are normal).
  difficulty: intermediate
  risk: safe
  platforms:
  - linux
  related_commands:
  - find
  - du
- title:
    tr: df ile doluluk
    en: Free space with df
  command: df -h
  explanation:
    tr: Bağlı dosya sistemlerinin boyut ve kullanımını okunur biçimde gösterir.
    en: Shows size and use of mounted filesystems in human-readable form.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  related_commands:
  - df
callouts:
- kind: tip
  text:
    tr: 'Önce harita, sonra komut: /etc yapılandırma, /var değişen veri, /home sizin alanınız, /tmp oyun alanı.'
    en: 'Map first, commands second: /etc config, /var variable data, /home your space, /tmp playground.'
- kind: tip
  text:
    tr: tree çoğu dağıtımda ayrı pakettir. Yoksa ls -R veya find . -maxdepth 2 kullanın.
    en: tree is often a separate package. If missing, use ls -R or find . -maxdepth 2.
- kind: warning
  text:
    tr: /etc, /boot, /usr altına yazmayın. Keşif salt okuma olsun. rm denemelerini yalnız ~/pratik veya /tmp’de yapın.
    en: Do not write under /etc, /boot, or /usr. Keep exploration read-only. Practice rm only under ~/practice or /tmp.
- kind: caution
  text:
    tr: /proc ve /sys sanalır; binlerce girdi vardır. ls /proc | head ile sınırlayın; rastgele yazmayın.
    en: /proc and /sys are virtual and huge. Limit with ls /proc | head; never write at random.
- kind: note
  text:
    tr: Bu rehber Linux FHS odaklıdır. macOS/BSD benzer hiyerarşi kullanır ama yollar birebir aynı değildir; Windows sürücü harfli ayrı modeldir.
    en: This guide is Linux FHS-oriented. macOS/BSD are similar but not identical; Windows drive letters are a different model.
safe_exercises:
- title:
    tr: Haritayı ezberleme
    en: Learn the map
  prompt:
    tr: ls / çıktısında gördüğünüz her üst dizini (home, etc, var, usr, tmp, opt, dev, proc …) kendi cümlenizle bir cümlede açıklayın.
    en: For each top-level name you see in ls / (home, etc, var, usr, tmp, opt, dev, proc, …) write one sentence explaining it.
  risk: safe
  related_commands:
  - ls
- title:
    tr: Güvenli oyun alanı
    en: Safe playground
  prompt:
    tr: mkdir -p ~/pratik/dizinler && cd ~/pratik/dizinler && pwd && ls -la. Tüm denemeleri burada tutun.
    en: mkdir -p ~/practice/dirs && cd ~/practice/dirs && pwd && ls -la. Keep all experiments here.
  risk: safe
  related_commands:
  - mkdir
  - cd
  - pwd
  - ls
- title:
    tr: tree veya find
    en: tree or find
  prompt:
    tr: tree -L 2 ~/pratik 2>/dev/null || find ~/pratik -maxdepth 2 -print. Çıktıyı yorumlayın.
    en: tree -L 2 ~/practice 2>/dev/null || find ~/practice -maxdepth 2 -print. Interpret the output.
  risk: safe
  related_commands:
  - tree
  - find
- title:
    tr: du ve df
    en: du and df
  prompt:
    tr: du -sh ~ /tmp; df -h. Ev ve /tmp özetini dosya sistemi doluluğuyla karşılaştırın (yazmadan).
    en: du -sh ~ /tmp; df -h. Compare home and /tmp summaries with filesystem free space (read-only).
  risk: safe
  related_commands:
  - du
  - df
