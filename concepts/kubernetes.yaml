title:
  tr: Kubernetes ve konteyner orkestrasyon
  en: Kubernetes and container orchestration
summary:
  tr: kubectl/Helm/CRI araçları — Docker Engine ile karıştırılmayan küme modeli.
  en: kubectl/Helm/CRI tools — cluster model distinct from Docker Engine alone.
difficulty: intermediate
