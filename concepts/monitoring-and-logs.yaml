id: monitoring-and-logs
kind: nova-commands-concept
format: topic-guide
title:
  tr: İzleme ve günlükler
  en: Monitoring and logs
summary:
  tr: journalctl, syslog dosyaları ve kaynak kullanımı; non-systemd dürüst ayrımı.
  en: journalctl, syslog files, and resource usage; honest non-systemd split.
intro:
  tr: Günlük okuma ve kaynak izleme; Alpine/Void/Gentoo’da journalctl varsayılan değildir.
  en: Log reading and resource monitoring; journalctl is not the default on Alpine/Void/Gentoo.
body:
  tr: 'systemd distrolarında `journalctl` birincil günlük aracıdır. OpenRC/runit dünyasında

    `/var/log/messages` veya servis logları kullanılır — bank görevleri bunu ayırır.

    `top`/`free`/`df` çapraz platformda kaynak görünümü verir (bayrak farklarıyla).'
  en: 'On systemd distros, `journalctl` is the primary log tool. In OpenRC/runit worlds,

    `/var/log/messages` or service logs apply — bank tasks split this honestly.

    `top`/`free`/`df` give cross-platform resource views (with flag differences).'
difficulty: intermediate
