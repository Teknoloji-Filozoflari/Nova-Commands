title:
  tr: Reverse proxy ve web sunucular
  en: Reverse proxies and web servers
summary:
  tr: nginx ve Caddy rolleri; TLS ve config test alışkanlıkları.
  en: Roles of nginx and Caddy; TLS and config-test habits.
