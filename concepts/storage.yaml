body:
  tr: "Disk ve dosya sistemi işleri **yanlış aygıt adıyla yıkıcı** olabilir. Önce okuma\naraçlarıyla haritayı\
    \ çıkarın.\n\n**Keşif (genelde güvenli):**\n- `lsblk -f` — ağaç, dosya sistemi, UUID/LABEL.\n- `df\
    \ -h` — bağlı dosya sistemlerinde boş alan.\n- `du -sh yol` — dizin boyutu.\n- `findmnt` / `mount`\
    \ — ne nereye bağlı.\n- `blkid` — UUID ve tür (çoğu zaman root ile daha dolu).\n\n**Bağlama:** `mount`\
    \ / `umount` (veya fstab / systemd `.mount`). Yanlış `umount`\naçık dosyaları bozabilir; meşgulse\
    \ `lsof` / `fuser` ile bakın.\n\n**Yüksek risk (yer tutucu aygıt; asla kopyala-yapıştır):**\n- `fdisk`\
    \ / `parted` — bölüm tablosu; `parted -l` önce okuyun.\n- `dd` — ham kopya; yanlış `of=` diski siler.\n\
    - `mkfs` / `mkfs.ext4` / `mkfs.xfs` / `mkfs.btrfs` / `mkfs.fat` — FS oluşturur;\n  mümkünse `-n` /\
    \ `-N` / `--help` ile başlayın (Arch: ilgili `*-progs` /\n  `dosfstools` / `util-linux` paketleri).\n\
    - `wipefs` — imza silme; önce listeleyin, silmede `-n` kuru koşu kullanın.\n- `fsck` — onarım; bağlı\
    \ FS’te tehlikeli; `-N` plan, `-M` bağlıları atlar.\n\n**`sync`:** Bellekteki yazıları diske iter;\
    \ kapatma/çıkarma öncesi kullanılır.\nDoğrulama için asla rastgele disklere `dd`/`mkfs` çalıştırmayın;\
    \ `verified`\nyalnız insan incelemesi sonrası (keşif araçlarının bir kısmı Faz 15’te\nverified’a yükseltildi).\n"
  en: "Disk and filesystem operations are **destructive on the wrong device**. Start with\nread-only discovery.\n\
    \n**Discovery (usually safe):**\n- `lsblk -f` — tree, filesystem, UUID/LABEL.\n- `df -h` — free space\
    \ on mounted filesystems.\n- `du -sh path` — directory size.\n- `findmnt` / `mount` — what is mounted\
    \ where.\n- `blkid` — UUID/type (often richer as root).\n\n**Mounting:** `mount` / `umount` (or fstab\
    \ / systemd `.mount`). A busy `umount` can\nfail; inspect with `lsof` / `fuser`.\n\n**High risk (placeholder\
    \ devices; never copy-paste blindly):**\n- `fdisk` / `parted` — partition tables; read with `parted\
    \ -l` first.\n- `dd` — raw copy; wrong `of=` wipes a disk.\n- `mkfs` / `mkfs.ext4` / `mkfs.xfs` /\
    \ `mkfs.btrfs` / `mkfs.fat` — create\n  filesystems; start with `-n` / `-N` / `--help` when available\
    \ (Arch packages:\n  matching `*-progs` / `dosfstools` / `util-linux`).\n- `wipefs` — signature wipe;\
    \ list first, use `-n` for dry-run before erase.\n- `fsck` — repair; dangerous on mounted FS; `-N`\
    \ plan, `-M` skips mounted.\n\n**`sync`:** Flushes buffered writes; used before unmount/shutdown.\n\
    Never run `dd`/`mkfs` against arbitrary disks to “validate” catalog entries;\n`verified` is for human\
    \ review only (some discovery tools graduated in phase 15).\n"
