command_table:
- id: lsblk
  purpose:
    tr: Blok aygıtları ağaç olarak listeler.
    en: List block devices.
  learning_level: intermediate
- id: df
  purpose:
    tr: Dosya sistemi disk kullanımı.
    en: Report file system disk space usage.
  learning_level: beginner
- id: du
  purpose:
    tr: Dizin disk kullanımını tahmin eder.
    en: Estimate file space usage.
  learning_level: beginner
- id: mount
  purpose:
    tr: Dosya sistemi bağlar.
    en: Mount a filesystem.
  learning_level: intermediate
- id: umount
  purpose:
    tr: Dosya sistemi bağlantısını kaldırır.
    en: Unmount filesystems.
  learning_level: intermediate
- id: findmnt
  purpose:
    tr: Bağlı dosya sistemlerini listeler.
    en: List mounted filesystems (libmount).
  learning_level: intermediate
- id: blkid
  purpose:
    tr: Blok aygıt özniteliklerini basar.
    en: Print block device attributes.
  learning_level: intermediate
- id: fdisk
  purpose:
    tr: Disk bölüm tablosu düzenleyici.
    en: Manipulate disk partition tables.
  learning_level: intermediate
- id: parted
  purpose:
    tr: GNU Parted — bölüm tablosu düzenleyici (yıkıcı).
    en: GNU Parted — partition table manipulator (destructive).
  learning_level: intermediate
- id: dd
  purpose:
    tr: Blok düzeyinde kopyalama/dönüştürme.
    en: Convert and copy files at block level.
  learning_level: intermediate
- id: sync
  purpose:
    tr: Önbellekteki yazıları diske boşaltır.
    en: Flush filesystem write caches to disk.
  learning_level: intermediate
- id: mkfs
  purpose:
    tr: Dosya sistemi oluşturma ön yüzü (yıkıcı).
    en: Frontend to build a Linux filesystem (destructive).
  learning_level: intermediate
- id: mkfs.ext4
  purpose:
    tr: ext4 dosya sistemi oluşturur (yıkıcı).
    en: Create an ext4 filesystem (destructive).
  learning_level: intermediate
- id: mkfs.xfs
  purpose:
    tr: XFS dosya sistemi oluşturur (yıkıcı).
    en: Construct an XFS filesystem (destructive).
  learning_level: intermediate
- id: mkfs.btrfs
  purpose:
    tr: Btrfs dosya sistemi oluşturur (yıkıcı).
    en: Create a Btrfs filesystem (destructive).
  learning_level: intermediate
- id: mkfs.fat
  purpose:
    tr: FAT/VFAT dosya sistemi oluşturur (yıkıcı).
    en: Create a FAT/VFAT filesystem (destructive).
  learning_level: intermediate
