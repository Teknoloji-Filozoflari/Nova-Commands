id: storage
kind: nova-commands-concept
title:
  tr: Depolama ve disk
  en: Storage and disks
summary:
  tr: Blok aygıtlar, bağlama, kullanım ve dikkat edilmesi gereken disk araçları.
  en: Block devices, mounts, usage, and high-care disk tools.
difficulty: intermediate
tags:
