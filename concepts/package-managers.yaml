title:
  tr: Paket yöneticileri
  en: Package managers
summary:
  tr: pacman, apt, dnf ve paket ↔ komut ilişkisi (Arch öncelikli notlar).
  en: pacman, apt, dnf, and package ↔ command mapping (Arch-first notes).
