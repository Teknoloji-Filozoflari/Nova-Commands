intro:
  tr: Her distro ailesinin kendi paket yöneticisi vardır; isimleri ve bayrakları uydurulmaz. Sessiz Arch
    varsayılanı yok.
  en: Each distro family has its own package manager; names and flags are not invented. No silent Arch
    default.
