body:
  tr: "Dağıtımlar yazılıımı *paket* olarak kurar. Aynı komut farklı paket adında olabilir;\nbilinmeyen\
    \ ad **uydurulmaz** (omit / `draft`).\n\n**Birinci sınıf yöneticiler (çekirdek):**\n- **Arch — pacman:**\
    \ `pacman -Syu` sistem güncellemesi; `pacman -S paket` kurulum;\n  `pacman -Ss anahtar` arama. AUR\
    \ yardımcıları (ör. `paru`) resmi depoda olmayabilir.\n- **Debian/Ubuntu — apt (+ dpkg):** `apt update`\
    \ / `apt install`; düşük seviye `dpkg`.\n- **Fedora/RHEL — dnf (+ rpm):** `dnf install` / `dnf upgrade`;\
    \ `rpm -q` sorguları.\n\n**Genişleyen Linux PM’ler (Faz 4, çoğu draft):**\n- **openSUSE/SUSE — zypper**\
    \ (Leap `update` ≠ Tumbleweed `dup`)\n- **Alpine — apk** (Android APK ile karıştırma)\n- **Gentoo\
    \ — emerge / Portage** (kaynak derleme, USE / `@world`)\n- **Void — xbps-install / query / remove**\n\
    - **Solus — eopkg** · **Slackware — slackpkg** (+ installpkg/removepkg/upgradepkg)\n- **OpenWrt —\
    \ opkg** (gömülü; flash alanı)\n- **Atomik Fedora — rpm-ostree** (klasik dnf modeli değil; genelde\
    \ reboot)\n\n**Deklaratif ekosistemler:** Nix (NixOS + diğer Linux/macOS) ve GNU Guix —\nayrı makale:\
    \ `concepts/nix-guix.yaml`. Eski `nix-env` ile modern `nix profile`\nkarıştırılmaz.\n\n**Flatpak:**\
    \ Dağıtımdan bağımsız uygulama sandboxes; çekirdek toolchain yerine geçmez.\n\n**Windows / macOS (Faz\
    \ 5, draft):** WinGet (`winget`); macOS’ta Homebrew (`brew`) ve\nMacPorts (`port`) ayrı kayıtlardır.\
    \ `softwareupdate` OS güncellemesidir — `brew upgrade`\nile karıştırılmaz. Arch host’ta sistem PM\
    \ olarak pacman önceliklidir.\n\n**BSD (Faz 6, draft):** FreeBSD `pkg` ≠ Ports (`ports`); OpenBSD\
    \ `pkg_add`; NetBSD\n`pkgin` ≠ `pkgsrc`; DragonFly `pkg` FreeBSD `pkg` ile aynı değildir. `freebsd-update`\n\
    taban güncellemesidir — `pkg upgrade` değildir.\n\n**Nova tercihi:** Arch host’ta kurulum ipuçlarında\
    \ **pacman / `packages.arch` önce**.\nCI yıkıcı kurulum çalıştırmaz. `verification: verified` yalnızca\
    \ insan incelemesi sonrası.\n"
  en: "Distros install software as *packages*. The same command may live in differently\nnamed packages;\
    \ unknown names are **not invented** (omit / `draft`).\n\n**First-class managers (core):**\n- **Arch\
    \ — pacman:** `pacman -Syu` full upgrade; `pacman -S pkg` install;\n  `pacman -Ss keyword` search.\
    \ AUR helpers (e.g. `paru`) may be unofficial.\n- **Debian/Ubuntu — apt (+ dpkg):** `apt update` /\
    \ `apt install`; lower-level `dpkg`.\n- **Fedora/RHEL — dnf (+ rpm):** `dnf install` / `dnf upgrade`;\
    \ `rpm -q` queries.\n\n**Broader Linux PMs (Faz 4, mostly draft):**\n- **openSUSE/SUSE — zypper**\
    \ (Leap `update` ≠ Tumbleweed `dup`)\n- **Alpine — apk** (not Android APK)\n- **Gentoo — emerge /\
    \ Portage** (source builds, USE / `@world`)\n- **Void — xbps-install / query / remove**\n- **Solus\
    \ — eopkg** · **Slackware — slackpkg** (+ installpkg/removepkg/upgradepkg)\n- **OpenWrt — opkg** (embedded;\
    \ watch flash space)\n- **Atomic Fedora — rpm-ostree** (not classic dnf; reboot often required)\n\n\
    **Declarative ecosystems:** Nix (NixOS + other Linux/macOS) and GNU Guix —\nsee `concepts/nix-guix.yaml`.\
    \ Do not mix legacy `nix-env` with modern `nix profile`.\n\n**Flatpak:** Distro-agnostic sandboxed\
    \ apps; does not replace the base toolchain.\n\n**Windows / macOS (Faz 5, draft):** WinGet (`winget`);\
    \ on macOS Homebrew (`brew`) and\nMacPorts (`port`) are separate records. `softwareupdate` is OS update\
    \ — not\n`brew upgrade`. On Arch hosts pacman remains the preferred system PM.\n\n**BSD (Faz 6, draft):**\
    \ FreeBSD `pkg` ≠ Ports (`ports`); OpenBSD `pkg_add`; NetBSD\n`pkgin` ≠ `pkgsrc`; DragonFly `pkg`\
    \ is not FreeBSD `pkg`. `freebsd-update` is base\nupdate — not `pkg upgrade`.\n\n**Nova preference:**\
    \ On Arch hosts prefer **pacman / `packages.arch` first**.\nCI does not run destructive installs.\
    \ `verification: verified` only after human review.\n"
