intro:
  tr: Linux çok kullanıcılıdır. Her dosyanın sahibi, grubu ve üç sınıf (u/g/o) için rwx bitleri vardır; chmod/chown/umask bu modeli yönetir.
  en: Linux is multi-user. Every file has an owner, a group, and rwx bits for three classes (u/g/o); chmod/chown/umask manage that model.
body:
  tr: |
    ## Kimlik: kimim?

    Çok kullanıcılı sistemde önce kendinizi görün. `whoami` etkili kullanıcı adını basar. `id` uid, gid ve üye olduğunuz grupları listeler. `groups` yalnız grup adlarını verir.

    Kullanıcı satırları `/etc/passwd` içindedir; parola özetleri `/etc/shadow` (yalnız root okur); gruplar `/etc/group` dosyasındadır. `getent passwd kullanıcı` bu kaynaklardan sorgu yapar.

    ## İzin bitleri: r, w, x

    Her sınıf için üç hak vardır:

    | Hak | Anlam (dosya) | Anlam (dizin) | Sayı |
    |-----|---------------|---------------|------|
    | r | okuma | içeriği listeleme | 4 |
    | w | yazma | oluşturma/silme (x ile) | 2 |
    | x | çalıştırma | dizine girme / traverse | 1 |

    Haklar toplanır: `rwx = 7`, `rw- = 6`, `r-x = 5`, `r-- = 4`, `--- = 0`. Üç hane sırasıyla **sahip · grup · diğerleri** içindir. Örnek: `755` → sahip 7, grup 5, diğerleri 5 → `rwxr-xr-x`.

    `ls -l` sol sütunu okuyun: ilk karakter tür (`-` dosya, `d` dizin, `l` bağ); sonraki dokuz karakter üçer üçer u/g/o izinleridir.

    ## Tipik oktal değerler

    | Sayı | Gösterim | Tipik kullanım |
    |------|----------|----------------|
    | 755 | rwxr-xr-x | Çalıştırılabilir dosya ve klasörler (herkes çalıştırır/girer; yalnız sahip yazar) |
    | 644 | rw-r--r-- | Normal dosyalar (herkes okur; yalnız sahip yazar) |
    | 600 | rw------- | Özel dosyalar (SSH anahtarı gibi; yalnız sahip) |
    | 700 | rwx------ | Özel klasörler |
    | 777 | rwxrwxrwx | Herkese tam yetki — güvenlik açığıdır, kaçının |

    ## chmod (sayısal ve sembolik)

    `chmod` kip bitlerini değiştirir. Sayısal: `chmod 755 betik.sh`. Sembolik: `u` sahip, `g` grup, `o` diğer, `a` hepsi; `+` ekle, `-` kaldır, `=` ata.

    Örnekler: `chmod u+x betik.sh`, `chmod go-w gizli.txt`, `chmod -R 750 proje/` (özyinelemeli — dar kapsam!). Betiği çalıştırmak için x gerekir: `chmod +x betik.sh` sonra `./betik.sh`. Dizinde x “içine girebilme” demektir.

    ## chown, chgrp, umask, visudo

    `chown` sahibi (ve istenirse grubu) değiştirir; genelde root ister: `sudo chown ayse dosya`, `sudo chown ayse:dev dosya`. `chgrp` yalnız grubu değiştirir. `umask` yeni dosya/dizinlerin varsayılan izinlerinden çıkarılacak maskeyi gösterir veya ayarlar (`umask`, `umask 022`). `visudo` sudoers’ı sözdizimi denetimiyle düzenler — düz metin editörü yerine bunu kullanın.

    ## Yükseltme ve risk

    `sudo` komutu geçici olarak başka kullanıcı (çoğunlukla root) olarak çalıştırır. Yanlış `chmod -R 777` veya kökte `chown -R` sistemi bozabilir. Bankada birçok izin komutu `caution` / `dangerous` işaretlidir; örnekleri körü körüne kopyalamayın.
  en: |
    ## Identity: who am I?

    On a multi-user system, start with yourself. `whoami` prints the effective user name. `id` lists uid, gid, and group memberships. `groups` prints group names only.

    Account lines live in `/etc/passwd`; password hashes in `/etc/shadow` (root-readable); groups in `/etc/group`. `getent passwd user` queries these sources.

    ## Permission bits: r, w, x

    Each class has three rights:

    | Right | Meaning (file) | Meaning (directory) | Value |
    |-------|----------------|---------------------|-------|
    | r | read | list contents | 4 |
    | w | write | create/remove (with x) | 2 |
    | x | execute | enter / traverse | 1 |

    Rights sum: `rwx = 7`, `rw- = 6`, `r-x = 5`, `r-- = 4`, `--- = 0`. The three digits are **owner · group · others**. Example: `755` → owner 7, group 5, others 5 → `rwxr-xr-x`.

    Read `ls -l`: first character is type (`-` file, `d` dir, `l` link); the next nine are u/g/o permissions in threes.

    ## Typical octal modes

    | Mode | Symbolic | Typical use |
    |------|----------|-------------|
    | 755 | rwxr-xr-x | Executables and folders (everyone runs/enters; only owner writes) |
    | 644 | rw-r--r-- | Normal files (everyone reads; only owner writes) |
    | 600 | rw------- | Private files (SSH keys; owner only) |
    | 700 | rwx------ | Private directories |
    | 777 | rwxrwxrwx | World-writable — a security hole; avoid |

    ## chmod (numeric and symbolic)

    `chmod` changes mode bits. Numeric: `chmod 755 script.sh`. Symbolic: `u` owner, `g` group, `o` others, `a` all; `+` add, `-` remove, `=` set.

    Examples: `chmod u+x script.sh`, `chmod go-w secret.txt`, `chmod -R 750 project/` (recursive — keep scope narrow!). Scripts need x: `chmod +x script.sh` then `./script.sh`. On directories, x means “can enter”.

    ## chown, chgrp, umask, visudo

    `chown` changes owner (and optionally group); usually needs root: `sudo chown ada file`, `sudo chown ada:dev file`. `chgrp` changes group only. `umask` shows or sets bits cleared from default modes of new files (`umask`, `umask 022`). `visudo` edits sudoers with syntax checking — use it instead of a plain editor.

    ## Elevation and risk

    `sudo` runs a command as another user (usually root). Blind `chmod -R 777` or `chown -R` on system roots can break the host. Many permission entries in the bank are `caution` / `dangerous`; do not copy examples blindly.
