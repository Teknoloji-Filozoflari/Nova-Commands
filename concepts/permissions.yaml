title:
  tr: Kullanıcılar, gruplar ve izinler
  en: Users, groups, and permissions
summary:
  tr: id/chmod/chown/sudo ile kim neyi yapabilir — temel model.
  en: Who can do what with id/chmod/chown/sudo — the basic model.
difficulty: beginner
