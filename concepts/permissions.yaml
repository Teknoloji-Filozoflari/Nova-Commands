graded_examples:
- title:
    tr: Kimim ve hangi gruplardayım?
    en: Who am I and which groups?
  command: id; groups
  explanation:
    tr: uid/gid ve grup üyeliklerini birlikte okuyun; henüz hiçbir şeyi değiştirmeyin.
    en: Read uid/gid and group memberships together; change nothing yet.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - id
  - groups
- title:
    tr: Ev ve /tmp kiplerini oku
    en: Read home and /tmp modes
  command: ls -ld ~ /tmp
  explanation:
    tr: Sol sütundaki d ve rwx alanlarını yorumlayın; /tmp’de sticky bit (t) sık görülür.
    en: Interpret the d and rwx fields; /tmp often shows the sticky bit (t).
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - ls
- title:
    tr: Özel dosya 600
    en: Private file 600
  command: touch /tmp/nova-private-demo && chmod 600 /tmp/nova-private-demo && ls -l /tmp/nova-private-demo
  explanation:
    tr: Sahibe rw; grup/diğer yok. Gerçek gizli dosyalarda (SSH anahtarı) aynı mantık.
    en: Owner rw; none for group/other. Same idea for real secrets (SSH keys).
  difficulty: beginner
  risk: caution
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - chmod
  - touch
  - ls
- title:
    tr: Betiğe u+x
    en: Add u+x to a script
  command: echo 'echo selam' > /tmp/nova-s.sh && chmod u+x /tmp/nova-s.sh && /tmp/nova-s.sh
  explanation:
    tr: Sembolik u+x sahip çalıştırmayı ekler; ardından doğrudan yol ile çalıştırın.
    en: Symbolic u+x adds owner execute; then run via absolute path.
  difficulty: beginner
  risk: caution
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - chmod
  - echo
- title:
    tr: Normal dosya 644
    en: Normal file 644
  command: touch /tmp/nova-notes.txt && chmod 644 /tmp/nova-notes.txt && ls -l /tmp/nova-notes.txt
  explanation:
    tr: 'Tipik metin dosyası: herkes okur, yalnız sahip yazar (rw-r--r--).'
    en: 'Typical text file: everyone reads, only owner writes (rw-r--r--).'
  difficulty: beginner
  risk: caution
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - chmod
- title:
    tr: Klasör 755
    en: Directory 755
  command: mkdir -p /tmp/nova-demo-dir && chmod 755 /tmp/nova-demo-dir && ls -ld /tmp/nova-demo-dir
  explanation:
    tr: Herkes girebilir/listeleyebilir; yalnız sahip içerik yazar — klasörler için yaygın kip.
    en: Everyone can enter/list; only owner writes content — common for directories.
  difficulty: intermediate
  risk: caution
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - chmod
  - mkdir
- title:
    tr: go-w ile yazmayı kapat
    en: Drop write with go-w
  command: chmod go-w /tmp/nova-notes.txt && ls -l /tmp/nova-notes.txt
  explanation:
    tr: Grup ve diğerlerinden yazmayı kaldırır; sayı ezberlemeden ince ayar.
    en: Removes write from group and others; fine-tune without memorizing octal.
  difficulty: intermediate
  risk: caution
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - chmod
- title:
    tr: umask gör
    en: Show umask
  command: umask; umask -S
  explanation:
    tr: Sekizlik ve sembolik maske. Yeni touch dosyalarının varsayılanını anlamak için bakın; kalıcı profil yazmayın.
    en: Octal and symbolic mask. Use it to understand defaults for new touch files; do not edit profiles here.
  difficulty: intermediate
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - umask
- title:
    tr: visudo kontrol (yazmadan)
    en: visudo check (no write)
  command: sudo visudo -c
  explanation:
    tr: sudoers sözdizimini doğrular; dosyayı düzenlemez. Düzenleme için sudo visudo (ayrı, dikkatli oturum).
    en: Validates sudoers syntax; does not edit. Use sudo visudo to edit (separate, careful session).
  difficulty: advanced
  risk: caution
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - visudo
  - sudo
  warnings:
  - tr: Gerçek sudoers düzenlemesini yedek/second oturum olmadan yapmayın.
    en: Do not edit real sudoers without a backup/second session.
callouts:
- kind: tip
  text:
    tr: 'rwx aritmetiği: r=4, w=2, x=1. rwx=7, r-x=5, rw-=6, r--=4. Üç hane = sahip, grup, diğerleri.'
    en: 'rwx math: r=4, w=2, x=1. rwx=7, r-x=5, rw-=6, r--=4. Three digits = owner, group, others.'
- kind: tip
  text:
    tr: 'Betik çalıştırma: chmod +x betik.sh ardından ./betik.sh. Klasörde x = içine girebilme.'
    en: 'Run a script: chmod +x script.sh then ./script.sh. On directories, x means enter/traverse.'
- kind: warning
  text:
    tr: 777 (rwxrwxrwx) herkese tam yetki verir — güvenlik açığıdır, kaçının. “Çalışmıyor” diye 777 uygulamayın.
    en: 777 (rwxrwxrwx) grants everyone full access — a security hole; avoid it. Do not “fix” breakage with 777.
- kind: warning
  text:
    tr: chmod -R ve chown -R geri dönüşü zor hatalar üretebilir; önce dar kapsam, sonra ls -ld ile doğrulayın.
    en: chmod -R and chown -R can cause hard-to-undo mistakes; keep scope narrow, then verify with ls -ld.
- kind: caution
  text:
    tr: sudo her sorunu çözmez; yanlış sudo daha büyük zarar verir. sudoers için visudo kullanın.
    en: sudo does not fix everything; wrong sudo causes larger damage. Use visudo for sudoers.
- kind: note
  text:
    tr: macOS/BSD’de aynı rwx modeli vardır; bazı yönetim araçları ve yollar farklıdır. Windows ACL’leri (icacls) ayrı bir modeldir.
    en: macOS/BSD share the rwx model; some admin tools and paths differ. Windows ACLs (icacls) are a different model.
safe_exercises:
- title:
    tr: id ve ls -l okuma
    en: Read id and ls -l
  prompt:
    tr: id; groups; ls -ld ~ /tmp çalıştırıp kip ve sahip alanlarını kendi cümlenizle açıklayın (değiştirmeyin).
    en: Run id; groups; ls -ld ~ /tmp and explain mode/owner fields in your own words (do not change them).
  risk: safe
  related_commands:
  - id
  - groups
  - ls
- title:
    tr: 600 doğrulama
    en: Verify 600
  prompt:
    tr: '/tmp içinde touch gizli-demo.txt; chmod 600; ls -l ile rw------- gördüğünüzü doğrulayın. İş bitince dosyayı silin.'
    en: 'In /tmp, touch a demo file; chmod 600; confirm rw------- with ls -l. Delete the file when done.'
  risk: caution
  related_commands:
  - chmod
  - touch
  - ls
- title:
    tr: İlk çalıştırılabilir
    en: First executable
  prompt:
    tr: '/tmp içinde echo ''echo selam'' > s.sh; chmod u+x s.sh; ./s.sh (veya /tmp/s.sh) ile çalıştırın.'
    en: 'In /tmp, echo ''echo hi'' > s.sh; chmod u+x s.sh; run ./s.sh (or /tmp/s.sh).'
  risk: caution
  related_commands:
  - chmod
  - echo
- title:
    tr: umask gözlemi
    en: Observe umask
  prompt:
    tr: umask ve umask -S çıktısını not edin. touch ile /tmp’de bir dosya oluşturup ls -l ile varsayılan kipi umask ile ilişkilendirin (umask değerini kalıcı değiştirmeyin).
    en: Note umask and umask -S. Create a /tmp file with touch and relate its ls -l mode to umask (do not persist umask changes).
  risk: safe
  related_commands:
  - umask
  - touch
  - ls
