command_table:
- id: whoami
  purpose:
    tr: Geçerli etkili kullanıcı adını basar.
    en: Print effective user name.
  learning_level: beginner
- id: id
  purpose:
    tr: Kullanıcı ve grup kimliklerini basar.
    en: Print user and group IDs.
  learning_level: beginner
- id: chmod
  purpose:
    tr: Dosya kipini (izinlerini) değiştirir.
    en: Change file mode bits.
  learning_level: intermediate
- id: chown
  purpose:
    tr: Dosya sahibini değiştirir.
    en: Change file owner and group.
  learning_level: intermediate
- id: chgrp
  purpose:
    tr: Dosya grup sahipliğini değiştirir.
    en: Change group ownership of files.
  learning_level: intermediate
- id: sudo
  purpose:
    tr: Komutu başka kullanıcı olarak çalıştırır (genelde root).
    en: Execute a command as another user (usually root).
  learning_level: intermediate
- id: passwd
  purpose:
    tr: Kullanıcı parola değiştirir.
    en: Change user password.
  learning_level: intermediate
graded_examples:
- title:
    tr: Kimim?
    en: Who am I?
  command: id
  explanation:
    tr: uid/gid ve grupları listeler.
    en: Lists uid/gid and groups.
  difficulty: beginner
  risk: safe
  related_commands:
  - id
- title:
    tr: Özel dosya modu
    en: Private file mode
  command: chmod 600 /tmp/nova-private-demo
  explanation:
    tr: Sahibe rw; gruba/diğerine yok. Önce dokunun; gerçek gizli dosyalarda dikkat.
    en: Owner rw; none for group/other. Touch first; be careful with real secrets.
  difficulty: intermediate
  risk: caution
  related_commands:
  - chmod
callouts:
- kind: warning
  text:
    tr: chmod -R ve chown -R geri dönüşü zor hatalar üretebilir; önce dar kapsam.
    en: chmod -R and chown -R can cause hard-to-undo mistakes; keep scope narrow first.
- kind: caution
  text:
    tr: sudo her sorunu çözmez; yanlış sudo daha büyük zarar verir.
    en: sudo does not fix everything; wrong sudo causes larger damage.
safe_exercises:
