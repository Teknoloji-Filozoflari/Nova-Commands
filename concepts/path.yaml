command_table:
- id: which
  purpose:
    tr: Komutun PATH üzerindeki konumunu gösterir.
    en: Locate a command on PATH.
  learning_level: beginner
- id: env
  purpose:
    tr: Ortamı gösterir veya değiştirerek komut çalıştırır.
    en: Show environment or run a command in a modified environment.
  learning_level: beginner
- id: export
  purpose:
    tr: Değişkeni ortamda dışa aktarır (yerleşik).
    en: Set export attribute for shell variables (builtin).
  learning_level: beginner
graded_examples:
- title:
    tr: which ile konum
    en: Locate with which
  command: which ls
  explanation:
    tr: ls ikilisinin yolunu basar (ortama göre).
    en: Prints the path of the ls binary (environment-dependent).
  difficulty: beginner
  risk: safe
  related_commands:
  - which
- title:
    tr: PATH yazdır
    en: Print PATH
  command: echo "$PATH"
  explanation:
    tr: Arama yollarını iki nokta ile ayırarak gösterir.
    en: Shows search paths separated by colons.
  difficulty: beginner
  risk: safe
  related_commands:
  - echo
- title:
    tr: env PATH satırı
    en: env PATH line
  command: env | grep -E "^PATH=" | head
  explanation:
    tr: Ortamda PATH’in nasıl göründüğüne bakış.
    en: See how PATH appears in the environment.
  difficulty: beginner
  risk: safe
  related_commands:
  - env
  - grep
- title:
    tr: which karşılaştırması
    en: Compare which
  command: which ls; which pwd || true
  explanation:
    tr: Harici ls yolu; pwd yerleşik olabilir.
    en: External ls path; pwd may be a builtin.
  difficulty: intermediate
  risk: safe
  related_commands:
  - which
callouts:
- kind: caution
  text:
    tr: 'which ile type farklıdır: type kabuk yerleşiklerini de gösterir.'
    en: 'which differs from type: type also reveals shell builtins.'
- kind: tip
  text:
    tr: İlk eşleşme kazanır. Aynı adlı iki ikili varsa PATH sırası kritiktir.
    en: First match wins. PATH order matters when two binaries share a name.
safe_exercises:
- title:
    tr: İkili yolunu bulun
    en: Find a binary path
  prompt:
    tr: which python3 (veya py) ile echo "$PATH" çıktılarını karşılaştırın.
    en: Compare which python3 (or py) with echo "$PATH".
  risk: safe
  related_commands:
  - which
- title:
    tr: type vs which
    en: type vs which
  prompt:
    tr: type ls; which ls; type cd çıktılarını yazıp farkı açıklayın.
    en: Run type ls; which ls; type cd and explain the difference.
  risk: safe
  related_commands:
  - which
  - ls
  - cd
