- docs/local-discovery-contract.md (Nova local discovery)
body:
  tr: '## PATH nedir?


    `PATH`, kabuğun harici programları aradığı dizinlerin `:` ile ayrılmış listesidir. Yerleşikler önce
    gelir; sonra PATH soldan sağa taranır.


    ## Görme


    - `echo "$PATH"` — arama yolları

    - `which ls` — sıkça ilk eşleşen yol

    - `type ls` / `command -v ls` — yerleşik/alias/yol ayrımı (type bankada yok; kabuk yerleşiğidir)


    ## Güncelleme


    `export PATH="$HOME/.local/bin:$PATH"` oturuma ekler. Kalıcılık için `~/.bashrc` / `~/.zshrc`. Yanlış
    PATH “command not found” üretir.


    ## Nova


    PATH keşfi kürate bankanın `verified` durumunu miras almaz.

    '
  en: '## What is PATH?


    `PATH` is a colon-separated list of directories where the shell searches for external programs. Builtins
    win first; then PATH is scanned left to right.


    ## Inspect


    - `echo "$PATH"` — search directories

    - `which ls` — often the first matching path

    - `type ls` / `command -v ls` — builtin/alias/path (type is a shell builtin, not a bank row)


    ## Update


    `export PATH="$HOME/.local/bin:$PATH"` for the session. Persist via `~/.bashrc` / `~/.zshrc`. A broken
    PATH yields “command not found”.


    ## Nova


    PATH discovery does not inherit bank `verified` status.

    '
