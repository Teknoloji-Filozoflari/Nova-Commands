id: databases
kind: nova-commands-concept
title:
  tr: Veritabanı istemci CLI’leri
  en: Database client CLIs
summary:
  tr: mysql, redis-cli, psql — sunucu kurulumu değil; parola argv’de olmaz.
  en: mysql, redis-cli, psql — clients not server installs; no passwords on argv.
difficulty: beginner
