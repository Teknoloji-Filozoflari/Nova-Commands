body:
  tr: 'Bu bankadaki veritabanı kayıtları **istemci CLI** odaklıdır; MySQL/Redis

    sunucusunu kuran paket scriptleri değildir.


    **Alışkanlıklar:**

    - Parolayı komut satırına (`-pSECRET`) yazmayın — history ve `ps` sızdırır.

    - Önce `--version` / `--help` ile aracı doğrulayın.

    - Üretimde salt okuma sorguları bile veri sızdırabilir (`caution`).


    **psql** (PostgreSQL) ve **sqlite3** zaten development kategorisinde;

    **mysql** / **redis-cli** Faz 7’de `databases/` altına eklendi. Hepsi `draft`

    başlar; `verified` insan incelemesi ister.

    '
  en: 'Database records in this bank are **client CLIs**, not package scripts that

    install MySQL/Redis servers.


    **Habits:**

    - Do not put passwords on argv (`-pSECRET`) — history and `ps` leak them.

    - Confirm the tool with `--version` / `--help` first.

    - Even read-only queries can leak data in production (`caution`).


    **psql** (PostgreSQL) and **sqlite3** already live under development;

    **mysql** / **redis-cli** were added under `databases/` in Faz 7. All start

    as `draft`; `verified` needs human review.

    '
