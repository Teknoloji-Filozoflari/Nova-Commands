body:
  tr: "**IaC** altyapıyı tekrarlanabilir kod olarak tanımlar.\n\n**Kaba ayrım:**\n- **Terraform** — sağlayıcı\
    \ API’leriyle kaynak oluşturma/plan/apply\n  (OpenTofu ayrı bir araçtır; bu fazda ayrı kayıt yok).\n\
    - **Ansible** — yapılandırma/otomasyon (çoğunlukla SSH); state modeli farklıdır.\n- **aws / az / gcloud**\
    \ — bulut kontrol düzlemi CLI’leri; Terraform’un yerine\n  geçmezler, onu tamamlarlar.\n\n**Gizli\
    \ bilgi:** Access key, session token, service-account JSON veya\n`gh` PAT örnek YAML’lara **yazılmaz**.\
    \ `version`, `plan`/`validate`,\n`auth status` gibi güvenli okumalar tercih edilir.\n\n`apply` / `destroy`\
    \ / playbook koşuları uzak sistemleri değiştirir —\nrisk `dangerous` olabilir. Kayıtlar `draft`.\n"
  en: "**IaC** defines infrastructure as repeatable code.\n\n**Rough split:**\n- **Terraform** — create/plan/apply\
    \ resources via provider APIs\n  (OpenTofu is a separate tool; no separate record in this phase).\n\
    - **Ansible** — configuration/automation (often over SSH); different state model.\n- **aws / az /\
    \ gcloud** — cloud control-plane CLIs; they complement Terraform,\n  they do not replace it.\n\n**Secrets:**\
    \ Never put access keys, session tokens, service-account JSON, or\n`gh` PATs in example YAML. Prefer\
    \ safe reads like `version`, `plan`/`validate`,\nand `auth status`.\n\n`apply` / `destroy` / playbook\
    \ runs mutate remote systems — risk may be\n`dangerous`. Records stay `draft`.\n"
