id: infrastructure-as-code
kind: nova-commands-concept
title:
  tr: Altyapı kodu (IaC) ve otomasyon
  en: Infrastructure as code (IaC) and automation
summary:
  tr: Terraform ve Ansible farkı; bulut CLI’ler ve gizli kimlik kuralları.
  en: Terraform vs Ansible; cloud CLIs and secret-handling rules.
difficulty: intermediate
tags:
