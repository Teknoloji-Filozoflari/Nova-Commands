title:
  tr: Bulut sağlayıcı CLI’leri
  en: Cloud provider CLIs
summary:
  tr: aws, az, gcloud — kontrol düzlemi araçları; gerçek API anahtarı yok.
  en: aws, az, gcloud — control-plane tools; no real API keys.
