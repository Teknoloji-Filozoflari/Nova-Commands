title:
  tr: Nix ve GNU Guix
  en: Nix and GNU Guix
summary:
  tr: Deklaratif paket/store modeli; modern Nix CLI vs eski nix-env; Guix profilleri.
  en: Declarative package/store model; modern Nix CLI vs legacy nix-env; Guix profiles.
