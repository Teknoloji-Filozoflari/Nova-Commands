  en: The terminal takes text; the shell interprets it; commands do the work. This guide teaches the prompt, line form, exit status, and first safe commands.
body:
  tr: |
    ## Terminal, kabuk, komut

    **Terminal** (gnome-terminal, konsole, Windows Terminal, …) klavyeyi kabuğa iletir ve çıktıyı gösterir; komutu yorumlamaz.

    **Kabuk** (bash, zsh, fish, sh, …) yazdığınız satırı yorumlar, yerleşik mi diye bakar, değilse PATH’te program arar.

    **Komut / araç** kabuğun çalıştırdığı programdır (`ls`, `mkdir`, …).

    ## Komut anatomisi

    Biçim: `komut [seçenekler] [argümanlar]`.

    Örnek: `ls -l /etc` → komut `ls`, seçenek `-l`, argüman `/etc`. Kısa seçenekler birleşebilir: `ls -lah`. Büyük/küçük harf önemlidir: `LS` çalışmaz.

    ## İstem (prompt)

    Tipik istem `kullanıcı@makine:dizin$` şeklindedir. `~` ev dizinidir. Satır sonundaki `$` normal kullanıcıyı, `#` çoğu sistemde root’u gösterir. Örneklerdeki `$` işaretini yazmayın — yalnızca istemdir.

    ## Dahili ve harici

    `cd`, `echo`, `pwd`, `history` çoğu kabukta **yerleşiktir**. `ls`, `grep` gibi araçlar **harici** programlardır. `type cd` / `type ls` farkı gösterir. Harici yoksa “command not found” görürsünüz.

    ## Çıkış kodu

    Başarı genelde `0`; sıfır dışı hata demektir. Son kod: `echo $?`. `true` → 0, `false` → sıfır dışı.

    ## Argümanlar ve tırnak

    Boşluklu yolları tırnaklayın: `cd "My Documents"`. Tek tırnak genişletmeyi kapatır; çift tırnak değişkenleri açabilir (`echo "$HOME"`).

    ## Yardım

    `man komut`, `komut --help`, yerleşikler için `help cd`. Hiç kimse her bayrağı ezberlemez; nereye bakacağını bilmek yeter.

    ## Nova ayrımı

    Kürate banka ile “PATH’te bulunan komutlar” farklıdır. PATH’te olmak `verified` demek değildir.
  en: |
    ## Terminal, shell, command

    The **terminal** (gnome-terminal, konsole, Windows Terminal, …) forwards keystrokes to the shell and shows output; it does not interpret commands.

    The **shell** (bash, zsh, fish, sh, …) parses the line, checks builtins, then searches PATH for a program.

    A **command / tool** is what the shell runs (`ls`, `mkdir`, …).

    ## Command anatomy

    Form: `command [options] [arguments]`.

    Example: `ls -l /etc` → command `ls`, option `-l`, argument `/etc`. Short options may combine: `ls -lah`. Case matters: `LS` fails.

    ## Prompt

    A typical prompt looks like `user@host:dir$`. `~` is home. Trailing `$` usually means a normal user; `#` often means root. Do not type the example `$` — it is only the prompt.

    ## Builtin vs external

    `cd`, `echo`, `pwd`, `history` are usually **builtins**. Tools like `ls` and `grep` are **external**. `type cd` / `type ls` shows the difference. Missing externals yield “command not found”.

    ## Exit status

    Success is usually `0`; non-zero means failure. Last status: `echo $?`. `true` → 0, `false` → non-zero.

    ## Arguments and quoting

    Quote paths with spaces: `cd "My Documents"`. Single quotes disable most expansion; double quotes may expand variables (`echo "$HOME"`).

    ## Help

    `man command`, `command --help`, and `help cd` for builtins. Nobody memorizes every flag; knowing where to look is enough.

    ## Nova dual concept

    The curated bank is not “commands found on PATH”. Presence on PATH does not mean `verified`.
