id: terminal-basics
kind: nova-commands-concept
title:
  tr: Terminal temelleri
  en: Terminal basics
summary:
  tr: Kabuk, istem (prompt), komut satırı ve çıkış kodları.
  en: Shell, prompt, command line, and exit statuses.
difficulty: beginner
