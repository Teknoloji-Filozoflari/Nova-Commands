- id: ls
  purpose:
    tr: Dizin içeriğini listeler.
    en: List directory contents.
  learning_level: beginner
- id: cd
  purpose:
    tr: Çalışma dizinini değiştirir (kabuk yerleşiği).
    en: Change the shell working directory (builtin).
  learning_level: beginner
- id: echo
  purpose:
    tr: Argümanları ve değişkenleri yazar.
    en: Display arguments and variables.
  learning_level: beginner
