command_table:
- id: pwd
  purpose:
    tr: Çalışma dizinini yazdırır.
    en: Print working directory.
  learning_level: beginner
- id: ls
  purpose:
    tr: Dizin içeriğini listeler.
    en: List directory contents.
  learning_level: beginner
- id: cd
  purpose:
    tr: Çalışma dizinini değiştirir (kabuk yerleşiği).
    en: Change the shell working directory (builtin).
  learning_level: beginner
- id: echo
  purpose:
    tr: Argümanları yazar.
    en: Display a line of text.
  learning_level: beginner
- id: history
  purpose:
