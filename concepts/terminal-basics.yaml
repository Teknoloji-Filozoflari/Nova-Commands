graded_examples:
- title:
    tr: Merhaba
    en: Hello
  command: echo Merhaba
  explanation:
    tr: Kabuğun argümanı ekrana yazdığını görün. $ yazmayın.
    en: See the shell print the argument. Do not type a leading $.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - echo
- title:
    tr: Konum + liste
    en: Location + list
  command: pwd && ls
  explanation:
    tr: Çalışma dizinini yazdırır ve içeriği listeler.
    en: Prints the working directory and lists its contents.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - pwd
  - ls
- title:
    tr: Ayrıntılı ve gizli
    en: Long and hidden
  command: ls -lah
  explanation:
    tr: Uzun biçim, gizli girdiler, okunur boyutlar bir arada.
    en: Long format, hidden entries, and human-readable sizes together.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - ls
- title:
    tr: Ev ve /tmp
    en: Home and /tmp
  command: cd ~ && pwd; cd /tmp && pwd; cd - && pwd
  explanation:
    tr: Ev, /tmp ve cd - ile önceki dizine dönüş.
    en: Home, /tmp, and returning with cd -.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - cd
  - pwd
- title:
    tr: Kabuk ve HOME
    en: Shell and HOME
  command: echo "$SHELL"; echo "$HOME"
  explanation:
    tr: Çift tırnakla değişken genişlemesini görün.
    en: See variable expansion with double quotes.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - echo
- title:
    tr: Son çıkış kodu
    en: Last exit status
  command: echo ok; echo $?; ls /yok-olmayan-yol-xyz; echo $?
  explanation:
    tr: Başarılı echo sonrası $? genelde 0; başarısız ls sonrası sıfır dışı.
    en: After a successful echo, $? is usually 0; after a failing ls, non-zero.
  difficulty: intermediate
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - echo
  - ls
- title:
    tr: Geçmişten birkaç satır
    en: A few history lines
  command: history | tail -n 5
  explanation:
    tr: Son komutları numaralı listeler (yerleşik + boru).
    en: Lists recent commands with numbers (builtin + pipe).
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - history
  - tail
- title:
    tr: which ile yol
    en: Path via which
  command: which ls; which pwd || true
  explanation:
    tr: Harici ls yolunu görün. pwd yerleşik olabilir; which boş/ hata verebilir — type ile karşılaştırın.
    en: See the external ls path. pwd may be a builtin; which can be empty/error — compare with type.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - which
  - ls
callouts:
- kind: tip
  text:
    tr: 'Boşluk içeren yolları tırnaklayın: cd "My Documents". Tab ile tamamlayın; iki Tab aday listeler.'
    en: 'Quote paths with spaces: cd "My Documents". Use Tab to complete; double-Tab lists candidates.'
- kind: tip
  text:
    tr: 'Örneklerdeki $ yalnızca istemdir; yazmayın. Ctrl+C çalışan komutu durdurur; Ctrl+L ekranı temizler.'
    en: 'The $ in examples is only the prompt; do not type it. Ctrl+C stops a running command; Ctrl+L clears the screen.'
- kind: note
  text:
    tr: type cd ve type ls çıktılarını karşılaştırın — yerleşik ile harici ayrımı böyle netleşir.
    en: Compare type cd and type ls — that clarifies builtin vs external.
- kind: warning
  text:
    tr: PATH’te görünmek bank doğrulaması değildir; draft rozeti korunur. rm / sudo denemelerine bu bölümde girmeyin.
    en: Being on PATH is not bank verification; keep the draft badge honest. Skip rm/sudo experiments in this topic.
safe_exercises:
- title:
    tr: Ev dizinini keşfet
    en: Explore home
  prompt:
    tr: pwd; ls -la ~; cd /tmp; pwd; cd ~; pwd sırasını çalıştırıp her adımda konumun değişimini yazın.
    en: Run pwd; ls -la ~; cd /tmp; pwd; cd ~; pwd and note how the location changes each step.
  risk: safe
  related_commands:
  - pwd
  - ls
  - cd
- title:
    tr: Çıkış kodu gözlemi
    en: Observe exit status
  prompt:
    tr: echo ok; echo $?; ls /yok-yol-xyz; echo $? çıktılarını kendi cümlenizle açıklayın.
    en: Explain echo ok; echo $?; ls /no-such-xyz; echo $? in your own words.
  risk: safe
  related_commands:
  - echo
  - ls
- title:
    tr: type karşılaştırması
    en: Compare with type
  prompt:
    tr: type cd; type ls; type echo; which ls çıktılarını karşılaştırın — hangisi yerleşik, hangisi harici?
    en: Compare type cd; type ls; type echo; which ls — which are builtins vs external?
  risk: safe
  related_commands:
  - cd
  - ls
  - echo
  - which
