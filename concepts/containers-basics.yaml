id: containers-basics
kind: nova-commands-concept
format: topic-guide
title:
  tr: Konteyner temelleri
  en: Container basics
summary:
  tr: docker/podman ile durum, log ve inceleme; runtime ayrımları dürüst tutulur.
  en: Status, logs, and inspect with docker/podman; keep runtime differences honest.
intro:
  tr: Konteyner runtime’ları benzer CLI sunar ama paket/ad/kurulum distroya göre değişir.
  en: Container runtimes offer similar CLIs but packages/names/install differ by distro.
body:
  tr: '`docker ps` / `podman ps` çalışan konteynerleri listeler; `logs` ve `inspect` okuma yollarıdır.

    NixOS/Void/Gentoo konteyner görevleri hâlâ ince olabilir — bank notlarına bakın.

    helm/nerdctl paket adları çoğu distroda bilinçli olarak Arch-bilinen + dürüst nota bırakılmıştır.'
  en: '`docker ps` / `podman ps` list running containers; `logs` and `inspect` are read paths.

    NixOS/Void/Gentoo container tasks may still be thin — see bank notes.

    helm/nerdctl package names stay Arch-known + honesty notes on many distros.'
difficulty: intermediate
categories:
- containers
platforms:
- linux
