command_table:
- id: systemctl
  purpose:
    tr: systemd birimlerini denetler.
    en: Control the systemd system and service manager.
  learning_level: intermediate
- id: journalctl
  purpose:
    tr: systemd günlüğünü sorgular.
    en: Query the systemd journal.
  learning_level: intermediate
- id: hostnamectl
  purpose:
    tr: Hostname ve ilgili ayarları yönetir.
    en: Query or change system hostname settings.
  learning_level: beginner
- id: timedatectl
  purpose:
    tr: Sistem saati ve zaman dilimini denetler.
    en: Control system time and timezone.
  learning_level: intermediate
- id: loginctl
  purpose:
    tr: systemd oturum ve kullanıcı denetimi.
    en: Control systemd-logind sessions and users.
  learning_level: intermediate
- id: systemd-analyze
  purpose:
    tr: systemd önyükleme ve birim çözümlemesi.
    en: Analyze systemd boot and unit structure.
  learning_level: advanced
- id: bootctl
  purpose:
    tr: systemd-boot ve EFI önyükleme denetimi.
    en: Control firmware and systemd-boot entries.
  learning_level: advanced
- id: service
  purpose:
    tr: FreeBSD/NetBSD rc.d servis denetimi (systemd değil).
    en: FreeBSD/NetBSD rc.d service control (not systemd).
  learning_level: intermediate
- id: sysrc
  purpose:
    tr: FreeBSD rc.conf güvenli okuma/yazma yardımcısı.
    en: FreeBSD rc.conf safe get/set helper.
  learning_level: unspecified
- id: rcctl
  purpose:
    tr: OpenBSD rc.d servis denetimi (systemd / FreeBSD service değil).
    en: OpenBSD rc.d service control (not systemd / FreeBSD service).
  learning_level: unspecified
- id: launchctl
  purpose:
    tr: launchd iş yükü denetimi (macOS servisleri).
    en: launchd job control (macOS services).
  learning_level: intermediate
