id: development-basics
kind: nova-commands-concept
format: topic-guide
title:
  tr: Geliştirme temelleri
  en: Development basics
summary:
  tr: git, derleyiciler ve dil araçlarına giriş; OS SDK’leri ayrı.
  en: Intro to git, compilers, and language tools; OS SDKs are separate.
intro:
  tr: Kaynak kontrolü ve yapı araçları; xcode-select gibi platform SDK’leri notlarla.
  en: Source control and build tools; platform SDKs like xcode-select noted separately.
body:
  tr: '`git status` / `git log` okuma ile başlayın. `diff` ve `patch` yama işler.

    `make` / `gcc` / `python3` dil ve yapı ekosistemine köprüdür. macOS’ta `xcode-select`

    ayrı bir bank kaydıdır.'
  en: 'Start with read-oriented `git status` / `git log`. `diff` and `patch` handle patches.

    `make` / `gcc` / `python3` bridge into language/build ecosystems. On macOS, `xcode-select`

    is a separate bank record.'
