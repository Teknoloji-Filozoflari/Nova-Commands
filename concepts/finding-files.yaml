id: finding-files
kind: nova-commands-concept
format: topic-guide
title:
  tr: Dosya arama
  en: Finding files
summary:
  tr: find, locate, fd ve isim/yol arama kalıpları.
  en: find, locate, fd, and name/path search patterns.
intro:
  tr: İsim, tür ve zamana göre dosya bulmak; geniş find ifadelerinde dikkat.
  en: Find files by name, type, and time; be careful with broad find expressions.
body:
  tr: '`find` ağaçta arar; `locate` (varsa) önceden indekslenmiş veritabanına bakar.

    Başlarken `find . -name ''*.txt''` gibi dar kalıplar kullanın. `-delete` ve `-exec rm`

    tehlikeli olabilir — bu rehberde salt listeleme tercih edilir.


    Windows’ta `Get-ChildItem -Recurse` benzer işi görür; bank kaydına bakın.'
  en: '`find` walks trees; `locate` (when present) queries a prebuilt database.

    Start with narrow patterns like `find . -name ''*.txt''`. `-delete` and `-exec rm`

    can be dangerous — this guide prefers listing only.


    On Windows, `Get-ChildItem -Recurse` covers similar jobs; see the bank record.'
difficulty: beginner
