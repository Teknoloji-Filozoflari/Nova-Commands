    en: conf list
  prompt:
    tr: find /etc -maxdepth 1 -name '*.conf' 2>/dev/null | head çıktısını yorumlayın.
    en: Interpret find /etc -maxdepth 1 -name '*.conf' 2>/dev/null | head.
  risk: safe
  related_commands:
  - find
- title:
    tr: Zaman filtresi
    en: Time filter
  prompt:
    tr: find ~ -maxdepth 2 -type f -mtime -30 2>/dev/null | head — bu ay değişenler.
    en: find ~ -maxdepth 2 -type f -mtime -30 2>/dev/null | head — changed this month.
  risk: safe
  related_commands:
  - find
