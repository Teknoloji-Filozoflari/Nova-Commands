graded_examples:
- title:
    tr: İsim kalıbı
    en: Name pattern
  command: find /tmp -maxdepth 2 -type f -name '*.txt'
  explanation:
    tr: /tmp altında sığ .txt dosyalarını listeler.
    en: Lists shallow .txt files under /tmp.
  difficulty: beginner
  risk: safe
  related_commands:
  - find
- title:
    tr: Yalnız dizinler
    en: Directories only
  command: find ~ -maxdepth 1 -type d
  explanation:
    tr: Ev altında birinci seviye dizinleri listeler.
    en: Lists first-level directories under home.
  difficulty: beginner
  risk: safe
  related_commands:
  - find
- title:
    tr: Yapılandırma adları
    en: Config names
  command: find /etc -maxdepth 1 -name '*.conf' 2>/dev/null | head
  explanation:
    tr: /etc üstündeki .conf adlarını salt okuma listeler.
    en: Read-only list of top-level .conf names under /etc.
  difficulty: beginner
  risk: safe
  related_commands:
  - find
  - head
- title:
    tr: Son 7 gün
    en: Last 7 days
  command: find ~ -maxdepth 2 -type f -mtime -7 2>/dev/null | head
  explanation:
    tr: Evde son 7 günde değişen dosyalara dar bakış.
    en: Narrow peek at files changed in the last 7 days under home.
  difficulty: intermediate
  risk: safe
  related_commands:
  - find
- title:
    tr: which ile komut yolu
    en: Command path via which
  command: which find; which ls
  explanation:
    tr: Arama araçlarının PATH konumunu görün.
    en: See PATH locations of search tools.
  difficulty: beginner
  risk: safe
  related_commands:
  - which
  - find
  - ls
callouts:
- kind: caution
  text:
    tr: Kökten (`/`) geniş find yavaş ve gürültülüdür; maxdepth kullanın.
    en: Broad find from `/` is slow and noisy; use maxdepth.
- kind: tip
  text:
    tr: Önce find . -name 'kalıp' | head ile sınırlayın; sonra genişletin.
    en: Start with find . -name 'pattern' | head; then widen.
- kind: warning
  text:
    tr: -delete / -exec rm öğrenme aşamasında kullanmayın.
    en: Do not use -delete / -exec rm while learning.
safe_exercises:
- title:
    tr: Dar find
    en: Narrow find
  prompt:
