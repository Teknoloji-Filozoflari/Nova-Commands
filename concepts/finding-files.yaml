id: finding-files
kind: nova-commands-concept
format: topic-guide
title:
  tr: Dosya arama
  en: Finding files
summary:
  tr: find, locate, fd ve isim/yol arama kalıpları.
  en: find, locate, fd, and name/path search patterns.
intro:
  tr: İsim, tür ve zamana göre dosya bulmak; geniş find ifadelerinde dikkat.
  en: Find files by name, type, and time; be careful with broad find expressions.
body:
  tr: '## find ile ağaç araması


    `find` dizin ağacını gezer. Başlarken dar kalıplar kullanın: `find . -name ''*.txt''`, `find /tmp
    -maxdepth 2 -type f`.


    ## İsim, tür, zaman


    `-name` / `-iname` isim; `-type f|d` tür; `-mtime -30` son 30 günde değişenler. Hata gürültüsü için
    `2>/dev/null` (öğrenme) kullanılabilir.


    ## locate


    `locate` (varsa) indeks kullanır — hızlıdır ama güncel olmayabilir. `updatedb` root ister.


    ## Güvenlik


    `-delete` ve `-exec rm` tehlikelidir. Bu rehber salt listelemeyi öğretir. Windows’ta `Get-ChildItem
    -Recurse` ayrı modeldir.

    '
  en: '## Searching with find


    `find` walks a directory tree. Start narrow: `find . -name ''*.txt''`, `find /tmp -maxdepth 2 -type
    f`.


    ## Name, type, time


    `-name` / `-iname` for names; `-type f|d` for type; `-mtime -30` for files changed in 30 days. You
    may silence noise with `2>/dev/null` while learning.


    ## locate


    `locate` (when present) uses an index — fast, possibly stale. `updatedb` needs root.


    ## Safety


    `-delete` and `-exec rm` are dangerous. This guide teaches listing only. On Windows, `Get-ChildItem
    -Recurse` is a different model.

    '
