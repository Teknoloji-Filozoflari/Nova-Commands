command_table:
- id: find
  purpose:
    tr: Dizin ağacında dosya arar.
    en: Search for files in a directory hierarchy.
  learning_level: intermediate
- id: locate
  purpose:
    tr: Önceden indekslenmiş dosya adı araması.
    en: Find files by name via a prebuilt database.
  learning_level: beginner
- id: which
  purpose:
    tr: Komutun PATH üzerindeki konumunu gösterir.
