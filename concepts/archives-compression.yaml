id: archives-compression
kind: nova-commands-concept
format: topic-guide
title:
  tr: Arşiv ve sıkıştırma
  en: Archives and compression
summary:
  tr: tar, gzip, xz, zip — oluşturma ve çıkarma; üzerine yazmaya dikkat.
  en: tar, gzip, xz, zip — create and extract; watch overwrites.
intro:
  tr: Arşivlemek ve açmak; yanlış -C veya üzerine yazma veri kaybettirir.
  en: Archive and extract; wrong -C or overwrites can lose data.
body:
  tr: '`tar -czf` sıkıştırılmış arşiv oluşturur; `tar -tzf` içeriği listeler; `tar -xzf` çıkarır.

    Önce listeleyin (`-t`), sonra çıkarın. `unzip -l` benzer şekilde listeler.


    Windows’ta Expand-Archive / tar (bsdtar) farklılıkları için bank kayıtlarına bakın.'
  en: '`tar -czf` creates a compressed archive; `tar -tzf` lists; `tar -xzf` extracts.

    List first (`-t`), then extract. `unzip -l` likewise lists.


    On Windows, see bank records for Expand-Archive / tar (bsdtar) differences.'
