graded_examples:
- title:
    tr: Oluştur ve listele
    en: Create and list
  command: mkdir -p /tmp/nova-arc/demo && echo x > /tmp/nova-arc/demo/a.txt && tar -czf /tmp/nova-arc/demo.tar.gz
    -C /tmp/nova-arc demo && tar -tzf /tmp/nova-arc/demo.tar.gz
  explanation:
    tr: Küçük bir ağaç arşivleyip üyeleri listeler.
    en: Archives a tiny tree and lists members.
  difficulty: beginner
  risk: caution
  related_commands:
  - tar
  - mkdir
- title:
    tr: İçerik listele
    en: List contents
  command: tar -tzf /tmp/nova-arc/demo.tar.gz | head
  explanation:
    tr: Var olan demo arşivini açmadan listeler.
    en: Lists the demo archive without extracting.
  difficulty: beginner
  risk: safe
  related_commands:
  - tar
- title:
    tr: /tmp içine çıkar
    en: Extract into /tmp
  command: mkdir -p /tmp/nova-arc/out && tar -xzf /tmp/nova-arc/demo.tar.gz -C /tmp/nova-arc/out && ls
    /tmp/nova-arc/out
  explanation:
    tr: -C ile hedef seçerek çıkarır; ev dizinine dağılmaz.
    en: Extracts with an explicit -C target; does not litter home.
  difficulty: intermediate
  risk: caution
  related_commands:
  - tar
  - ls
callouts:
- kind: caution
  text:
    tr: Çıkarma mevcut dosyaların üzerine yazabilir.
    en: Extraction can overwrite existing files.
- kind: tip
  text:
    tr: Önce tar -tzf ile bakın; sonra -xzf.
    en: List with tar -tzf first; then -xzf.
safe_exercises:
- title:
    tr: Listele önce
    en: List first
  prompt:
    tr: Bir .tar.gz oluşturup tar -tzf ile listeleyin; çıkarmadan önce üyeleri okuyun.
    en: Create a .tar.gz and list with tar -tzf; read members before extracting.
  risk: caution
  related_commands:
  - tar
- title:
    tr: Güvenli çıkarım
    en: Safe extract
  prompt:
    tr: tar -xzf ... -C /tmp/hedef ile çıkarın; ls ile doğrulayın.
    en: Extract with tar -xzf ... -C /tmp/target; verify with ls.
  risk: caution
  related_commands:
  - tar
  - ls
