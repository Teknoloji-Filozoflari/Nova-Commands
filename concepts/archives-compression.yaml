id: archives-compression
kind: nova-commands-concept
format: topic-guide
title:
  tr: Arşiv ve sıkıştırma
  en: Archives and compression
summary:
  tr: tar, gzip, xz, zip — oluşturma ve çıkarma; üzerine yazmaya dikkat.
  en: tar, gzip, xz, zip — create and extract; watch overwrites.
intro:
  tr: Arşivlemek ve açmak; yanlış -C veya üzerine yazma veri kaybettirir.
  en: Archive and extract; wrong -C or overwrites can lose data.
body:
  tr: '## tar temeli


    `tar -czf arsiv.tar.gz dizin` oluşturur. `tar -tzf arsiv.tar.gz` listeler. `tar -xzf arsiv.tar.gz`
    çıkarır.


    Sıra: önce `-t` ile listeleyin, sonra çıkarın. `-C /tmp` hedef dizin seçer.


    ## gzip / xz / zip


    `gzip` / `gunzip` tek dosya; `xz` benzer. `zip -r` / `unzip -l` ZIP dünyası içindir.


    ## Risk


    Çıkarma üzerine yazabilir. Öğrenme için `/tmp` veya `~/pratik` kullanın.

    '
  en: '## tar basics


    `tar -czf archive.tar.gz dir` creates. `tar -tzf archive.tar.gz` lists. `tar -xzf archive.tar.gz`
    extracts.


    Order: list with `-t` first, then extract. `-C /tmp` chooses the target directory.


    ## gzip / xz / zip


    `gzip` / `gunzip` for single files; `xz` similar. `zip -r` / `unzip -l` for ZIP.


    ## Risk


    Extraction can overwrite. Practice under `/tmp` or `~/practice`.

    '
