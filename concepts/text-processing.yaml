id: text-processing
kind: nova-commands-concept
format: topic-guide
title:
  tr: Metin işleme
  en: Text processing
summary:
  tr: cat, grep, sed, awk ve satır araçlarıyla metin süzme.
  en: Filter text with cat, grep, sed, awk, and line tools.
intro:
  tr: Metin dosyalarını okumak, süzmek ve dönüştürmek günlük CLI işinin çekirdeğidir.
  en: Reading, filtering, and transforming text files is core daily CLI work.
body:
  tr: 'Metin işleme, borularla birleşince güçlüdür. `cat` içeriği gösterir; `grep` desen arar;

    `sed` ve `awk` satır dönüşümü yapar. GNU ile BSD araç bayrakları farklılık gösterebilir —

    bankada platform etiketlerine bakın; uydurmayın.


    **Öğrenme sırası:** cat → head/tail → grep → cut/tr → sort/uniq → sed → awk.


    **Uyarı:** `sed -i` yerinde düzenler; önce kopya veya `/tmp` üzerinde deneyin.'
  en: 'Text processing is powerful when composed with pipes. `cat` shows content; `grep` matches

    patterns; `sed` and `awk` transform lines. GNU vs BSD flag differences matter — check

    platform tags in the bank; do not invent flags.


    **Learning order:** cat → head/tail → grep → cut/tr → sort/uniq → sed → awk.


    **Warning:** `sed -i` edits in place; practice on a copy or under `/tmp` first.'
