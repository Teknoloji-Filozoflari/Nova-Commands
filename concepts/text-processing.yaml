id: text-processing
kind: nova-commands-concept
format: topic-guide
title:
  tr: Metin işleme
  en: Text processing
summary:
  tr: cat, grep, sed, awk ve satır araçlarıyla metin süzme.
  en: Filter text with cat, grep, sed, awk, and line tools.
intro:
  tr: Metin dosyalarını okumak, süzmek ve dönüştürmek günlük CLI işinin çekirdeğidir.
  en: Reading, filtering, and transforming text files is core daily CLI work.
body:
  tr: '## Görüntüleme


    Küçük dosya: `cat`. Uzun dosya: `less`. Baş/son: `head` / `tail`. Satır sayısı: `wc -l`.


    ## Arama


    `grep -n desen dosya` satır numaralı arar. `-i` büyük/küçük harf duyarsız; `-c` sayar.


    ## Dönüştürme


    `cut -d: -f1` alan keser. `sort` / `uniq -c` sıralar ve sayar. `sed ''s/a/b/''` basit değiştirir.
    `awk` alan işlemeye yarar.


    ## Sıra


    cat → head/tail → grep → cut/tr → sort/uniq → sed → awk. `sed -i` yerinde düzenler — önce /tmp kopyası.

    '
  en: '## Viewing


    Small files: `cat`. Long files: `less`. Head/tail: `head` / `tail`. Line counts: `wc -l`.


    ## Searching


    `grep -n pattern file` searches with line numbers. `-i` ignores case; `-c` counts.


    ## Transforming


    `cut -d: -f1` cuts fields. `sort` / `uniq -c` sort and count. `sed ''s/a/b/''` does simple substitution.
    `awk` handles field processing.


    ## Order


    cat → head/tail → grep → cut/tr → sort/uniq → sed → awk. `sed -i` edits in place — practice on a /tmp
    copy first.

    '
