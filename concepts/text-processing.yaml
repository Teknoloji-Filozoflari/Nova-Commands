graded_examples:
- title:
    tr: Desen ara
    en: Search pattern
  command: grep -n root /etc/passwd
  explanation:
    tr: passwd içinde satır numaralı arama (salt okuma).
    en: Line-numbered search in passwd (read-only).
  difficulty: beginner
  risk: safe
  related_commands:
  - grep
- title:
    tr: Baş ve son
    en: Head and tail
  command: head -n 3 /etc/passwd; tail -n 3 /etc/passwd
  explanation:
    tr: Aynı dosyanın ilk ve son üç satırı.
    en: First and last three lines of the same file.
  difficulty: beginner
  risk: safe
  related_commands:
  - head
  - tail
- title:
    tr: Satır say
    en: Count lines
  command: wc -l /etc/passwd
  explanation:
    tr: Kayıtlı kullanıcı satır sayısına pratik bakış.
    en: Practical look at account line count.
  difficulty: beginner
  risk: safe
  related_commands:
  - wc
- title:
    tr: Alan kes
    en: Cut fields
  command: 'cut -d: -f1,7 /etc/passwd | head'
  explanation:
    tr: Kullanıcı adı ve kabuk alanlarını keser.
    en: Cuts username and shell fields.
  difficulty: intermediate
  risk: safe
  related_commands:
  - cut
  - head
- title:
    tr: sort | uniq
    en: sort | uniq
  command: printf 'b\na\nb\nc\n' | sort | uniq -c
  explanation:
    tr: Sıralayıp tekrarları sayar — boru hattı temeli.
    en: Sorts then counts duplicates — pipeline basics.
  difficulty: beginner
  risk: safe
  related_commands:
  - sort
  - uniq
- title:
    tr: Basit sed
    en: Simple sed
  command: echo 'kedi sever sut' | sed 's/kedi/Pamuk/'
  explanation:
    tr: İlk eşleşmeyi değiştirir; dosyaya yazmaz.
    en: Replaces the first match; does not write a file.
  difficulty: intermediate
  risk: safe
  related_commands:
  - sed
  - echo
callouts:
- kind: tip
  text:
    tr: Önce grep -n ile bulun; sonra sed planlayın.
    en: Find with grep -n first; then plan sed.
- kind: warning
