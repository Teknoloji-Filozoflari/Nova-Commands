id: processes
kind: nova-commands-concept
format: topic-guide
title:
  tr: Süreçler
  en: Processes
summary:
  tr: ps, top, kill ve süreç gözlemi; sinyallerde dikkat.
  en: ps, top, kill, and process inspection; be careful with signals.
intro:
  tr: Çalışan süreçleri görmek ve güvenli şekilde sinyal göndermek.
  en: See running processes and send signals safely.
body:
  tr: '## Süreç nedir?


    Çalışan her program bir **süreçtir** ve bir **PID** taşır. Donma veya aşırı kaynak kullanımında süreci
    bulup sinyal göndermeyi bilmek gerekir.


    ## Listeleme


    `ps` anlık görüntü verir (`ps aux`, `ps -ef`). `top` / `htop` canlı izler. `pgrep -l ad` ada göre
    PID bulur.


    ## Sinyaller


    `kill PID` varsayılan SIGTERM (15) gönderir — nazikçe sonlandır. Olmazsa `kill -9 PID` (SIGKILL) son
    çaredir. Yanlış PID başka süreci öldürür.


    ## İş kontrolü


    `komut &` arka plan; `jobs`, `bg`, `fg`; Ctrl+Z durdurur. Windows’ta Get-Process / Stop-Process ayrı
    modeldir.

    '
  en: '## What is a process?


    Every running program is a **process** with a **PID**. When something hangs or burns CPU, you need
    to find it and signal it.


    ## Listing


    `ps` is a snapshot (`ps aux`, `ps -ef`). `top` / `htop` are live. `pgrep -l name` finds PIDs by name.


    ## Signals


    `kill PID` defaults to SIGTERM (15) — polite stop. If needed, `kill -9 PID` (SIGKILL) is last resort.
    The wrong PID kills the wrong process.


    ## Job control


    `cmd &` backgrounds; `jobs`, `bg`, `fg`; Ctrl+Z suspends. On Windows, Get-Process / Stop-Process are
    a different model.

    '
