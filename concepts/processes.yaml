graded_examples:
- title:
    tr: Kendi süreçleriniz
    en: Your processes
  command: ps -u "$USER"
  explanation:
    tr: Kullanıcı süreçlerini listeler (POSIX tarzı).
    en: Lists user processes (POSIX-style).
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - ps
- title:
    tr: aux özeti
    en: aux snapshot
  command: ps aux | head
  explanation:
    tr: Geniş anlık liste; head ile sınırlayın.
    en: Wide snapshot; limit with head.
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - ps
  - head
- title:
    tr: Ada göre PID
    en: PID by name
  command: pgrep -l bash | head
  explanation:
    tr: bash ile eşleşen süreç ad/PID (ortama göre).
    en: Name/PID matches for bash (environment-dependent).
  difficulty: beginner
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - pgrep
- title:
    tr: sleep ve jobs
    en: sleep and jobs
  command: sleep 30 & jobs
  explanation:
    tr: Kısa arka plan işi oluşturup jobs ile görün; sonra fg/kill ile temizleyin.
    en: Start a short background job and list it with jobs; clean up with fg/kill.
  difficulty: intermediate
  risk: caution
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - ps
- title:
    tr: Sinyal listesi
    en: Signal list
  command: kill -l | head
  explanation:
    tr: Bilinen sinyal adlarını gösterir; henüz kimseyi öldürmez.
    en: Shows known signal names; kills nothing yet.
  difficulty: intermediate
  risk: safe
  platforms:
  - linux
  - macos
  - bsd
  related_commands:
  - kill
callouts:
- kind: warning
  text:
    tr: pkill kalıbı birden fazla sürece isabet edebilir.
    en: pkill patterns can hit multiple processes.
- kind: tip
  text:
    tr: 'Donmuş süreç sırası: önce kill PID, olmazsa kill -9 PID. PID’yi pgrep veya ps ile bulun.'
    en: 'Hung process order: kill PID first, then kill -9 PID. Find the PID with pgrep or ps.'
- kind: caution
  text:
    tr: kill -9 son çaredir; süreç temiz kapanamayabilir.
    en: kill -9 is last resort; the process may not shut down cleanly.
safe_exercises:
- title:
    tr: ps okuma
    en: Read ps
  prompt:
    tr: ps -u "$USER" | head çıktısını yorumlayın; kill etmeyin.
    en: Interpret ps -u "$USER" | head; do not kill anything.
  risk: safe
  related_commands:
  - ps
- title:
    tr: Arka plan lab
    en: Background lab
  prompt:
    tr: sleep 60 & çalıştırın; jobs ve ps ile bulun; kill ile sonlandırın (yalnız bu sleep).
    en: Run sleep 60 &; find with jobs/ps; kill only that sleep.
  risk: caution
  related_commands:
  - ps
  - kill
- title:
    tr: top gözlemi
    en: Observe top
  prompt:
    tr: top açıp en çok CPU kullanan satırı okuyun; q ile çıkın (sinyal göndermeyin).
    en: Open top, read the top CPU row, quit with q (send no signals).
  risk: safe
  related_commands:
  - top
