id: processes
kind: nova-commands-concept
format: topic-guide
title:
  tr: Süreçler
  en: Processes
summary:
  tr: ps, top, kill ve süreç gözlemi; sinyallerde dikkat.
  en: ps, top, kill, and process inspection; be careful with signals.
intro:
  tr: Çalışan süreçleri görmek ve güvenli şekilde sinyal göndermek.
  en: See running processes and send signals safely.
body:
  tr: '`ps` anlık liste; `top`/`htop` canlı görünüm. `kill` varsayılan SIGTERM gönderir;

    `kill -9` (SIGKILL) son çaredir. Yanlış PID başka süreci öldürür.


    Windows’ta `Get-Process` / `Stop-Process` ayrı modeldir — Linux alias’ı değildir.'
  en: '`ps` is a snapshot; `top`/`htop` are live views. `kill` defaults to SIGTERM;

    `kill -9` (SIGKILL) is a last resort. The wrong PID kills the wrong process.


    On Windows, `Get-Process` / `Stop-Process` are a different model — not Linux aliases.'
