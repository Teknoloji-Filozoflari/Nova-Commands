id: software
kind: nova-commands-concept
format: topic-guide
title:
  tr: Yazılım yığınları (Software)
  en: Software stacks
summary:
  tr: Kurulabilir yazılım CLI’ları — frontend, backend, sunucu ve araçlar; komut + alt komutlar.
  en: Installable software CLIs — frontend, backend, server, and tools; commands plus key subcommands.
intro:
  tr: Bu rehber Node/.NET/Angular/VS Code gibi yığın CLI’larını öğretir. Kategori development kalır;
    ayrım tags + alt konularladır (frontend / backend / server / tools). Docker/systemctl buraya
    bağlanır, kopyalanmaz.
  en: This guide teaches stack CLIs such as Node/.NET/Angular/VS Code. Category stays development;
    frontend / backend / server / tools are tags and subtopics. Docker/systemctl are linked, not
    duplicated.
body:
  tr: |
    Software, kurulabilir uygulama ve dil yığınlarının CLI yüzüdür. Sistem paket yöneticilerinden
    (pacman/apt) ayrı düşünün: çoğu proje `npm`/`dotnet` ile kendi bağımlılığını yönetir.

    Frontend yolu: `node` → `npm`/`npx` → isteğe `yarn`/`pnpm`/`bun` → `ng` (Angular) → `code`.
    Backend yolu: `dotnet` (ve bankadaki `python3`/`cargo`) ile derle, test et, çalıştır.
    Server/ops: mevcut `docker` ve `systemctl` kayıtlarına related ile gidin; burada tekrar etmeyin.

    Öğrenme sırası salt-okuma sürüm komutlarıyla başlar (`node -v`, `dotnet --info`, `code --version`).
    Kurulum/yayınlama örnekleri caution’dır; production publish/deploy bu rehberin dışında tutulur.
  en: |
    Software is the CLI surface of installable app and language stacks. Treat it separately from
    system package managers (pacman/apt): many projects manage deps with `npm`/`dotnet`.

    Frontend path: `node` → `npm`/`npx` → optional `yarn`/`pnpm`/`bun` → `ng` (Angular) → `code`.
    Backend path: build/test/run with `dotnet` (and bank `python3`/`cargo`).
    Server/ops: follow related links to existing `docker` and `systemctl` records; do not duplicate.

    Start with read-only version commands (`node -v`, `dotnet --info`, `code --version`).
    Install/publish examples stay caution; production publish/deploy is out of scope here.
