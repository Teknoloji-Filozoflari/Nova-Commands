graded_examples:
- title:
    tr: Node sürümü
    en: Node version
  command: node -v
  explanation:
    tr: Kurulu Node.js sürümünü yazar; kurulum doğrulama için güvenli ilk adım.
    en: Prints installed Node.js version; safe first check after install.
  difficulty: beginner
  risk: safe
  related_commands:
  - node
- title:
    tr: npm bağımlılık kur
    en: npm install deps
  command: npm install
  explanation:
    tr: package.json’dan bağımlılıkları kurar; node_modules yazar (ağ + disk).
    en: Installs dependencies from package.json; writes node_modules (network + disk).
  difficulty: beginner
  risk: caution
  related_commands:
  - npm
- title:
    tr: npx ile tek seferlik CLI
    en: One-shot CLI via npx
  command: npx --yes cowsay 'hello'
  explanation:
    tr: Paketi geçici indirip çalıştırır; kalıcı global kurulum istemez.
    en: Downloads/runs a package temporarily; avoids permanent global install.
  difficulty: beginner
  risk: caution
  related_commands:
  - npx
- title:
    tr: Angular sürüm
    en: Angular version
  command: ng version
  explanation:
    tr: Angular CLI ve workspace sürüm bilgisini gösterir.
    en: Shows Angular CLI and workspace version info.
  difficulty: intermediate
  risk: safe
  related_commands:
  - ng
- title:
    tr: VS Code ile dizin aç
    en: Open folder in VS Code
  command: code .
  explanation:
    tr: Geçerli dizini VS Code’da açar (PATH’te `code` shell komutu gerekir).
    en: Opens the current directory in VS Code (`code` shell command must be on PATH).
  difficulty: beginner
  risk: safe
  related_commands:
  - code
- title:
    tr: dotnet bilgi
    en: dotnet info
  command: dotnet --info
  explanation:
    tr: SDK/runtime ortam özetini yazar; kurulum teşhisi için salt okuma.
    en: Prints SDK/runtime environment summary; read-only install diagnostics.
  difficulty: beginner
  risk: safe
  related_commands:
  - dotnet
- title:
    tr: dotnet new + run
    en: dotnet new + run
  command: dotnet new console -n HelloCli && cd HelloCli && dotnet run
  explanation:
    tr: Konsol projesi oluşturur ve çalıştırır; çalışma dizininde dosya yazar.
    en: Creates and runs a console project; writes files in the working directory.
  difficulty: intermediate
  risk: caution
  related_commands:
  - dotnet
callouts:
- kind: tip
  text:
    tr: Önce `-v` / `--version` / `--info` ile runtime’ı doğrulayın; sonra paket kurun.
    en: Verify the runtime with `-v` / `--version` / `--info` before installing packages.
- kind: note
  text:
    tr: Frontend/backend/server ayrımı şema alanı değil; tags + subtopics ile browse/filter edilir.
    en: Frontend/backend/server is not a schema field; browse/filter via tags + subtopics.
- kind: warning
  text:
    tr: >-
      npm publish, production dotnet deploy ve Docker grup yetkisi bu rehberin caution/danger
      sınırındadır — örnekleri kopyalamadan ortamı bilin.
    en: >-
      npm publish, production dotnet deploy, and Docker group power sit at this guide's
      caution/danger edge — know your environment before copying examples.
- kind: caution
  text:
    tr: Global `npm install -g` host PATH’ini değiştirir; proje-yerel kurulum çoğu zaman yeterlidir.
    en: Global `npm install -g` changes host PATH; project-local installs are usually enough.
safe_exercises:
- title:
    tr: Runtime sürümleri
    en: Runtime versions
  prompt:
    tr: >-
      node -v, npm -v, dotnet --info (varsa) ve code --version (varsa) çıktılarını okuyun.
    en: >-
      Read output of node -v, npm -v, dotnet --info (if present), and code --version (if present).
  risk: safe
  related_commands:
  - node
  - npm
  - dotnet
  - code
- title:
    tr: npm script listesi
    en: List npm scripts
  prompt:
    tr: >-
      Bir Node projesinde npm run (argsız) ile tanımlı script'leri listeleyin; bir şey çalıştırmayın.
    en: >-
      In a Node project, list scripts with bare npm run; do not execute any.
  risk: safe
  related_commands:
  - npm
- title:
    tr: VS Code uzantı listesi
    en: List VS Code extensions
  prompt:
    tr: >-
      code --list-extensions ile kurulu uzantıları okuyun (kurulum yapmayın).
    en: >-
      Read installed extensions with code --list-extensions (do not install).
  risk: safe
  related_commands:
  - code
