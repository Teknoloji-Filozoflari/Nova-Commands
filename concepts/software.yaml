id: software
kind: nova-commands-concept
format: topic-guide
title:
  tr: Yazılım CLI’ları (Software)
  en: Software CLIs
summary:
  tr: Kurulabilir dünya çapında yazılım araçları — diller, frontend/backend, veri, bulut, editörler, oyun.
  en: World-scale installable software tooling — languages, frontend/backend, data, cloud, editors, games.
intro:
  tr: >-
    Software, sistem paket yöneticilerinden (pacman/apt) ayrı düşünülen kurulabilir uygulama/dil/yığın
    CLI’larının öğretici haritasıdır. Alanlar tags + subtopics ile ayrılır; tek bir “ecosystem” şema
    alanı yoktur. command_table en fazla 32 satır — genişlik alt konuların related listelerinde.
  en: >-
    Software is the teachable map of installable app/language/stack CLIs, separate from system package
    managers (pacman/apt). Domains use tags + subtopics; there is no ecosystem schema field.
    command_table maxes at 32 rows — breadth lives in subtopic related lists.
body:
  tr: |
    Bu rehber “baya geniş” bir Software yüzeyidir: Node örnekleri yalnızca başlangıçtı.

    Diller/runtimes: node, deno, bun, python3, php, ruby, java, go, rustc/cargo, swift, dart, dotnet.
    Dil paket yöneticileri: npm/yarn/pnpm, pip/uv/poetry, composer, gem/bundle, mvn/gradle.
    Frontend: ng, vite, tsc, eslint, prettier + editörler (code/codium/nvim/…).
    Backend/server: dil CLI’ları + docker/podman/kubectl/systemctl.
    Veri: psql, mysql, redis-cli, sqlite3, mongosh.
    Bulut/IaC: aws, gcloud, az, doctl, flyctl, terraform, tofu, pulumi, ansible.
    Oyun: godot CLI; Unity Editor CLI ortam/lisans bağımlı olduğu için bankada yok.
    Kütüphane vs CLI: pygame gibi paketler genelde CLI değildir — python3/pip/uv ile kurulur;
    medya hatlarında ffmpeg gibi gerçek CLI’lar yer alır.

    Öğrenmeye salt-okuma sürüm komutlarıyla başlayın. Mevcut kayıtları kopyalamayız; related ile bağlarız.
  en: |
    This guide is a deliberately broad Software surface: Node examples were only a starting point.

    Languages/runtimes: node, deno, bun, python3, php, ruby, java, go, rustc/cargo, swift, dart, dotnet.
    Language package managers: npm/yarn/pnpm, pip/uv/poetry, composer, gem/bundle, mvn/gradle.
    Frontend: ng, vite, tsc, eslint, prettier + editors (code/codium/nvim/…).
    Backend/server: language CLIs + docker/podman/kubectl/systemctl.
    Data: psql, mysql, redis-cli, sqlite3, mongosh.
    Cloud/IaC: aws, gcloud, az, doctl, flyctl, terraform, tofu, pulumi, ansible.
    Games: godot CLI; Unity Editor CLI omitted (environment/license dependent).
    Library vs CLI: packages like pygame are usually not CLIs — install via python3/pip/uv;
    real CLIs such as ffmpeg appear in media pipelines.

    Start with read-only version commands. We link existing records rather than duplicating them.
