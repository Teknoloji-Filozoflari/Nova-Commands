callouts:
- kind: tip
  text:
    tr: >-
      command_table en fazla 32 satırdır; tüm Software komutları için subtopics.related_commands
      ve tags (software + alan) ile gezin.
    en: >-
      command_table is capped at 32 rows; browse the full Software surface via
      subtopics.related_commands and tags (software + domain).
- kind: note
  text:
    tr: >-
      pygame/numpy gibi kütüphaneler CLI değildir. Onları kuran araçlar python3/pip/uv’dir;
      oyun motoru CLI örneği godot’tur. Unity Editor CLI bu bankada yok.
    en: >-
      Libraries like pygame/numpy are not CLIs. Tools that install them are python3/pip/uv;
      godot is the game-engine CLI example. Unity Editor CLI is not in this bank.
- kind: warning
  text:
    tr: >-
      Bulut/IaC komutları (aws apply benzeri, terraform/tofu apply, pulumi up, packer build)
      maliyetli veya yıkıcı olabilir — önce plan/preview/read-only.
    en: >-
      Cloud/IaC commands (aws mutating calls, terraform/tofu apply, pulumi up, packer build)
      can be costly or destructive — prefer plan/preview/read-only first.
- kind: caution
  text:
    tr: Sistem PM (pacman/apt) ile dil PM (npm/pip) karıştırılmamalı; Software ikincisine odaklanır.
    en: Do not confuse system PMs (pacman/apt) with language PMs (npm/pip); Software focuses on the latter.
safe_exercises:
- title:
    tr: Runtime envanteri
    en: Runtime inventory
  prompt:
    tr: >-
      Kurulu olanlar için sürüm okuyun: git --version, node -v, python3 -V, go version,
      java -version, rustc --version, php -v, ruby -v, docker --version, code --version.
    en: >-
      Read versions for whatever is installed: git --version, node -v, python3 -V, go version,
      java -version, rustc --version, php -v, ruby -v, docker --version, code --version.
  risk: safe
  related_commands:
  - git
  - node
  - python3
  - go
  - java
- title:
    tr: DB istemci yardım
    en: DB client help
  prompt:
    tr: psql --help, mysql --help, redis-cli --help, mongosh --help çıktılarına bakın (bağlanmayın).
    en: Skim psql --help, mysql --help, redis-cli --help, mongosh --help (do not connect).
  risk: safe
  related_commands:
  - psql
  - mysql
  - redis-cli
  - mongosh
- title:
