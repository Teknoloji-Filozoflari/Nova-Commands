id: hardware-inspection
kind: nova-commands-concept
format: topic-guide
title:
  tr: Donanım inceleme
  en: Hardware inspection
summary:
  tr: lscpu, lsblk, lspci benzeri salt okuma donanım bilgisi.
  en: Read-only hardware info via lscpu, lsblk, lspci, and peers.
intro:
  tr: Donanımı okumak; firmware/boot yazma yolları bu rehberde yok.
  en: Read hardware; firmware/boot write paths are out of this guide.
body:
  tr: 'Linux’ta `lscpu`, `lsblk`, `lspci`, `lsusb` yaygın salt okuma araçlarıdır.

    macOS/Windows karşılıkları farklıdır (`system_profiler`, Get-Disk, …) — ilgili bank kayıtlarına bakın.

    Disk bölümleme/yazma (`fdisk`, `mkfs`) ayrı ve tehlikelidir.'
  en: 'On Linux, `lscpu`, `lsblk`, `lspci`, and `lsusb` are common read-only tools.

    macOS/Windows counterparts differ (`system_profiler`, Get-Disk, …) — see those bank records.

    Partitioning/formatting (`fdisk`, `mkfs`) is separate and dangerous.'
