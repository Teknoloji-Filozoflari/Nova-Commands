name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Faz 10: pin third-party Actions to immutable commit SHAs (tags are mutable).
# Dependabot still opens weekly update PRs for these pins.
# Matrix runs Python tooling only — never execute catalog shell commands on runners.

jobs:
  validate-catalog:
    name: Validate command bank (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Schema + id + category + i18n + concepts + platform + security
        run: python scripts/validate_catalog.py

      - name: Unit tests
        run: python -m pytest tests/ -q

      # Deterministic catalog rebuild + committed digest match (ubuntu only).
      - name: Record committed content digests
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/ci_check_committed_sha.py

      - name: Build catalog, search-index, manifest
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/build_catalog.py

      - name: Ensure catalog build is coherent and matches commit
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/ci_check_rebuild_coherence.py

      - name: Community / contrib / signing files present
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/config.yml
          test -f .github/ISSUE_TEMPLATE/bug.yml
          test -f .github/ISSUE_TEMPLATE/new-command.yml
          test -f .github/ISSUE_TEMPLATE/category.yml
          test -f .github/ISSUE_TEMPLATE/translation.yml
          test -f .github/dependabot.yml
          test -f .github/workflows/publish-catalog.yml
          test -f docs/catalog-signing.md
          test -f docs/safety.md
          test -f keys/minisign.pub
          test -f keys/README.md
          test -f scripts/validate_security.py
          # Private signing material must never be committed
          ! test -f keys/nova-commands.key
          ! ls keys/*.key >/dev/null 2>&1
