name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-catalog:
    name: Validate command bank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validator dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Schema + id + category + i18n + concepts
        run: python3 scripts/validate_catalog.py

      - name: Record committed content digests
        id: committed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cat = json.loads(Path("metadata/catalog.json").read_text(encoding="utf-8"))
          man = json.loads(Path("metadata/manifest.json").read_text(encoding="utf-8"))
          idx = json.loads(Path("metadata/search-index.json").read_text(encoding="utf-8"))
          sha = cat["content_sha256"]
          assert sha == man["content_sha256"] == idx["content_sha256"], (
              "committed catalog/manifest/search-index content_sha256 mismatch"
          )
          print(f"committed_sha={sha}")
          with open(Path.home() / "committed_sha.txt", "w", encoding="utf-8") as fh:
              fh.write(sha)
          PY

      - name: Build catalog, search-index, manifest
        run: python3 scripts/build_catalog.py

      - name: Unit tests
        run: python3 -m pytest tests/ -q

      - name: Ensure catalog build is coherent and matches commit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          committed = Path.home().joinpath("committed_sha.txt").read_text(encoding="utf-8").strip()
          cat = json.loads(Path("metadata/catalog.json").read_text(encoding="utf-8"))
          man = json.loads(Path("metadata/manifest.json").read_text(encoding="utf-8"))
          idx = json.loads(Path("metadata/search-index.json").read_text(encoding="utf-8"))

          assert cat["schema_version"] == 1
          assert cat["kind"] == "nova-commands-bank"
          assert cat["commands"], "catalog must contain commands"
          assert cat["concepts"], "catalog must contain concepts"
          ids = [c["id"] for c in cat["commands"]]
          assert len(ids) == len(set(ids))
          assert cat["command_count"] == len(ids)
          assert cat["concept_count"] == len(cat["concepts"])
          assert len(cat["content_sha256"]) == 64
          assert man["content_sha256"] == cat["content_sha256"] == idx["content_sha256"]
          assert cat["content_sha256"] == committed, (
              "rebuild content_sha256 differs from committed artifacts; "
              "run scripts/build_catalog.py and commit metadata/"
          )
          verified_cmds = sum(
              1
              for c in cat["commands"]
              if c.get("verification", {}).get("status") == "verified"
          )
          verified_concepts = sum(
              1
              for c in cat["concepts"]
              if c.get("verification", {}).get("status") == "verified"
          )
          print(
              f"catalog ok: {len(ids)} commands, {cat['concept_count']} concepts, "
              f"sha={cat['content_sha256'][:12]}… "
              f"(verified commands={verified_cmds}, concepts={verified_concepts})"
          )
          PY

      - name: Community / contrib files present
        run: |
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/config.yml
          test -f .github/ISSUE_TEMPLATE/bug.yml
          test -f .github/ISSUE_TEMPLATE/new-command.yml
          test -f .github/ISSUE_TEMPLATE/category.yml
          test -f .github/ISSUE_TEMPLATE/translation.yml
          test -f .github/dependabot.yml
