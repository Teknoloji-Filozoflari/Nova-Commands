name: Yeni kategori önerisi
description: Taksonomiye (§8.x) yeni bir kategori slug’ı öner.
title: "[Category]: "
labels: ["enhancement", "taxonomy"]
body:
  - type: markdown
    attributes:
      value: |
        Kategoriler `metadata/categories.yaml` + `schema/command.schema.json`
        enum’unda tutulur. Yeni kategori hem şemayı hem validator’ı etkiler.
  - type: input
    id: slug
    attributes:
      label: Önerilen slug
      description: küçük harf, tire; örn. `virtualization`
      placeholder: category-slug
    validations:
      required: true
  - type: input
    id: label_tr
    attributes:
      label: TR etiket
    validations:
      required: true
  - type: input
    id: label_en
    attributes:
      label: EN label
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Gerekçe
      description: Mevcut 16 kategoriden hangisi yetersiz? Örnek komut id’leri.
    validations:
      required: true
  - type: textarea
    id: sample_commands
    attributes:
      label: Örnek komutlar (en az 3)
      placeholder: |
        - cmd-a
        - cmd-b
        - cmd-c
    validations:
      required: true
