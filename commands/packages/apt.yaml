schema_version: 2
id: apt
name: apt
kind: package_manager
category: packages
summary:
  tr: Debian/Ubuntu yüksek seviye paket aracı.
  en: Debian/Ubuntu high-level package tool.
description:
  tr: Kurulum ve güncelleme için kullanıcı dostu apt arayüzü.
  en: User-friendly apt interface for install and upgrades.
tags:
- packages
- debian
risk: dangerous
learning_level: intermediate
requires_elevated: true
platforms:
- linux
operating_systems:
- linux
packages:
  debian: apt
  ubuntu: apt
package_refs:
- manager: apt
  package: apt
  distributions:
  - debian
  - ubuntu
install_notes:
  tr: Debian/Ubuntu tabanında gelir. Arch için pacman kullanın.
  en: On Debian/Ubuntu base. On Arch use pacman instead.
flags:
- flag: update
  meaning:
    tr: Paket listelerini yenile (alt komut).
    en: Refresh package lists (subcommand).
  verified: true
- flag: upgrade
  meaning:
    tr: Paketleri yükselt (alt komut).
    en: Upgrade packages (subcommand).
  verified: true
- flag: install
  meaning:
    tr: Paket kur (alt komut).
    en: Install packages (subcommand).
  verified: true
- flag: search
  meaning:
    tr: Ara (alt komut).
    en: Search (subcommand).
  verified: true
examples:
- title:
    tr: Güncelle + yükselt
    en: Update + upgrade
  command: sudo apt update && sudo apt upgrade
  explanation:
    tr: İndeksleri yeniler ve yükseltir.
    en: Refreshes indexes and upgrades.
  risk: dangerous
  requires_elevated: true
- title:
    tr: Kur
    en: Install
  command: sudo apt install curl
  explanation:
    tr: curl kurar.
    en: Installs curl.
  risk: caution
  requires_elevated: true
related:
- dpkg
- pacman
- dnf
- zypper
- apk
- opkg
intent:
  tr:
  - ubuntu paket kur
  - apt güncelle
  - apt search
  - paket yükselt
  en:
  - apt install
  - ubuntu upgrade
  - apt search
  - upgrade packages
verification:
  status: reviewed
  sources:
  - man 8 apt
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
nova:
  concepts:
  - packages
  - package-managers
  - package-managers-comparison
purpose:
  tr: Debian/Ubuntu paket kurulum ve yükseltme (Arch’ta pacman kullanın).
  en: Debian/Ubuntu package install/upgrade (use pacman on Arch).
