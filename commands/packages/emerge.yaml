schema_version: 2
id: emerge
name: emerge
kind: package_manager
category: packages
summary:
  tr: Gentoo Portage paket kurucu (emerge).
  en: Gentoo Portage package tool (emerge).
description:
  tr: emerge, Gentoo’nun Portage sisteminin birincil CLI aracıdır. Kaynak tabanlı derleme, USE bayrakları
    ve `@world` güncellemeleri önemlidir. `ebuild` düşük seviye yardımcıdır; günlük işlerde emerge kullanılır.
  en: emerge is the primary CLI for Gentoo’s Portage system. Source builds, USE flags, and `@world` updates
    matter. `ebuild` is a lower-level helper; everyday work uses emerge.
tags:
- packages
- gentoo
- portage
risk: dangerous
requires_elevated: true
platforms:
- linux
operating_systems:
- linux
package_refs:
- manager: portage
  package: portage
  distributions:
  - gentoo
install_notes:
  tr: Gentoo tabanında Portage/emerge gelir. Arch host’ta sistem PM değildir; Arch için pacman.
  en: Gentoo ships Portage/emerge. Not a system PM on Arch; use pacman.
flags:
- flag: --sync
  meaning:
    tr: ebuild ağacını senkronize et.
    en: Sync the ebuild tree.
  verified: false
- flag: --ask / -a
  meaning:
    tr: Onay sor.
    en: Ask before performing actions.
  verified: false
- flag: --verbose / -v
  meaning:
    tr: Ayrıntılı çıktı.
    en: Verbose output.
  verified: false
- flag: --search / -s
  meaning:
    tr: Paket ara.
    en: Search packages.
  verified: false
- flag: --unmerge / -C
  meaning:
    tr: Kaldır (dikkat).
    en: Unmerge/remove (careful).
  verified: false
- flag: -uDN @world
  meaning:
    tr: Dünya setini yükselt (sık birleşim).
    en: Upgrade @world (common combo).
  verified: false
examples:
- title:
    tr: Senkron
    en: Sync tree
  command: sudo emerge --sync
  explanation:
    tr: Portage ağacını günceller.
    en: Updates the Portage tree.
  risk: caution
  requires_elevated: true
- title:
    tr: Kur (sorarak)
    en: Install (ask)
  command: sudo emerge --ask curl
  explanation:
    tr: curl’ü derleyip kurmadan önce onay ister.
    en: Asks before compiling/installing curl.
  risk: caution
  requires_elevated: true
- title:
    tr: Dünya yükselt
    en: Upgrade world
  command: sudo emerge --ask -uDN @world
  explanation:
    tr: Kurulu dünya setini yükseltir — uzun sürebilir.
    en: Upgrades the installed @world set — can take long.
  risk: dangerous
  requires_elevated: true
- title:
    tr: Ara
    en: Search
  command: emerge --search ripgrep
  explanation:
    tr: Paket adına göre arar.
    en: Searches by package name.
  risk: safe
  requires_elevated: false
related:
- pacman
- xbps-install
- nix
- guix
intent:
  tr:
  - gentoo emerge
  - portage kur
  - emerge world
  en:
  - emerge install
  - gentoo upgrade
  - portage sync
verification:
  status: draft
  sources:
  - https://wiki.gentoo.org/wiki/Portage
  - https://wiki.gentoo.org/wiki/Emerge
  - https://devmanual.gentoo.org/
  notes: Agent-authored Faz 4 draft from official docs; not human-verified.
nova:
  concepts:
  - packages
  - package-managers
  - package-managers-comparison
  - nix-guix
