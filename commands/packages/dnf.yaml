schema_version: 2
id: dnf
name: dnf
kind: package_manager
category: packages
summary:
  tr: Fedora/RHEL paket yöneticisi.
  en: Fedora/RHEL package manager.
description:
  tr: Fedora/RHEL aile paket yöneticisi; kurulum, güncelleme ve depo işlemlerini yönetir.
  en: Package manager for Fedora/RHEL families; installs, upgrades, and queries repositories.
tags:
- packages
- fedora
risk: dangerous
requires_elevated: true
platforms:
- linux
operating_systems:
- linux
packages:
  fedora: dnf
  rhel: dnf
package_refs:
- manager: dnf
  package: dnf
  distributions:
  - fedora
  - rhel
install_notes:
  tr: Fedora/RHEL’de taban. Arch için pacman.
  en: Base on Fedora/RHEL. On Arch use pacman.
flags:
- flag: install
  meaning:
    tr: Kur (alt komut).
    en: Install (subcommand).
  verified: true
- flag: upgrade
  meaning:
    tr: Yükselt (alt komut).
    en: Upgrade (subcommand).
  verified: true
- flag: search
  meaning:
    tr: Ara (alt komut).
    en: Search (subcommand).
  verified: true
examples:
- title:
    tr: Kur
    en: Install
  command: sudo dnf install curl
  explanation:
    tr: curl kurar.
    en: Installs curl.
  risk: caution
  requires_elevated: true
- title:
    tr: Yükselt
    en: Upgrade
  command: sudo dnf upgrade
  explanation:
    tr: Sistem paketlerini yükseltir.
    en: Upgrades system packages.
  risk: dangerous
  requires_elevated: true
related:
- rpm
- pacman
- apt
- zypper
- rpm-ostree
intent:
  tr:
  - fedora paket kur
  - dnf güncelle
  en:
  - dnf install
  - fedora upgrade
verification:
  status: reviewed
  sources:
  - man 8 dnf
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
