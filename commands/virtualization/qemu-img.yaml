schema_version: 2
id: qemu-img
name: qemu-img
kind: executable
category: virtualization
summary:
  tr: QEMU disk imajı aracı.
  en: QEMU disk image utility.
description:
  tr: qcow2/raw vb. disk imajlarını oluşturur/dönüştürür/sorgular. Yanlış convert veri kaybına yol açabilir
    — örnekler info odaklı.
  en: Creates/converts/queries qcow2/raw disk images. Bad convert can lose data — examples focus on info.
tags:
- virtualization
