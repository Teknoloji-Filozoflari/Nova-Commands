schema_version: 2
id: chown
name: chown
kind: executable
category: users
summary:
  tr: Dosya sahibini değiştirir.
  en: Change file owner and group.
description:
  tr: Sahip ve/veya grubu ayarlar; genelde root gerekir.
  en: Sets owner and/or group; usually needs root.
tags:
- users
- permissions
risk: dangerous
learning_level: intermediate
requires_elevated: true
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: coreutils
  debian: coreutils
  ubuntu: coreutils
  fedora: coreutils
package_refs:
- manager: pacman
  package: coreutils
  distributions:
  - arch
- manager: apt
  package: coreutils
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: coreutils
  distributions:
  - fedora
flags:
- flag: -R
  long: --recursive
  meaning:
    tr: Özyinelemeli.
    en: Operate recursively.
  verified: true
  platforms:
  - gnu
examples:
- title:
    tr: Sahip değiştir
    en: Change owner
  command: sudo chown -R user:user /var/www/app
  explanation:
    tr: Ağacı user’a verir.
    en: Gives the tree to user.
  risk: dangerous
  requires_elevated: true
related:
- chmod
- chgrp
- ls
intent:
  tr:
  - dosya sahibi değiştir
  - chown
  en:
  - change owner
  - chown file
verification:
  status: reviewed
  sources:
  - man 1 chown
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
  notes: PDF-depth teachable fields.
nova:
  concepts:
  - permissions
when_to_use:
  tr: Dosya/dizin sahibi (ve isteğe bağlı grubu) değiştirmek; genelde root.
  en: Change file/directory owner (and optional group); usually root.
syntax: chown [OPTION]... [OWNER][:[GROUP]] FILE...
expected_effect:
  tr: Sahip/grup alanını günceller; kip bitlerini değiştirmez.
  en: Updates owner/group fields; does not change mode bits.
common_mistakes:
- tr: chown -R ile sistem dizinlerini yanlışlıkla sahiplenmek.
  en: Recursively reclaiming system dirs by mistake.
- tr: Grup sözdizimini (kullanıcı:grup) karıştırmak.
  en: Confusing user:group syntax.
related_topics:
- permissions
