schema_version: 2
id: takeown
name: takeown
kind: executable
category: users
summary:
  tr: Dosya/klasör sahipliğini alır.
  en: Takes ownership of a file or folder.
description:
  tr: takeown, nesne sahipliğini mevcut kullanıcıya geçirir; ardından icacls gerekebilir. Sistem dosyalarında
    tehlikelidir — yönetici (UAC) ister.
  en: takeown assigns ownership to the current user; icacls may still be needed. Dangerous on system files
    — requires Administrator (UAC).
