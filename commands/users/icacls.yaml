schema_version: 2
id: icacls
name: icacls
kind: executable
category: users
summary:
  tr: NTFS ACL görüntüleme ve düzenleme.
  en: Display and edit NTFS ACLs.
description:
  tr: icacls, Windows NTFS izinlerini gösterir/değiştirir. Linux chmod/chown modeli değildir. Yanlış /grant
    veya /reset erişimi kilitleyebilir; yönetici gerekebilir.
  en: icacls displays/changes Windows NTFS permissions. Not the Linux chmod/chown model. Wrong /grant
    or /reset can lock you out; admin may be required.
tags:
- windows
- acl
- ntfs
- permissions
risk: dangerous
requires_elevated: false
