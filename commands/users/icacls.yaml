- windows-powershell
flags: []
examples:
- title:
    tr: ACL göster
    en: Show ACL
  command: icacls C:\Users\Public
  explanation:
    tr: Dizin ACL’sini salt okuma listeler.
    en: Lists the directory ACL read-only.
  risk: safe
  shell: cmd
  platforms:
  - windows
related:
- takeown
- chmod
security:
  notes:
    tr: Sistem yollarında değişiklik UAC ister; yedek ACL alın.
    en: Changing ACLs on system paths needs UAC; back up ACLs first.
  requires_admin: true
  uac_prompt: true
