schema_version: 2
id: chgrp
name: chgrp
kind: executable
category: users
summary:
  tr: Dosya grup sahipliğini değiştirir.
  en: Change group ownership of files.
description:
  tr: Dosya/dizinlerin grup alanını ayarlar. chown :group kısayolu da kullanılabilir.
  en: Sets the group field on files/dirs. chown :group is an alternative.
tags:
- users
- permissions
risk: dangerous
learning_level: intermediate
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: coreutils
  debian: coreutils
  ubuntu: coreutils
  fedora: coreutils
package_refs:
- manager: pacman
  package: coreutils
  distributions:
  - arch
- manager: apt
  package: coreutils
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: coreutils
  distributions:
  - fedora
flags:
- flag: -R
  meaning:
    tr: Özyinelemeli.
    en: Recursive.
  verified: true
  long: --recursive
examples:
- title:
    tr: Grup değiştir
    en: Change group
  command: chgrp staff report.txt
  explanation:
    tr: report.txt grubunu staff yapar.
    en: Sets group staff on report.txt.
  risk: caution
- title:
    tr: Özyinelemeli
    en: Recursive
  command: sudo chgrp -R www-data /var/www/site
  explanation:
    tr: Web kökü grubunu ayarlar.
    en: Sets web root group.
  risk: dangerous
  requires_elevated: true
related:
- chown
- chmod
- groups
intent:
  tr:
  - dosya grubu değiştir
  - chgrp
  en:
  - change file group
  - chgrp
verification:
  status: reviewed
  sources:
  - man 1 chgrp
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-coverage
  notes: PDF-depth teachable fields.
nova:
  concepts:
  - permissions
when_to_use:
  tr: Yalnız grup sahipliğini değiştirmek (chown :grup alternatifi).
  en: Change group ownership only (alternative to chown :group).
syntax: chgrp [OPTION]... GROUP FILE...
expected_effect:
  tr: Grup alanını günceller; sahibi ve kip aynı kalır.
  en: Updates the group field; owner and mode stay the same.
common_mistakes:
- tr: Üye olmadığınız gruba yazmayı beklemek.
  en: Expecting write access to a group you do not belong to.
related_topics:
- permissions
