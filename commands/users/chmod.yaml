schema_version: 2
id: chmod
name: chmod
kind: executable
category: users
summary:
  tr: Dosya kipini (izinlerini) değiştirir.
  en: Change file mode bits.
description:
  tr: Sembolik veya oktal notasyonla izinleri ayarlar. Yanlış kullanım erişimi kırabilir.
  en: Sets permissions symbolically or in octal. Mistakes can break access.
tags:
- users
- permissions
risk: dangerous
learning_level: intermediate
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: coreutils
  debian: coreutils
  ubuntu: coreutils
  fedora: coreutils
package_refs:
- manager: pacman
  package: coreutils
  distributions:
  - arch
- manager: apt
  package: coreutils
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: coreutils
  distributions:
  - fedora
flags:
- flag: -R
  long: --recursive
  meaning:
    tr: Özyinelemeli uygula.
    en: Apply recursively.
  verified: true
  platforms:
  - gnu
examples:
- title:
    tr: Çalıştırılabilir
    en: Make executable
  command: chmod u+x script.sh
  explanation:
    tr: Sahibine çalıştırma izni ekler.
    en: Adds execute for the owner.
  risk: caution
- title:
    tr: Oktal
    en: Octal
  command: chmod 600 id_rsa
  explanation:
    tr: Yalnızca sahip okur/yazar (SSH anahtarı için tipik).
    en: Owner read/write only (typical for SSH keys).
  risk: caution
- title:
    tr: 755 betik/klasör
    en: 755 script/dir
  command: chmod 755 script.sh
  explanation:
    tr: rwxr-xr-x — sahip yazar; diğerleri okur/çalıştırır.
    en: rwxr-xr-x — owner writes; others read/execute.
  risk: caution
  difficulty: beginner
- title:
    tr: go-w
    en: go-w
  command: chmod go-w file.txt
  explanation:
    tr: Grup ve diğerlerinden yazmayı kaldırır.
    en: Removes write from group and others.
  risk: caution
  difficulty: intermediate
related:
- chown
- ls
intent:
  tr:
  - izin değiştir
  - chmod 755
  en:
  - change permissions
  - chmod file
verification:
  status: reviewed
  sources:
  - man 1 chmod
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
  notes: NV-123 teachable fields (when/syntax/mistakes/topics). PDF-depth teachable fields.
nova:
  concepts:
  - permissions
when_to_use:
  tr: Dosya veya dizin izin bitlerini (rwx / oktal) değiştirmek.
  en: Change permission bits (rwx / octal) on files or directories.
syntax: chmod [OPTION]... MODE[,MODE]... FILE...
expected_effect:
  tr: Hedeflerin kipini günceller; içerikleri değiştirmez. ls -l ile doğrulayın.
  en: Updates modes on targets; does not change contents. Verify with ls -l.
common_mistakes:
- tr: chmod -R ile yanlışlıkla geniş ağacı açmak.
  en: Accidentally opening a wide tree with chmod -R.
- tr: 777’yi “çözüm” sanmak.
  en: Treating 777 as a “fix”.
- tr: Dizinde x bitini kaldırıp traverse’i kırmak.
  en: Removing directory x and breaking traverse.
related_topics:
- permissions
- linux-directory-structure
