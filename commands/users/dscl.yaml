schema_version: 2
id: dscl
name: dscl
kind: administrative_tool
category: users
summary:
  tr: Directory Service komut satırı (kullanıcı/düğüm).
  en: Directory Service command line (users/nodes).
description:
  tr: dscl, Open Directory / yerel dizin düğümlerini okur/yazar. Kullanıcı oluşturma/silme yıkıcı olabilir.
    Linux getent/useradd modeli değildir.
  en: dscl reads/writes Open Directory / local directory nodes. Creating/deleting users can be destructive.
    Not the Linux getent/useradd model.
