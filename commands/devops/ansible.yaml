schema_version: 2
id: ansible
name: ansible
kind: remote_cli
category: devops
summary:
  tr: Ansible otomasyon motoru.
  en: Ansible automation engine.
description:
  tr: SSH/WinRM üzerinden yapılandırma otomasyonu. Playbook çalıştırmak uzak sistemleri değiştirir — örnekler
    sürüm/inventory odaklı. `ansible-playbook` ayrı binary olabilir.
  en: Configuration automation over SSH/WinRM. Running playbooks mutates remote systems — examples focus
    on version/inventory. `ansible-playbook` may be a separate binary.
