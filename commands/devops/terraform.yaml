schema_version: 2
id: terraform
name: terraform
kind: remote_cli
category: devops
summary:
  tr: HashiCorp Terraform (IaC).
  en: HashiCorp Terraform (IaC).
description:
  tr: Altyapıyı deklaratif kodla yönetir. `apply`/`destroy` yıkıcı olabilir; OpenTofu ayrı bir araçtır
    (henüz ayrı kayıt yok). Provider credential örneklerinde gerçek secret yok.
  en: Manages infrastructure as declarative code. `apply`/`destroy` can be destructive; OpenTofu is a
    separate tool (no separate record yet). Provider credential examples never include real secrets.
tags:
- iac
- terraform
- devops
- cloud
risk: dangerous
learning_level: advanced
requires_elevated: false
platforms:
- linux
- macos
- windows
operating_systems:
- linux
- macos
- windows
flags: []
examples:
- title:
    tr: Sürüm
    en: Version
  command: terraform version
  explanation:
    tr: Terraform sürümü.
    en: Terraform version.
  risk: safe
  difficulty: beginner
- title:
    tr: Validate
    en: Validate
  command: terraform validate
  explanation:
    tr: Çalışma dizinindeki yapılandırmayı doğrular (uygulamaz).
    en: Validates config in the working directory (does not apply).
  risk: safe
  difficulty: beginner
- title:
    tr: Plan
    en: Plan
  command: terraform plan
  explanation:
    tr: Değişiklik planı (uygulamaz). Provider kimliği gerekir.
    en: Change plan (does not apply). Needs provider credentials.
  risk: caution
  difficulty: intermediate
intent:
  tr:
  - terraform
  - altyapı kodu
  - iac
  en:
  - terraform
  - infrastructure as code
  - iac
verification:
  status: draft
  sources:
  - https://developer.hashicorp.com/terraform/cli
  - https://developer.hashicorp.com/terraform/cli/commands
  notes: Agent-authored Faz 7 draft from official docs; not human-verified.
related:
- ansible
- aws
- az
- gcloud
- kubectl
package_refs:
- manager: pacman
  package: terraform
  distributions:
  - arch
packages:
  arch: terraform
install_notes:
  tr: |-
    Arch’ta bilinen paket: pacman -S terraform. Diğer distrolarda HashiCorp/OpenTofu kanalları veya
    upstream binary yaygındır — Linux filtresiz host’ta Arch’ı sessiz varsaymayın; paket adını doğrulayın.
  en: |-
    Known Arch package: pacman -S terraform. Other distros often use HashiCorp/OpenTofu channels or
    upstream binaries — do not silently default to Arch when Linux is undifferenced; verify package name.
nova:
  favorite_eligible: true
  ui_priority: 60
  concepts:
  - infrastructure-as-code
  - cloud
