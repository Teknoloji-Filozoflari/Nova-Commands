kind: powershell_cmdlet
category: system
summary:
  tr: Zamanlanmış görevleri listeler (Task Scheduler).
  en: Lists scheduled tasks (Task Scheduler).
description:
  tr: Get-ScheduledTask, Windows Görev Zamanlayıcı görevlerini listeler. `schtasks.exe` ayrı bir executable
    kaydıdır. Görev oluşturma/silme yönetici gerektirebilir; bu kayıt sorgu odaklıdır.
  en: Get-ScheduledTask lists Windows Task Scheduler tasks. schtasks.exe is a separate executable record.
    Creating/deleting tasks may need admin; this record is query-focused.
