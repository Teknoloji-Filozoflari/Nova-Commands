schema_version: 2
id: set-service
name: Set-Service
kind: powershell_cmdlet
category: system
summary:
  tr: Windows servis özelliklerini değiştirir.
  en: Changes Windows service properties.
description:
  tr: Set-Service, Service Control Manager üzerinden servis durumunu/özelliklerini değiştirir. Linux systemctl
    karşılığı değildir. Başlangıç türü vb. değiştirir; yanlış yapılandırma kalıcı etki yapar. UAC gerekir.
  en: Set-Service changes service state/properties via SCM. Not a systemctl alias. Changes startup type
    etc.; misconfiguration persists. UAC required.
