name: Restart-Service
kind: powershell_cmdlet
category: system
summary:
  tr: Windows servisini yeniden başlatır.
  en: Restarts a Windows service.
description:
  tr: Restart-Service, Service Control Manager üzerinden servis durumunu/özelliklerini değiştirir. Linux
    systemctl karşılığı değildir. Kısa kesinti yaratır. Yönetici (UAC) gerekir.
  en: Restart-Service changes service state/properties via SCM. Not a systemctl alias. Causes a brief
    outage. Requires Administrator (UAC).
