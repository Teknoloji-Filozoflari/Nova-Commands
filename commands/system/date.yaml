schema_version: 2
id: date
name: date
kind: executable
category: system
summary:
  tr: Tarih ve saati yazdırır veya ayarlar.
  en: Print or set the system date.
description:
  tr: Biçimli tarih/saat çıktısı üretir; ayarlamak root ister. macOS/BSD `date` GNU date’ten farklıdır
    (ör. `-d` yok; `-v` / `-r` kullanın).
  en: Formats date/time output; setting requires root. macOS/BSD date differs from GNU date (e.g. no -d;
    use -v / -r).
tags:
- system
- time
risk: safe
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: coreutils
  debian: coreutils
  ubuntu: coreutils
  fedora: coreutils
package_refs:
- manager: pacman
  package: coreutils
  distributions:
  - arch
- manager: apt
  package: coreutils
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: coreutils
  distributions:
  - fedora
flags:
- flag: -u
  long: --utc
  meaning:
    tr: UTC olarak yazdır.
    en: Print Coordinated Universal Time.
  verified: true
  platforms:
  - gnu
examples:
- title:
    tr: ISO benzeri
    en: ISO-like
  command: date -Iseconds
  explanation:
    tr: ISO-8601 saniyeli çıktı (GNU).
    en: ISO-8601 output with seconds (GNU).
  risk: safe
related:
- timedatectl
intent:
  tr:
  - tarih saat
  - bugünün tarihi
  en:
  - show date
  - current time
verification:
