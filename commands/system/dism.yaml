schema_version: 2
id: dism
name: DISM
kind: administrative_tool
category: system
summary:
  tr: Deployment Image Servicing and Management.
  en: Deployment Image Servicing and Management.
description:
  tr: DISM, Windows imajlarını ve çevrimiçi bileşen deposunu yönetir. `/Cleanup-Image /RestoreHealth`
    onarım için yaygındır; yönetici ister. Yanlış imaj yolu sistemi bozabilir.
  en: DISM services Windows images and the online component store. /Cleanup-Image /RestoreHealth is a
    common repair path; needs admin. Wrong image paths can damage the system.
