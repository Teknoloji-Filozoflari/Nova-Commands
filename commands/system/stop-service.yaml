schema_version: 2
id: stop-service
name: Stop-Service
kind: powershell_cmdlet
category: system
summary:
  tr: Windows servisini durdurur.
  en: Stops a Windows service.
description:
  tr: Stop-Service, Service Control Manager üzerinden servis durumunu/özelliklerini değiştirir. Linux
    systemctl karşılığı değildir. Kritik servisleri durdurmak oturumu veya rolleri bozabilir. UAC gerekir.
  en: Stop-Service changes service state/properties via SCM. Not a systemctl alias. Stopping critical
    services can break sessions or roles. UAC required.
