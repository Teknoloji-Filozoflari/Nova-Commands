id: timedatectl
name: timedatectl
summary:
  tr: Sistem saati ve zaman dilimini denetler.
  en: Control system time and timezone.
description:
  tr: 'systemd zaman ayarları: saat dilimi, NTP/chrony eşlemesi ve RTC.'
  en: 'systemd time settings: timezone, NTP sync, and RTC.'
tags:
- system
- systemd
- time
risk: caution
requires_elevated: true
platforms:
- linux
packages:
  arch: systemd
  debian: systemd
  ubuntu: systemd
  fedora: systemd
install_notes:
  tr: 'Arch: pacman -S systemd (taban)'
  en: 'Arch: pacman -S systemd (base)'
flags:
- flag: status
  meaning:
    tr: Durum göster.
    en: Show status.
  verified: true
- flag: set-timezone
  meaning:
    tr: Zaman dilimi ayarla.
    en: Set timezone.
  verified: true
  takes_value: true
  value_name: zone
- flag: set-ntp
  meaning:
    tr: NTP aç/kapa.
    en: Enable/disable NTP.
  verified: true
  takes_value: true
  value_name: bool
examples:
- title:
    tr: Durum
    en: Status
  command: timedatectl status
  explanation:
    tr: Saat, dilim ve NTP durumu.
    en: Clock, timezone, NTP state.
  risk: safe
  requires_elevated: false
- title:
    tr: Zaman dilimi
    en: Timezone
  command: sudo timedatectl set-timezone Europe/Istanbul
  explanation:
    tr: TZ’yi ayarlar.
    en: Sets timezone.
  risk: caution
  requires_elevated: true
- title:
    tr: NTP
    en: NTP
  command: sudo timedatectl set-ntp true
  explanation:
    tr: Zaman eşlemesini açar.
    en: Enables network time sync.
  risk: caution
  requires_elevated: true
related:
- date
- systemctl
- hwclock
intent:
  tr:
  - saat dilimi ayarla
  - ntp aç
  en:
  - set timezone
  - enable ntp
verification:
  status: reviewed
  sources:
  - man 1 timedatectl
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-coverage
nova:
  concepts:
  - systemd
category: system
