name: Get-ComputerInfo
kind: powershell_cmdlet
category: system
summary:
  tr: Windows sistem / donanım özet bilgisi.
  en: Windows system / hardware summary info.
description:
  tr: Get-ComputerInfo, işletim sistemi, BIOS ve donanım özetini bir nesnede toplar. Windows Server ve
    istemci sürümlerinde yönetim keşfi için kullanışlıdır. Linux `uname`/`hostnamectl` karşılığı değildir.
  en: Get-ComputerInfo aggregates OS, BIOS, and hardware summary into one object. Useful on Windows Server
    and client for inventory. Not a uname/hostnamectl alias.
