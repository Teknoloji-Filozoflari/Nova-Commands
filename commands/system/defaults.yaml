  tr: defaults, uygulama domain tercihlerini okur/yazar. Yanlış yazma uygulama ayarlarını bozar. `plutil`
    plist doğrulama için ayrı kayıttır.
  en: defaults reads/writes app domain preferences. Wrong writes break app settings. plutil is a separate
    record for plist validation.
