schema_version: 2
id: get-command
name: Get-Command
kind: powershell_cmdlet
category: system
aliases:
- gcm
summary:
  tr: PowerShell’de komut, cmdlet, fonksiyon veya alias bulur.
  en: Finds a cmdlet, function, alias, or executable in PowerShell.
description:
  tr: Get-Command, PowerShell oturumunda hangi komutların yüklü/erişilebilir olduğunu listeler. Linux
    `which`/`type` karşılığı değildir — ayrı kayıt. PowerShell 7+ (`pwsh`) ve Windows PowerShell 5.1’de
    çalışır; bazı modüller yalnızca Windows’ta bulunur.
  en: Get-Command lists which commands are available in the PowerShell session. It is not a Linux which/type
    alias — separate record. Works on PowerShell 7+ (pwsh) and Windows PowerShell 5.1; some modules are
    Windows-only.
tags:
- powershell
- windows
- discovery
risk: safe
learning_level: beginner
requires_elevated: false
platforms:
- windows
operating_systems:
- windows
shells:
- powershell
- windows-powershell
flags:
- flag: -Name
  meaning:
    tr: Komut adı / joker.
    en: Command name / wildcard.
  verified: false
  takes_value: true
  value_name: Name
- flag: -Module
  meaning:
    tr: Belirli modülden listele.
    en: List from a module.
  verified: false
  takes_value: true
  value_name: Module
- flag: -CommandType
  meaning:
    tr: Cmdlet/Function/Alias/Application süz.
    en: Filter by CommandType.
  verified: false
  takes_value: true
examples:
- title:
    tr: Cmdlet ara
    en: Find cmdlet
  command: Get-Command Get-Process
  explanation:
    tr: Get-Process cmdlet bilgisini gösterir.
    en: Shows metadata for Get-Process.
  risk: safe
  shell: powershell
  platforms:
  - windows
  privilege: none
- title:
    tr: Joker
    en: Wildcard
  command: Get-Command Get-Net*
  explanation:
    tr: Get-Net* ile başlayan komutları listeler.
    en: Lists commands matching Get-Net*.
  risk: safe
  shell: powershell
  platforms:
  - windows
related:
- get-help
- get-process
intent:
