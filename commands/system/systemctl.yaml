schema_version: 2
id: systemctl
name: systemctl
kind: executable
category: system
summary:
  tr: systemd birimlerini denetler.
  en: Control the systemd system and service manager.
description:
  tr: systemd birimlerini başlatır/durdurur/sorgular. Alpine/Gentoo OpenRC (`rc-service`/`rc-status`)
    ve Void runit (`sv`) ile **eşitlenmez** — yalnızca systemd host’larda birincil araçtır.
  en: Starts/stops/queries systemd units. It is **not** equivalent to Alpine/Gentoo OpenRC (rc-service/rc-status)
    or Void runit (sv) — primary only on systemd hosts.
tags:
- system
- systemd
- service
risk: dangerous
learning_level: intermediate
requires_elevated: true
platforms:
- linux
operating_systems:
- linux
packages:
  arch: systemd
  debian: systemd
  ubuntu: systemd
  fedora: systemd
package_refs:
- manager: pacman
  package: systemd
  distributions:
  - arch
- manager: apt
  package: systemd
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: systemd
  distributions:
  - fedora
- manager: zypper
  package: systemd
  distributions:
  - opensuse-leap
  - opensuse-tumbleweed
  - sles
install_notes:
  tr: 'systemd tabanlı distrolarda (Arch/Debian/Fedora/openSUSE/NixOS) taban gelir.

    Alpine/Gentoo OpenRC ve Void runit varsayılanında birincil araç değildir.'
  en: 'Ships as base on systemd distros (Arch/Debian/Fedora/openSUSE/NixOS).

    Not the primary tool on Alpine/Gentoo OpenRC or Void runit defaults.'
flags:
- flag: status
  meaning:
    tr: Birim durumunu göster.
    en: Show unit status.
  verified: true
- flag: start
  meaning:
    tr: Birimi başlat.
    en: Start unit.
  verified: true
- flag: stop
  meaning:
    tr: Birimi durdur.
    en: Stop unit.
  verified: true
- flag: restart
  meaning:
    tr: Birimi yeniden başlat.
    en: Restart unit.
  verified: true
- flag: is-active
  meaning:
    tr: active mi diye bak.
    en: Check whether active.
  verified: true
- flag: is-enabled
  meaning:
    tr: boot’ta enable mi.
    en: Check whether enabled on boot.
  verified: true
- flag: list-units
  meaning:
    tr: Bellekteki birimleri listele.
    en: List units in memory.
  verified: true
- flag: --user
  meaning:
    tr: Kullanıcı oturumu yöneticisi.
    en: Talk to user service manager.
  verified: true
- flag: --failed
  meaning:
    tr: 'list-units: başarısızlar.'
    en: 'list-units: failed units.'
  verified: true
examples:
- title:
    tr: Durum
    en: Status
  command: systemctl status sshd
  explanation:
    tr: sshd birim durumu (ad dağıtıma göre ssh/sshd).
    en: sshd unit status (name may be ssh/sshd).
  risk: safe
  difficulty: beginner
  privilege: none
  requires_elevated: false
- title:
    tr: Başarısızlar
    en: Failed
  command: systemctl --failed
  explanation:
    tr: Başarısız birimler.
    en: Failed units.
  risk: safe
  difficulty: beginner
  privilege: none
- title:
    tr: Enable mi
    en: Enabled?
  command: systemctl is-enabled sshd
  explanation:
    tr: enabled/disabled/static…
    en: enabled/disabled/static…
  risk: safe
  difficulty: beginner
  privilege: none
- title:
    tr: Yeniden başlat
    en: Restart
  command: sudo systemctl restart nginx
  explanation:
    tr: nginx’i yeniden başlatır (kesinti).
    en: Restarts nginx (brief outage).
  risk: dangerous
  difficulty: intermediate
  requires_elevated: true
  privilege: elevated
related:
- journalctl
- systemd-analyze
- timedatectl
- loginctl
- bootctl
- rc-status
- rc-service
- sv
- service
- rcctl
intent:
  tr:
  - servis başlat
  - systemd durum
  - failed birim
  - servis enable
  en:
  - start service
  - systemd status
  - failed units
  - service enabled
verification:
  status: reviewed
  sources:
  - man 1 systemctl
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
  notes: NV-123 teachable fields (when/syntax/mistakes/topics).
nova:
  concepts:
  - systemd
  - terminal-basics
purpose:
  tr: systemd birim durumu ve yaşam döngüsü — servis güvenliği kontrolünün omurgası.
  en: systemd unit status and lifecycle — backbone of service security checks.
when_to_use:
  tr: systemd birimlerinin durumunu görmek veya (dikkatle) yönetmek.
  en: Inspect or (carefully) manage systemd units.
syntax: systemctl [OPTIONS...] COMMAND [UNIT...]
expected_effect:
  tr: status/is-active okur; start/stop/enable servis durumunu değiştirir.
  en: status/is-active read; start/stop/enable change service state.
common_mistakes:
- tr: Alpine/Void/Gentoo’da systemctl beklemek (OpenRC/runit).
  en: Expecting systemctl on Alpine/Void/Gentoo (OpenRC/runit).
related_topics:
- systemd
- monitoring-and-logs
