schema_version: 2
id: systemctl
name: systemctl
kind: executable
category: system
summary:
  tr: systemd birimlerini denetler.
  en: Control the systemd system and service manager.
description:
  tr: Servis başlatma/durdurma, durum ve boot birimleri için birincil araç.
  en: Primary tool to start/stop services, check status, and manage boot units.
tags:
- system
- systemd
- service
risk: dangerous
requires_elevated: true
platforms:
- linux
operating_systems:
- linux
packages:
  arch: systemd
  debian: systemd
  ubuntu: systemd
  fedora: systemd
package_refs:
- manager: pacman
  package: systemd
  distributions:
  - arch
- manager: apt
  package: systemd
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: systemd
  distributions:
  - fedora
install_notes:
  tr: 'Arch: pacman -S systemd (taban).'
  en: 'Arch: pacman -S systemd (base).'
flags:
- flag: status
  meaning:
    tr: Birim durumunu göster.
    en: Show unit status.
  verified: true
- flag: start
  meaning:
    tr: Birimi başlat.
    en: Start unit.
  verified: true
- flag: stop
  meaning:
    tr: Birimi durdur.
    en: Stop unit.
  verified: true
- flag: restart
  meaning:
    tr: Birimi yeniden başlat.
    en: Restart unit.
  verified: true
- flag: is-active
  meaning:
    tr: active mi diye bak.
    en: Check whether active.
  verified: true
- flag: is-enabled
  meaning:
    tr: boot’ta enable mi.
    en: Check whether enabled on boot.
  verified: true
- flag: list-units
  meaning:
    tr: Bellekteki birimleri listele.
    en: List units in memory.
  verified: true
- flag: --user
  meaning:
    tr: Kullanıcı oturumu yöneticisi.
    en: Talk to user service manager.
  verified: true
- flag: --failed
  meaning:
    tr: 'list-units: başarısızlar.'
    en: 'list-units: failed units.'
  verified: true
examples:
- title:
    tr: Durum
    en: Status
  command: systemctl status sshd
  explanation:
    tr: sshd birim durumu (ad dağıtıma göre ssh/sshd).
    en: sshd unit status (name may be ssh/sshd).
  risk: safe
  privilege: none
  requires_elevated: false
- title:
    tr: Başarısızlar
    en: Failed
  command: systemctl --failed
  explanation:
    tr: Başarısız birimler.
    en: Failed units.
  risk: safe
  privilege: none
- title:
    tr: Enable mi
    en: Enabled?
  command: systemctl is-enabled sshd
  explanation:
    tr: enabled/disabled/static…
    en: enabled/disabled/static…
  risk: safe
  privilege: none
- title:
    tr: Yeniden başlat
    en: Restart
  command: sudo systemctl restart nginx
  explanation:
    tr: nginx’i yeniden başlatır (kesinti).
    en: Restarts nginx (brief outage).
  risk: dangerous
  requires_elevated: true
  privilege: elevated
related:
- journalctl
- systemd-analyze
- timedatectl
- loginctl
- bootctl
intent:
  tr:
  - servis başlat
  - systemd durum
  - failed birim
  - servis enable
  en:
  - start service
  - systemd status
  - failed units
  - service enabled
verification:
  status: reviewed
  sources:
  - man 1 systemctl
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
nova:
  concepts:
  - systemd
  - terminal-basics
purpose:
  tr: systemd birim durumu ve yaşam döngüsü — servis güvenliği kontrolünün omurgası.
  en: systemd unit status and lifecycle — backbone of service security checks.
