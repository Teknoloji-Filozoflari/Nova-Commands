schema_version: 2
id: get-help
name: Get-Help
kind: powershell_cmdlet
category: system
aliases:
- help
- man
summary:
  tr: PowerShell yardım konularını gösterir.
  en: Displays PowerShell help topics.
description:
  tr: Get-Help, cmdlet ve kavramlar için yardım metnini getirir. İlk kullanımda `Update-Help` gerekebilir.
    man/—help ile karıştırılmamalı; PowerShell’e özgüdür. PowerShell 7+ ve Windows PowerShell 5.1’de mevcuttur.
  en: Get-Help shows help for cmdlets and conceptual topics. Update-Help may be needed first. Not the
    same as man/--help — PowerShell-specific. Available in PowerShell 7+ and Windows PowerShell 5.1.
tags:
- powershell
- windows
