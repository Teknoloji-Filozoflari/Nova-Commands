  meaning:
    tr: Tam yardım.
    en: Full help.
  verified: false
- flag: -Examples
  meaning:
    tr: Yalnız örnekler.
    en: Examples only.
  verified: false
- flag: -Online
  meaning:
    tr: Çevrimiçi yardıma git.
    en: Open online help.
  verified: false
