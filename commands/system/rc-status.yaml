schema_version: 2
id: rc-status
name: rc-status
kind: administrative_tool
category: system
summary:
  tr: OpenRC servis durumunu listeler (systemd değil).
  en: List OpenRC service status (not systemd).
description:
  tr: '`rc-status`, Alpine/Gentoo gibi OpenRC kullanan sistemlerde runlevel ve servis durumunu gösterir.
    `systemctl`, Void `sv` / runit ve BSD `service`/`rcctl` ile **eşitlenmez**. Salt okuma sorguları güvenlidir;
    servis başlatma/durdurma `rc-service` yoludur.'
  en: rc-status shows runlevel and service state on OpenRC hosts such as Alpine and Gentoo. It is **not**
    equivalent to systemctl, Void sv/runit, or BSD service/rcctl. Status queries are safe; start/stop
    goes through rc-service.
tags:
- system
- openrc
- services
- alpine
- gentoo
risk: safe
learning_level: intermediate
requires_elevated: false
platforms:
- linux
operating_systems:
- linux
package_refs:
- manager: apk
  package: openrc
  distributions:
  - alpine
- manager: portage
  package: sys-apps/openrc
  distributions:
  - gentoo
install_notes:
  tr: |-
    Alpine/Gentoo OpenRC tabanında gelir. systemd host’larda (Arch/Debian/Fedora varsayılanı) birincil
    araç değildir — orada systemctl kullanın. Void runit için sv kullanın.
  en: |-
    Ships with OpenRC on Alpine/Gentoo. Not the primary tool on systemd hosts (Arch/Debian/Fedora
    defaults) — use systemctl there. On Void runit use sv.
flags:
- flag: -a
  meaning:
    tr: Tüm runlevel’ları göster.
    en: Show all runlevels.
  verified: false
- flag: -l
  meaning:
    tr: Servis listesi / listeli biçim.
    en: List form / service list.
  verified: false
- flag: -c
  meaning:
    tr: Çökük (crashed) servisleri göster.
    en: Show crashed services.
  verified: false
examples:
- title:
    tr: Varsayılan runlevel durumu
    en: Default runlevel status
  command: rc-status
  explanation:
    tr: Geçerli runlevel’daki servisleri ve durumlarını listeler.
    en: Lists services and states for the current runlevel.
  risk: safe
  difficulty: beginner
  requires_elevated: false
- title:
    tr: Tüm runlevel’lar
    en: All runlevels
  command: rc-status -a
  explanation:
    tr: Tüm runlevel servis özetini basar.
    en: Prints a summary across all runlevels.
  risk: safe
  difficulty: beginner
  requires_elevated: false
related:
- rc-service
- systemctl
- sv
- service
- rcctl
intent:
  tr:
  - openrc durum
  - rc-status
  - alpine servis listesi
  en:
  - rc-status
  - openrc status
  - alpine list services
verification:
  status: draft
  sources:
  - https://wiki.alpinelinux.org/wiki/OpenRC
  - https://wiki.gentoo.org/wiki/OpenRC
  - https://manpages.debian.org/testing/openrc/rc-status.8.en.html
  notes: Agent-authored NV-121 draft from OpenRC/Alpine/Gentoo docs; not human-verified.
nova:
  concepts:
  - systemd
