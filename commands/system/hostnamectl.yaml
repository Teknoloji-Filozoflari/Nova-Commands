id: hostnamectl
name: hostnamectl
summary:
  tr: Hostname ve ilgili ayarları yönetir.
  en: Query or change system hostname settings.
description:
  tr: systemd hostnamed üzerinden kalıcı hostname ve chassis bilgisi.
  en: Persistent hostname and chassis info via systemd-hostnamed.
tags:
- system
- systemd
risk: caution
requires_elevated: true
platforms:
- linux
packages:
  arch: systemd
  debian: systemd
  ubuntu: systemd
  fedora: systemd
examples:
- title:
    tr: Bilgi
    en: Show
  command: hostnamectl
  explanation:
    tr: Hostname ve OS özeti.
    en: Hostname and OS summary.
  risk: safe
  requires_elevated: false
- title:
    tr: Ad ayarla
    en: Set name
  command: sudo hostnamectl set-hostname nova-box
  explanation:
    tr: Kalıcı hostname ayarlar.
    en: Sets persistent hostname.
  risk: caution
  requires_elevated: true
related:
- hostname
intent:
  tr:
  - hostname değiştir
  - makine adı ayarla
  en:
  - set hostname
  - change computer name
verification:
  status: reviewed
  sources:
  - man 1 hostnamectl
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
category: system
