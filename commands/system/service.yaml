schema_version: 2
id: service
name: service
kind: administrative_tool
category: system
summary:
  tr: FreeBSD/NetBSD rc.d servis denetimi (systemd değil).
  en: FreeBSD/NetBSD rc.d service control (not systemd).
description:
  tr: '`service`, BSD rc.d betiklerini başlatır/durdurur/sorgular. Linux `systemctl` veya OpenBSD `rcctl`
    ile **eşitlenmez**. `service -e` etkin servisleri listeler; start/stop yükseltme ister ve yıkıcı olabilir.'
  en: service starts/stops/queries BSD rc.d scripts. It is **not** equivalent to Linux systemctl or OpenBSD
    rcctl. service -e lists enabled services; start/stop need elevation and can be disruptive.
tags:
- bsd
- freebsd
- netbsd
- rc
- services
risk: dangerous
requires_elevated: true
platforms:
- bsd
- freebsd
- netbsd
operating_systems:
- freebsd
- netbsd
flags:
- flag: -e
  meaning:
    tr: Etkin servisleri listele.
    en: List enabled services.
  verified: false
- flag: -l
  meaning:
    tr: Tüm rc.d betiklerini listele.
    en: List all rc.d scripts.
  verified: false
- flag: status
  meaning:
    tr: Servis durumu (argüman).
    en: Service status (argument).
  verified: false
examples:
- title:
    tr: Etkin servisler
    en: Enabled services
  command: service -e
  explanation:
    tr: rc.conf ile etkinleştirilmiş servisleri listeler.
    en: Lists services enabled via rc.conf.
  risk: safe
  requires_elevated: false
  platforms:
  - bsd
  - freebsd
- title:
    tr: sshd durumu
    en: sshd status
  command: service sshd status
  explanation:
    tr: sshd rc.d durumunu sorar (systemd status değildir).
    en: Queries sshd rc.d status (not systemd status).
  risk: safe
  requires_elevated: false
  platforms:
  - bsd
  - freebsd
related:
- sysrc
- rcctl
- systemctl
- launchctl
intent:
  tr:
  - freebsd servis
  - service status
  - rc.d
  en:
  - freebsd service
  - service status
  - rc.d
verification:
  status: draft
  sources:
  - https://man.freebsd.org/cgi/man.cgi?query=service&sektion=8
  - https://docs.freebsd.org/en/books/handbook/config/#configtuning-rcng
  notes: Agent-authored Faz 6 draft from official docs; not human-verified.
nova:
  concepts:
  - systemd
