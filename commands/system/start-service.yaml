summary:
  tr: Windows servisini başlatır.
  en: Starts a Windows service.
description:
  tr: Start-Service, Service Control Manager üzerinden servis durumunu/özelliklerini değiştirir. Linux
    systemctl karşılığı değildir. Yönetici (UAC) gerekir. Get-Service ile durumu doğrulayın.
  en: Start-Service changes service state/properties via SCM. Not a systemctl alias. Requires Administrator
