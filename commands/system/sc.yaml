flags: []
examples:
- title:
    tr: Servis sorgula
    en: Query service
  command: sc.exe query wuauserv
  explanation:
    tr: Windows Update servis durumunu sorgular (salt okuma).
    en: Queries Windows Update service status (read-only).
  risk: safe
  requires_elevated: false
  shell: cmd
  platforms:
