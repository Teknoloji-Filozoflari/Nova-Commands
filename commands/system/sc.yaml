schema_version: 2
id: sc
name: sc.exe
kind: administrative_tool
category: system
summary:
  tr: Service Control — Windows servis yönetimi (executable).
  en: Service Control — Windows service management (executable).
description:
  tr: sc.exe, cmd.exe’den servis sorgu/denetimi yapar. PowerShell Get-Service / Start-Service ayrı kayıtlardır.
    PowerShell’de `sc` alias’ı Set-Content’tir — mutlaka `sc.exe` çağırın. Yazma işlemleri yönetici (UAC)
    ister.
  en: sc.exe queries/controls services from cmd.exe. PowerShell Get-Service / Start-Service are separate
    records. In PowerShell, sc aliases Set-Content — always invoke sc.exe. Write ops need Administrator
    (UAC).
