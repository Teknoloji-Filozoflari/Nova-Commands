schema_version: 2
id: dmesg
name: dmesg
kind: executable
category: monitoring
summary:
  tr: Çekirdek mesaj halkasını yazdırır.
  en: Print or control the kernel ring buffer.
description:
  tr: Boot ve sürücü mesajlarını gösterir; bazı sistemlerde izin gerekir.
  en: Shows boot/driver messages; may need privileges on some systems.
