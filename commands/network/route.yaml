schema_version: 2
id: route
name: route
kind: executable
category: network
summary:
  tr: Windows IPv4 yönlendirme tablosu aracı.
  en: Windows IPv4 routing table tool.
description:
  tr: route.exe yönlendirme tablosunu gösterir veya değiştirir. `route print` salt okumadır; add/delete
    yönetici ister. Linux `ip route` ayrı kayıttır.
  en: route.exe displays or modifies the routing table. route print is read-only; add/delete need admin.
    Linux ip route is a separate record.
