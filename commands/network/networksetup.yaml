schema_version: 2
id: networksetup
name: networksetup
kind: administrative_tool
category: network
summary:
  tr: macOS ağ servisleri yapılandırması (System Settings CLI).
  en: macOS network service configuration (System Settings CLI).
description:
  tr: networksetup, ağ konumları, DNS ve proxy ayarlarını yönetir. Linux `ip` veya `ifconfig` ile aynı
    değildir; BSD `ifconfig` macOS’ta da vardır ama farklı model. Yazma işlemleri yönetici ister.
  en: networksetup manages network locations, DNS, and proxies. Not the same as Linux ip or ifconfig;
    BSD ifconfig also exists on macOS under a different model. Writes need admin.
