schema_version: 2
id: get-nettcpconnection
name: Get-NetTCPConnection
kind: powershell_cmdlet
category: network
summary:
  tr: Windows TCP bağlantılarını listeler.
  en: Lists Windows TCP connections.
description:
  tr: NetTCPIP Get-NetTCPConnection, yerel TCP dinleyicileri ve bağlantıları gösterir. Linux `ss`/`netstat`
    veya CMD `netstat` ile aynı komut değildir. Windows’a özgü NetTCPIP modülü gerektirir.
  en: Get-NetTCPConnection shows local TCP listeners and connections. Not the same command as Linux ss/netstat
    or CMD netstat. Requires the Windows NetTCPIP module.
