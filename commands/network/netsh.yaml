summary:
  tr: Windows ağ yığını yapılandırma kabuğu.
  en: Windows networking stack configuration shell.
description:
  tr: netsh, arabirim, güvenlik duvarı, WLAN ve diğer ağ bağlamlarını yönetir. Yazma komutları yönetici
    (UAC) ister. Salt okuma örnekleri tercih edilir; yanlış bağlam sistemi ağdan düşürebilir.
  en: netsh manages interface, firewall, WLAN, and other networking contexts. Write commands need Administrator
    (UAC). Prefer read-only examples; wrong context can drop connectivity.
