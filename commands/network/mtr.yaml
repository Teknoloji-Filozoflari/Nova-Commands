- linux
- macos
flags:
- flag: -r
  meaning:
    tr: Rapor modu (bir kez).
    en: Report mode (one shot).
  verified: false
- flag: -c
  meaning:
    tr: Döngü sayısı.
    en: Cycle count.
  verified: false
- flag: -n
  meaning:
    tr: DNS çözme.
    en: No DNS resolution.
  verified: false
examples:
- title:
    tr: Rapor
    en: Report
  command: mtr -rn -c 5 example.com
  explanation:
    tr: 5 döngülük metin raporu (DNS çözmez).
    en: 5-cycle text report (no DNS).
  risk: safe
