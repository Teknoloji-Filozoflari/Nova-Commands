schema_version: 2
id: mtr
name: mtr
kind: executable
category: network
summary:
  tr: Birleşik traceroute + ping.
  en: Combined traceroute + ping.
description:
  tr: Yol üzerindeki kayıp/gecikmeyi sürekli günceller. traceroute + ping birleşimi.
  en: Continuously updates loss/latency along a path. Combines traceroute and ping.
tags:
- network
- diagnostics
- latency
risk: safe
learning_level: intermediate
requires_elevated: false
platforms:
- linux
- macos
- bsd
