schema_version: 2
id: ip
name: ip
kind: executable
category: network
summary:
  tr: Ağ aygıtları, adresler ve rotaları yönetir.
  en: Show and manipulate routing, devices, and tunnels.
description:
  tr: iproute2 ailesi. Okuma alt komutları (addr/link/route) genellikle root istemez; addr add/del ve
    link set yazma işlemleri tehlikelidir ve dağıtıma özgü kalıcılık (netplan/NetworkManager) ister.
  en: iproute2 family. Read subcommands (addr/link/route) usually need no root; addr add/del and link
    set are dangerous and persistence is distro-specific (netplan/NetworkManager).
tags:
- network
risk: dangerous
learning_level: intermediate
requires_elevated: true
platforms:
- linux
operating_systems:
- linux
packages:
  arch: iproute2
  debian: iproute2
  ubuntu: iproute2
  fedora: iproute
package_refs:
- manager: pacman
  package: iproute2
  distributions:
  - arch
- manager: apt
  package: iproute2
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: iproute
  distributions:
  - fedora
install_notes:
  tr: 'Arch: pacman -S iproute2'
  en: 'Arch: pacman -S iproute2'
flags:
- flag: addr
  meaning:
    tr: Adres nesneleri (alt komut).
    en: Address objects (subcommand).
  verified: false
- flag: link
  meaning:
    tr: Ağ aygıtları (alt komut).
    en: Network devices (subcommand).
  verified: false
- flag: route
  meaning:
    tr: Yönlendirme tablosu (alt komut).
    en: Routing table (subcommand).
  verified: false
- flag: -br
  meaning:
    tr: Kısa özet çıktı.
    en: Brief output.
  verified: false
- flag: '-4'
  meaning:
    tr: Yalnız IPv4.
    en: IPv4 only.
  verified: false
- flag: '-6'
  meaning:
    tr: Yalnız IPv6.
    en: IPv6 only.
  verified: false
examples:
- title:
    tr: Adresler
    en: Addresses
  command: ip -br addr
  explanation:
    tr: Kısa arayüz/adres özeti.
    en: Brief interface/address summary.
  risk: safe
  privilege: none
  requires_elevated: false
  difficulty: beginner
- title:
    tr: Rota
    en: Route
  command: ip route
  explanation:
    tr: Yönlendirme tablosu.
    en: Routing table.
  risk: safe
  privilege: none
  requires_elevated: false
- title:
    tr: Link
    en: Link
  command: ip link
  explanation:
    tr: Ağ arayüzleri.
    en: Network interfaces.
  risk: safe
  privilege: none
  requires_elevated: false
related:
- ss
- ping
- nmcli
- ifconfig
intent:
  tr:
  - ip adresi gör
  - ağ arayüzü
  - rota tablosu
  - iproute2
  en:
  - show ip address
  - list interfaces
  - routing table
  - iproute2
verification:
  status: reviewed
  sources:
  - man 8 ip
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
  notes: Flags marked unverified 2026-11-10; sourced from man 8 ip knowledge. NV-123 teachable fields
    (when/syntax/mistakes/topics).
nova:
  concepts:
  - networking
  - networking-basics
purpose:
  tr: 'Linux ağ yığınına bakış: adres, link, rota (iproute2).'
  en: 'Inspect the Linux network stack: address, link, route (iproute2).'
when_to_use:
  tr: Linux’ta arayüz, adres ve rota bilgisini okumak/yönetmek (öğrenmede önce okuma).
  en: On Linux, read/manage interface, address, and route info (prefer reading while learning).
syntax: ip [OPTIONS] OBJECT {COMMAND | help}
expected_effect:
  tr: ip addr/link/route altkomutları durum basar; değiştiren komutlar ağ bağlantısını bozabilir.
  en: ip addr/link/route subcommands print state; mutating commands can break connectivity.
common_mistakes:
- tr: macOS/BSD’de ip bekleyip ifconfig yerine geçmesini sanmak.
  en: Expecting ip on macOS/BSD as a drop-in for ifconfig.
related_topics:
- networking-basics
