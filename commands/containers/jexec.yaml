schema_version: 2
id: jexec
name: jexec
kind: administrative_tool
category: containers
summary:
  tr: FreeBSD jail içinde komut çalıştırır.
  en: Execute a command inside a FreeBSD jail.
description:
  tr: '`jexec`, seçili jail içinde komut/kabuk çalıştırır. `docker exec` değildir. Yanlış jail kimliği
    zararlı olabilir; önce `jls` ile kimlik doğrulayın. Örnekler salt yardım/kimlik odaklıdır.'
  en: jexec runs a command/shell inside a selected jail. Not docker exec. A wrong jail id can be harmful;
    confirm with jls first. Examples stay help/identity oriented.
