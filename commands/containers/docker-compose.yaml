schema_version: 2
id: docker-compose
name: docker-compose
kind: executable
category: containers
summary:
  tr: Çok konteynerli Compose aracı.
  en: Multi-container Compose tool.
description:
  tr: compose.yaml ile servis yığınını yönetir. Eski bağımsız ikili veya `docker compose` eklentisi olabilir
    — dağıtıma göre değişir.
  en: Manages service stacks from compose.yaml. May be standalone binary or `docker compose` plugin —
    varies by distro.
tags:
- containers
- docker
risk: dangerous
learning_level: intermediate
requires_elevated: false
platforms:
- linux
operating_systems:
- linux
packages:
  arch: docker-compose
package_refs:
- manager: pacman
  package: docker-compose
  distributions:
  - arch
install_notes:
  tr: |-
    Arch: pacman -S docker-compose (bilinen distro paketi).
    Debian/Ubuntu/Fedora: paket adı dağıtıma göre değişir (docker-compose-plugin / v1) — uydurma yok;
    kurulu adı doğrulayın. Modern kullanım: `docker compose` (boşluklu eklenti).
    Linux filtresiz host’ta Arch’ı sessiz varsaymayın.
  en: |-
    Arch: pacman -S docker-compose (known distro package).
    Debian/Ubuntu/Fedora: package name varies (docker-compose-plugin / v1) — do not invent;
    verify the installed name. Modern usage: `docker compose` (space) plugin.
    Do not silently default to Arch when Linux is undifferenced.
flags:
- flag: up
  meaning:
    tr: Servisleri başlat (alt komut).
    en: Create/start services.
  verified: false
- flag: down
  meaning:
    tr: Servisleri durdur/kaldır.
    en: Stop/remove services.
  verified: false
- flag: ps
  meaning:
    tr: Durum.
    en: List containers.
  verified: false
examples:
- title:
    tr: Ayağa kaldır
    en: Bring up
  command: docker compose up -d
  explanation:
    tr: Eklenti sözdizimi; dizininde compose.yaml olmalı.
    en: Plugin syntax; needs compose.yaml in cwd.
  risk: dangerous
  difficulty: intermediate
- title:
    tr: Durum
    en: Status
  command: docker compose ps
  explanation:
    tr: Proje konteynerleri.
    en: Project containers.
  risk: safe
  difficulty: beginner
- title:
    tr: Yık
    en: Tear down
  command: docker compose down
  explanation:
    tr: Kapsayıcıları durdurur; volume politikasına dikkat.
    en: Stops containers; mind volume policy.
  risk: dangerous
  difficulty: intermediate
related:
- docker
- podman
intent:
  tr:
  - docker compose
  - çoklu konteyner
  en:
  - docker compose
  - multi container
verification:
  status: draft
  sources:
  - https://docs.docker.com/compose/
  - https://archlinux.org/packages/extra/x86_64/docker-compose/
  notes: debian/ubuntu/fedora package names intentionally incomplete; plugin vs v1 differs.
nova:
  concepts:
  - containers
