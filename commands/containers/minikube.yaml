schema_version: 2
id: minikube
name: minikube
kind: executable
category: containers
summary:
  tr: minikube — yerel Kubernetes.
  en: minikube — local Kubernetes.
description:
  tr: >-
    Tek düğümlü yerel K8s. Driver (docker/kvm2/…) gerekir.
  en: >-
    Single-node local K8s. Driver (docker/kvm2/…) required.
purpose:
  tr: Yerel Kubernetes öğrenme/geliştirme.
  en: Local Kubernetes learning/development.
when_to_use:
  tr: Laptop’ta K8s denemek için.
  en: To try K8s on a laptop.
expected_effect:
  tr: Yerel küme başlatır/durdurur.
  en: Starts/stops a local cluster.
syntax: "minikube <command>"
tags:
- software
- server
- containers
- kubernetes
risk: caution
learning_level: advanced
requires_elevated: false
platforms:
- linux
- macos
- windows
packages:
  arch: minikube
package_refs:
- manager: pacman
  package: minikube
  distributions:
  - arch
- manager: homebrew
  package: minikube
- manager: winget
  package: Kubernetes.minikube
install_notes:
  tr: |-
    Arch: pacman -S minikube
    macOS: brew install minikube
    kubectl ayrıca gerekebilir.
  en: |-
    Arch: pacman -S minikube
    macOS: brew install minikube
    kubectl may also be required.
flags: []
examples:
