schema_version: 2
id: docker
name: docker
kind: executable
category: containers
summary:
  tr: Docker konteyner CLI.
  en: Docker container CLI.
description:
  tr: Docker Engine CLI. docker grubundaki kullanıcı root’a yakın güçtedir. Paket adları dağıtıma göre
    değişir; Arch’ta pacman -S docker.
  en: Docker Engine CLI. Membership in the docker group is near-root power. Package names vary by distro;
    on Arch use pacman -S docker.
tags:
- containers
risk: dangerous
learning_level: intermediate
requires_elevated: false
platforms:
- linux
- macos
- windows
operating_systems:
- linux
packages:
  arch: docker
  fedora: docker-ce
package_refs:
- manager: pacman
  package: docker
  distributions:
  - arch
- manager: dnf
  package: docker-ce
  distributions:
  - fedora
install_notes:
  tr: |-
    Arch: pacman -S docker — sonra systemctl enable --now docker; kullanıcıyı docker grubuna ekleyin.
    Debian/Ubuntu paket adları dağıtıma göre değişir (unknown — dokümantasyona bakın).
    Fedora sıkça docker-ce (docker.com repo).
  en: |-
    Arch: pacman -S docker — then systemctl enable --now docker; add user to docker group.
    Debian/Ubuntu package names vary (unknown — see distro docs).
    Fedora often docker-ce from docker.com.
examples:
- title:
    tr: ps
    en: ps
  command: docker ps
  explanation:
    tr: Çalışan konteynerler.
    en: Running containers.
  risk: safe
  difficulty: beginner
- title:
    tr: Tüm konteynerler
    en: All containers
  command: docker ps -a
  explanation:
    tr: Durmuş olanlar dahil listeler.
    en: Lists containers including stopped.
  risk: safe
  difficulty: beginner
- title:
    tr: İmajlar
    en: Images
  command: docker images
  explanation:
    tr: Yerel imaj listesi.
    en: Local image list.
  risk: safe
  difficulty: beginner
- title:
    tr: Loglar
    en: Logs
  command: docker logs -f mycontainer
  explanation:
    tr: Konteyner günlüklerini takip eder.
    en: Follows container logs.
  risk: safe
  difficulty: beginner
- title:
    tr: Çalıştır
    en: Run
  command: docker run --rm -it alpine:latest sh
  explanation:
    tr: Geçici Alpine kabuğu; --rm çıkınca siler. İmaj çeker (ağ).
    en: Ephemeral Alpine shell; --rm removes on exit. May pull (network).
  risk: caution
  difficulty: intermediate
- title:
    tr: Durdur
    en: Stop
  command: docker stop mycontainer
  explanation:
    tr: Çalışan konteyneri durdurur.
    en: Stops a running container.
  risk: caution
  difficulty: intermediate
related:
- docker-compose
- podman
- nerdctl
- systemctl
- journalctl
intent:
  tr:
  - docker ps
  - konteyner listele
  - docker imaj
  - konteyner log
  en:
  - docker ps
  - list containers
  - docker images
  - container logs
verification:
  status: draft
  sources:
  - https://docs.docker.com/engine/reference/commandline/cli/
  notes: debian/ubuntu package intentionally omitted as unknown.
nova:
  concepts:
  - containers
purpose:
  tr: Konteyner/imaj gözlemi ve yönetimi; güvenlik kontrolünde ps/images/inspect salt okunur.
  en: Container/image observation and management; security checks prefer read-only ps/images/inspect.
flags:
- flag: ps
  meaning:
    tr: Konteyner listele (alt komut).
    en: List containers (subcommand).
  verified: false
- flag: images
  meaning:
    tr: İmaj listele (alt komut).
    en: List images (subcommand).
  verified: false
- flag: inspect
  meaning:
    tr: Nesne JSON ayrıntısı (alt komut).
    en: Object JSON details (subcommand).
  verified: false
- flag: logs
  meaning:
    tr: Konteyner günlükleri (alt komut).
    en: Container logs (subcommand).
  verified: false
- flag: -a
  meaning:
    tr: 'ps: durmuşlar dahil.'
    en: 'ps: include stopped.'
  verified: false
security:
  notes:
    tr: Privileged/host-network konteynerler host’u zayıflatır; publish edilen portları gözden geçirin.
    en: Privileged/host-network containers weaken the host; review published ports.
