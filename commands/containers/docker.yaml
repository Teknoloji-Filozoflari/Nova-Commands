id: docker
name: docker
summary:
  tr: Docker konteyner CLI.
  en: Docker container CLI.
description:
  tr: Docker Engine ile konteyner ve imaj yönetimi. Paket adı dağıtıma göre değişir.
  en: Manage containers/images with Docker Engine. Package names vary by distro.
tags:
- containers
risk: dangerous
requires_elevated: false
platforms:
- linux
packages:
  arch: docker
  fedora: docker-ce
install_notes:
  tr: 'Arch: pacman -S docker — sonra systemctl enable --now docker; kullanıcıyı docker
    grubuna ekleyin.

    Debian/Ubuntu paket adları dağıtıma göre değişir (unknown — dokümantasyona bakın).

    Fedora sıkça docker-ce (docker.com repo).'
  en: 'Arch: pacman -S docker — then systemctl enable --now docker; add user to docker
    group.

    Debian/Ubuntu package names vary (unknown — see distro docs).

    Fedora often docker-ce from docker.com.'
examples:
- title:
    tr: ps
    en: ps
  command: docker ps
  explanation:
    tr: Çalışan konteynerler.
    en: Running containers.
  risk: safe
- title:
    tr: Tüm konteynerler
    en: All containers
  command: docker ps -a
  explanation:
    tr: Durmuş olanlar dahil listeler.
    en: Lists containers including stopped.
  risk: safe
- title:
    tr: İmajlar
    en: Images
  command: docker images
  explanation:
    tr: Yerel imaj listesi.
    en: Local image list.
  risk: safe
- title:
    tr: Loglar
    en: Logs
  command: docker logs -f mycontainer
  explanation:
    tr: Konteyner günlüklerini takip eder.
    en: Follows container logs.
  risk: safe
- title:
    tr: Çalıştır
    en: Run
  command: docker run --rm -it alpine:latest sh
  explanation:
    tr: Geçici Alpine kabuğu; --rm çıkınca siler. İmaj çeker (ağ).
    en: Ephemeral Alpine shell; --rm removes on exit. May pull (network).
  risk: caution
- title:
    tr: Durdur
    en: Stop
  command: docker stop mycontainer
  explanation:
    tr: Çalışan konteyneri durdurur.
    en: Stops a running container.
  risk: caution
related:
- podman
- docker-compose
intent:
  tr:
  - docker konteyner
  - docker ps
  - docker imaj
  en:
  - docker containers
  - docker ps
  - docker images
verification:
  status: draft
  sources:
  - https://docs.docker.com/engine/reference/commandline/cli/
  notes: debian/ubuntu package intentionally omitted as unknown.
nova:
  concepts:
  - containers
category: containers
