schema_version: 2
id: docker
name: docker
kind: executable
category: containers
summary:
  tr: Docker konteyner CLI.
  en: Docker container CLI.
description:
  tr: Docker Engine CLI. docker grubundaki kullanıcı root’a yakın güçtedir. Paket adları dağıtıma göre
    değişir; Arch’ta pacman -S docker.
  en: Docker Engine CLI. Membership in the docker group is near-root power. Package names vary by distro;
    on Arch use pacman -S docker.
tags:
- containers
risk: dangerous
learning_level: intermediate
requires_elevated: false
platforms:
- linux
- macos
- windows
operating_systems:
- linux
- macos
- windows
packages:
  arch: docker
  debian: docker.io
  ubuntu: docker.io
  fedora: docker-ce
package_refs:
- manager: pacman
  package: docker
  distributions:
  - arch
- manager: apt
  package: docker.io
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: docker-ce
  distributions:
  - fedora
- manager: zypper
  package: docker
  distributions:
  - opensuse-leap
  - opensuse-tumbleweed
- manager: apk
  package: docker
  distributions:
  - alpine
install_notes:
  tr: 'Arch: pacman -S docker — sonra systemctl enable --now docker; kullanıcıyı docker grubuna ekleyin.

    Debian/Ubuntu distro paketi sıkça docker.io; Docker Inc. reposu docker-ce kullanır — karıştırmayın.

    Fedora sıkça docker-ce (docker.com repo) veya moby-engine — kurulu paketi doğrulayın.

    openSUSE: zypper in docker. Alpine: apk add docker (OpenRC servis yolu ayrıdır).

    Sessiz Arch varsayımı yok: Linux filtresiz host’ta önce distro PM’sini seçin.'
  en: 'Arch: pacman -S docker — then systemctl enable --now docker; add user to docker group.

    Debian/Ubuntu distro package is often docker.io; Docker Inc. repos use docker-ce — do not confuse.

    Fedora often docker-ce (docker.com) or moby-engine — verify the installed package.

    openSUSE: zypper in docker. Alpine: apk add docker (OpenRC service path differs).

    No silent Arch default: pick the host distro PM when Linux is undifferenced.'
examples:
- title:
    tr: ps
    en: ps
  command: docker ps
  explanation:
    tr: Çalışan konteynerler.
    en: Running containers.
  risk: safe
  difficulty: beginner
- title:
    tr: Tüm konteynerler
    en: All containers
  command: docker ps -a
  explanation:
    tr: Durmuş olanlar dahil listeler.
    en: Lists containers including stopped.
  risk: safe
  difficulty: beginner
- title:
    tr: İmajlar
    en: Images
  command: docker images
  explanation:
    tr: Yerel imaj listesi.
    en: Local image list.
  risk: safe
  difficulty: beginner
- title:
    tr: Loglar
    en: Logs
  command: docker logs -f mycontainer
  explanation:
    tr: Konteyner günlüklerini takip eder.
    en: Follows container logs.
  risk: safe
  difficulty: beginner
- title:
    tr: Çalıştır
    en: Run
  command: docker run --rm -it alpine:latest sh
  explanation:
    tr: Geçici Alpine kabuğu; --rm çıkınca siler. İmaj çeker (ağ).
    en: Ephemeral Alpine shell; --rm removes on exit. May pull (network).
  risk: caution
  difficulty: intermediate
- title:
    tr: Durdur
    en: Stop
  command: docker stop mycontainer
  explanation:
    tr: Çalışan konteyneri durdurur.
    en: Stops a running container.
  risk: caution
  difficulty: intermediate
related:
- docker-compose
- podman
- nerdctl
- systemctl
- journalctl
intent:
  tr:
  - docker ps
  - konteyner listele
  - docker imaj
  - konteyner log
  en:
  - docker ps
  - list containers
  - docker images
  - container logs
verification:
  status: draft
  sources:
  - https://docs.docker.com/engine/reference/commandline/cli/
  notes: debian/ubuntu package intentionally omitted as unknown. NV-123 teachable fields (when/syntax/mistakes/topics).
nova:
  concepts:
  - containers
purpose:
  tr: Konteyner/imaj gözlemi ve yönetimi; güvenlik kontrolünde ps/images/inspect salt okunur.
  en: Container/image observation and management; security checks prefer read-only ps/images/inspect.
flags:
- flag: ps
  meaning:
    tr: Konteyner listele (alt komut).
    en: List containers (subcommand).
  verified: false
- flag: images
  meaning:
    tr: İmaj listele (alt komut).
    en: List images (subcommand).
  verified: false
- flag: inspect
  meaning:
    tr: Nesne JSON ayrıntısı (alt komut).
    en: Object JSON details (subcommand).
  verified: false
- flag: logs
  meaning:
    tr: Konteyner günlükleri (alt komut).
    en: Container logs (subcommand).
  verified: false
- flag: -a
  meaning:
    tr: 'ps: durmuşlar dahil.'
    en: 'ps: include stopped.'
  verified: false
security:
  notes:
    tr: Privileged/host-network konteynerler host’u zayıflatır; publish edilen portları gözden geçirin.
    en: Privileged/host-network containers weaken the host; review published ports.
when_to_use:
  tr: Docker runtime ile konteyner listeleme/log/inceleme (ve yönetim).
  en: List/log/inspect (and manage) containers with the Docker runtime.
syntax: docker [OPTIONS] COMMAND
expected_effect:
  tr: ps/logs/inspect okur; run/rm konteyner yaşam döngüsünü değiştirir.
  en: ps/logs/inspect read; run/rm change container lifecycle.
common_mistakes:
- tr: podman ile bayrakların birebir aynı olduğunu sanmak.
  en: Assuming flags are identical to podman.
related_topics:
- containers-basics
