schema_version: 2
id: nerdctl
name: nerdctl
kind: executable
category: containers
summary:
  tr: containerd için Docker uyumlu CLI.
  en: Docker-compatible CLI for containerd.
description:
  tr: nerdctl, containerd üzerinde Docker-benzeri komutlar sunar. Docker Engine ile aynı daemon değildir;
    Kubernetes node’larında sık görülür.
  en: nerdctl provides Docker-like commands on containerd. Not the same daemon as Docker Engine; common
    on Kubernetes nodes.
tags:
- containers
- containerd
- devops
risk: dangerous
requires_elevated: false
platforms:
- linux
