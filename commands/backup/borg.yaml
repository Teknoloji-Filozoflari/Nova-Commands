- flag: list
  meaning:
    tr: Arşiv/repo listele (alt komut).
    en: List archives/repo (subcommand).
  verified: false
- flag: info
  meaning:
    tr: Repo/arşiv bilgisi (alt komut).
    en: Repo/archive info (subcommand).
  verified: false
- flag: check
  meaning:
    tr: Bütünlük kontrolü (alt komut).
    en: Integrity check (subcommand).
  verified: false
- flag: create
  meaning:
    tr: Yedek oluştur (alt komut).
    en: Create archive (subcommand).
  verified: false
