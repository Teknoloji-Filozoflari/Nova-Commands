schema_version: 2
id: borg
name: borg
kind: executable
category: backup
summary:
  tr: BorgBackup dedupe yedekleme.
  en: BorgBackup deduplicating backups.
description:
  tr: Borg, sıkıştırılmış/dedupe arşivler oluşturur. `borg create` veri yazar; örnekler info/list odaklı.
  en: Borg creates compressed/deduplicated archives. `borg create` writes data; examples focus on info/list.
