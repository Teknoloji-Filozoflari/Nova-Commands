schema_version: 2
id: rclone
name: rclone
kind: executable
category: backup
summary:
  tr: Bulut depolama senkron aracı.
  en: Cloud storage sync tool.
description:
  tr: S3/Drive/SFTP vb. uzak depolara kopyalar/senkronlar. Kimlik bilgileri rclone.conf’tadır — örneklerde
    gerçek key yok.
  en: Copies/syncs to remote storage (S3/Drive/SFTP/…). Credentials live in rclone.conf — no real keys
    in examples.
