  risk: safe
- title:
    tr: Uzak listesi
    en: List remotes
  command: rclone listremotes
  explanation:
    tr: Yapılandırılmış uzak adları (içerik/secret göstermez).
    en: Configured remote names (does not show secrets).
  risk: safe
