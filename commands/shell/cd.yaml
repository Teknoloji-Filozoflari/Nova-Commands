schema_version: 2
id: cd
name: cd
kind: shell_builtin
category: shell
summary:
  tr: Çalışma dizinini değiştirir (kabuk yerleşiği).
  en: Change the shell working directory (builtin).
description:
  tr: Harici ikili değil; bash/zsh yerleşiği. PATH keşfinde görünmeyebilir.
  en: Not an external binary; a shell builtin. May be absent from PATH discovery.
tags:
- shell
risk: safe
learning_level: beginner
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
shells:
- bash
- zsh
- sh
- fish
examples:
- title:
    tr: Eve dön
    en: Go home
  command: cd
  explanation:
    tr: Ev dizinine gider.
    en: Changes to home.
  risk: safe
  difficulty: beginner
- title:
    tr: Üst dizin
    en: Parent
  command: cd ..
  explanation:
    tr: Bir üst dizine çıkar.
    en: Goes up one level.
  risk: safe
related:
- pwd
intent:
  tr:
  - dizine gir
  - klasör değiştir
  en:
  - change directory
  - go to folder
verification:
  status: reviewed
  sources:
  - bash help cd
  - man bash
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
  notes: Builtin — local discovery may not see a path. NV-123 teachable fields (when/syntax/mistakes/topics).
nova:
  concepts:
  - shell-builtin
  - terminal-basics
  - path
when_to_use:
  tr: Çalışma dizinini değiştirmek (kabuk yerleşiği).
  en: Change the working directory (shell builtin).
syntax: cd [DIR]
expected_effect:
  tr: Kabuğun çalışma dizinini değiştirir; başarısızlıkta konum aynı kalır.
  en: Changes the shell working directory; on failure the location stays the same.
common_mistakes:
- tr: Boşluklu yolları tırnaksız vermek.
  en: Passing paths with spaces without quotes.
- tr: cd’yi alt kabukta çalıştırıp üst kabuğun değişmesini beklemek.
  en: Running cd in a subshell and expecting the parent shell to move.
related_topics:
- terminal-basics
- path
