- manager: dnf
  package: coreutils
  distributions:
  - fedora
flags:
- flag: -n
  meaning:
    tr: Sondaki yeni satırı yazma.
    en: Do not output trailing newline.
  verified: true
examples:
- title:
    tr: Yazdır
    en: Print
  command: echo "hello"
  explanation:
    tr: hello yazar.
    en: Prints hello.
  risk: safe
  difficulty: beginner
intent:
  tr:
  - ekrana yaz
  - echo
  en:
  - print text
  - echo string
verification:
  status: verified
  sources:
  - man 1 echo (GNU coreutils)
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-phase15
