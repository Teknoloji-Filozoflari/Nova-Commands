related:
- printf
intent:
  tr:
  - ekrana yaz
  - echo
  en:
  - print text
  - echo string
verification:
  status: verified
  sources:
  - man 1 echo (GNU coreutils)
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-phase15
  notes: Flag -n confirmed for /bin/echo; note shell builtin may differ slightly.
category: shell
nova:
