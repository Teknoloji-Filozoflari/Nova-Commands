id: echo
name: echo
summary:
  tr: Argümanları yazar.
  en: Display a line of text.
description:
  tr: Metni standart çıktıya basar; kabuk yerleşiği veya /bin/echo olabilir.
  en: Prints text to stdout; may be builtin or /bin/echo.
tags:
- shell
risk: safe
requires_elevated: false
platforms:
- linux
- macos
- bsd
packages:
