    (when/syntax/mistakes/topics).
nova:
  concepts:
  - shell-builtin
  - terminal-basics
  - path
  favorite_eligible: true
when_to_use:
  tr: Metin veya değişken değerlerini yazdırmak; boru/test için.
  en: Print text or variable values; useful in pipes/tests.
syntax: echo [SHORT-OPTION]... [STRING]...
expected_effect:
  tr: Argümanları stdout’a basar; dosya yazmaz (yönlendirme sizden).
  en: Prints arguments to stdout; does not write files (redirection is yours).
common_mistakes:
- tr: echo ile printf kaçış davranışını aynı sanmak.
  en: Assuming echo escape behavior matches printf.
related_topics:
