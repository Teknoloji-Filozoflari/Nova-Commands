schema_version: 2
id: zsh
name: zsh
kind: executable
category: shell
summary:
  tr: Z shell — güçlü etkileşimli kabuk.
  en: Z shell — powerful interactive shell.
description:
  tr: macOS’ta varsayılan etkileşimli kabuk (Catalina+). Linux’ta pacman/apt/dnf ile kurulur. Bash ile
    sözdizimi benzer ama tamamlanma/ayarlar farklıdır; betikleri karıştırmayın.
  en: Default interactive shell on macOS (Catalina+). Installable on Linux via pacman/apt/dnf. Bash-like
    syntax but completion/config differ — do not mix scripts blindly.
purpose:
  tr: Etkileşimli günlük kullanım ve zsh betikleri; macOS admin işleri için birincil kabuk.
  en: Daily interactive use and zsh scripts; primary shell for many macOS admin tasks.
