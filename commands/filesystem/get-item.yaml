summary:
  tr: Belirtilen yolu (dosya/klasör) nesne olarak alır.
  en: Gets the item at a path as an object.
description:
  tr: Get-Item tek bir öğeyi (dosya, dizin, kayıt defteri anahtarı vb. sağlayıcı yolu) döndürür. Get-ChildItem
    alt öğeleri listeler; karıştırmayın.
  en: Get-Item returns a single item (file, directory, registry key, etc.). Get-ChildItem lists children
    — do not confuse them.
