schema_version: 2
id: file
name: file
kind: executable
category: filesystem
summary:
  tr: Dosya türünü magic ile belirler.
  en: Determine file type via magic.
description:
  tr: İçeriğe bakarak tür/MIME tahmin eder; uzantıya güvenmez. Güvenlik incelemesinde yanlış uzantılı
    dosyaları ayırt eder.
  en: Guesses type/MIME from content, not extension. Helps spot mislabeled files during review.
tags:
- files
- forensics
- mime
risk: safe
learning_level: beginner
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
