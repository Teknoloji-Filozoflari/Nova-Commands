schema_version: 2
id: ls
name: ls
kind: executable
category: filesystem
summary:
  tr: Dizin içeriğini listeler.
  en: List directory contents.
description:
  tr: Belirtilen dizinlerdeki dosya ve alt dizinleri listeler. GNU coreutils sürümünde uzun biçim, insan
    okunur boyut ve renk gibi yaygın bayraklar vardır.
  en: Lists files and directories. The GNU coreutils version supports long format, human-readable sizes,
    and color.
tags:
- files
- directory
- list
risk: safe
learning_level: beginner
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
shells:
- any
packages:
  arch: coreutils
  debian: coreutils
  ubuntu: coreutils
  fedora: coreutils
  rhel: coreutils
package_refs:
- manager: pacman
  package: coreutils
  distributions:
  - arch
- manager: apt
  package: coreutils
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: coreutils
  distributions:
  - fedora
  - rhel
install_notes:
  tr: 'Arch: pacman -S coreutils (genelde taban sistemde vardır).

    Debian/Ubuntu: apt install coreutils

    Fedora: dnf install coreutils'
  en: 'Arch: pacman -S coreutils (usually in base).

    Debian/Ubuntu: apt install coreutils

    Fedora: dnf install coreutils'
flags:
- flag: -a
  long: --all
  meaning:
    tr: Gizli dosyalar dahil hepsini göster.
    en: Show all entries including hidden.
  verified: true
  platforms:
  - gnu
- flag: -l
  meaning:
    tr: Uzun (ayrıntılı) liste biçimi.
    en: Long listing format.
  verified: true
  platforms:
  - gnu
- flag: -h
  long: --human-readable
  meaning:
    tr: Boyutları K/M/G ile göster (-l ile).
    en: Human-readable sizes with -l.
  verified: true
  platforms:
  - gnu
- flag: -R
  long: --recursive
  meaning:
    tr: Alt dizinlere inerek listele.
    en: List subdirectories recursively.
  verified: true
  platforms:
  - gnu
examples:
- title:
    tr: Ayrıntılı liste
    en: Detailed list
  command: ls -lah
  explanation:
    tr: Gizli dosyalar, insan okunur boyutlar, uzun biçim.
    en: Hidden files, human sizes, long format.
  risk: safe
  difficulty: beginner
- title:
    tr: Tek dizin
    en: One directory
  command: ls /var/log
  explanation:
    tr: Belirtilen yolun içeriğini listeler.
    en: Lists the given path.
  risk: safe
related:
- tree
- find
- stat
see_also:
- man 1 ls
- info coreutils ls
intent:
  tr:
  - dosya listele
  - klasör içeriği
  - dizin listele
  en:
  - list files
  - list directory
  - show folder contents
verification:
  status: verified
  sources:
  - man 1 ls (GNU coreutils)
  - https://www.gnu.org/software/coreutils/manual/html_node/ls-invocation.html
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-phase15
  notes: Flags -a/-l/-h/-R and examples checked against GNU coreutils man/--help. Safe read-only listing.
    NV-123 teachable fields (when/syntax/mistakes/topics).
nova:
  favorite_eligible: true
  ui_priority: 90
  concepts:
  - files
  - terminal-basics
  - linux-directory-structure
  - permissions
when_to_use:
  tr: Bir dizinde ne olduğunu hızlıca görmek; gizli dosyalar veya ayrıntılı izinler için bayrak ekleyin.
  en: Quickly see what is in a directory; add flags for hidden files or detailed permissions.
syntax: ls [OPTION]... [FILE]...
expected_effect:
  tr: Belirtilen yolların adlarını (ve -l ile meta veriyi) stdout’a yazar; dosya sistemini değiştirmez.
  en: Writes names (and metadata with -l) for the given paths to stdout; does not change the filesystem.
common_mistakes:
- tr: ls yolunu yanlış yazıp “böyle bir dosya yok” sanmak — önce pwd.
  en: Mistyping the path and assuming the file is missing — check pwd first.
- tr: GNU -h/--color ile BSD ls bayraklarını karıştırmak.
  en: Mixing GNU -h/--color assumptions with BSD ls flags.
related_topics:
- terminal-basics
- finding-files
- permissions
- linux-directory-structure
