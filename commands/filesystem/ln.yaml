schema_version: 2
id: ln
name: ln
kind: executable
category: filesystem
summary:
  tr: Sabit veya sembolik bağ oluşturur.
  en: Make hard or symbolic links.
description:
  tr: Varsayılanı sabit bağdır; sembolik bağ için -s kullanılır.
  en: Default is a hard link; use -s for a symbolic link.
tags:
- files
- symlink
risk: caution
learning_level: intermediate
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: coreutils
  debian: coreutils
  ubuntu: coreutils
  fedora: coreutils
package_refs:
- manager: pacman
  package: coreutils
  distributions:
  - arch
- manager: apt
  package: coreutils
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: coreutils
  distributions:
  - fedora
flags:
- flag: -s
  long: --symbolic
  meaning:
    tr: Sembolik bağ yap.
    en: Make symbolic links instead of hard links.
  verified: true
  platforms:
  - gnu
- flag: -f
  long: --force
  meaning:
    tr: Var olan hedefi kaldırarak zorla.
    en: Remove existing destination files.
  verified: true
  platforms:
  - gnu
- flag: -v
  long: --verbose
  meaning:
    tr: Bağları yazdır.
    en: Print name of each linked file.
  verified: true
  platforms:
  - gnu
examples:
- title:
    tr: Sembolik bağ
    en: Symbolic link
  command: ln -s /usr/bin/python3 ~/bin/python
  explanation:
    tr: python adında bir symlink oluşturur.
    en: Creates a symlink named python.
  risk: caution
related:
- cp
intent:
  tr:
  - sembolik bağ
  - symlink oluştur
  en:
  - create symlink
  - make symbolic link
verification:
  status: reviewed
  sources:
  - man 1 ln
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
nova:
  concepts:
  - files
  - terminal-basics
