schema_version: 2
id: openssl
name: openssl
kind: executable
category: security
summary:
  tr: TLS/SSL ve kriptografi araç kutusu.
  en: TLS/SSL and cryptography toolkit.
description:
  tr: Sertifika inceleme, özet (hash), anahtar üretimi ve TLS istemci denemeleri. Yanlış enc kullanımı
    veriyi kilitleyebilir.
  en: Certificate inspection, digests, key generation, and TLS client tests. Misused enc can lock you
    out of data.
tags:
- tls
- crypto
- certificates
risk: caution
learning_level: intermediate
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: openssl
  debian: openssl
  ubuntu: openssl
  fedora: openssl
package_refs:
- manager: pacman
  package: openssl
  distributions:
  - arch
- manager: apt
  package: openssl
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: openssl
  distributions:
  - fedora
install_notes:
  tr: |-
    Arch: pacman -S openssl
    Debian/Ubuntu: apt install openssl
    Fedora: dnf install openssl
  en: |-
    Arch: pacman -S openssl
    Debian/Ubuntu: apt install openssl
    Fedora: dnf install openssl
flags:
- flag: version
  meaning:
    tr: OpenSSL sürümü (alt komut).
    en: OpenSSL version (subcommand).
  verified: true
- flag: x509
  meaning:
    tr: Sertifika işlemleri (alt komut).
    en: Certificate operations (subcommand).
  verified: true
- flag: dgst
  meaning:
    tr: Özet / HMAC (alt komut).
    en: Digest / HMAC (subcommand).
  verified: true
- flag: s_client
  meaning:
    tr: TLS istemci testi (alt komut).
    en: TLS client test (subcommand).
  verified: true
- flag: -noout
  meaning:
    tr: 'x509: sertifika gövdesini yazma.'
    en: 'x509: do not output the certificate encoding.'
  verified: true
- flag: -dates
  meaning:
    tr: 'x509: notBefore/notAfter yazdır.'
    en: 'x509: print notBefore/notAfter.'
  verified: true
- flag: -connect
  meaning:
    tr: 's_client: host:port.'
    en: 's_client: host:port.'
  verified: true
  takes_value: true
  value_name: host:port
- flag: -servername
  meaning:
    tr: 's_client: SNI adı.'
    en: 's_client: SNI name.'
  verified: true
  takes_value: true
  value_name: name
examples:
- title:
    tr: Sürüm
    en: Version
  command: openssl version
  explanation:
    tr: Kurulu OpenSSL sürümü.
    en: Installed OpenSSL version.
  risk: safe
  difficulty: beginner
  privilege: none
- title:
    tr: Sertifika gör
    en: Show cert
  command: openssl x509 -in cert.pem -noout -subject -dates
  explanation:
    tr: PEM sertifikadan konu ve tarihler.
    en: Subject and dates from a PEM cert.
  risk: safe
  difficulty: intermediate
  privilege: none
- title:
    tr: SHA-256
    en: SHA-256
  command: openssl dgst -sha256 file.bin
  explanation:
    tr: Dosya özeti.
    en: File digest.
  risk: safe
  difficulty: intermediate
  privilege: none
- title:
    tr: TLS el sıkışma
    en: TLS handshake
  command: openssl s_client -connect example.com:443 -servername example.com </dev/null
  explanation:
    tr: 'Uzak TLS zincirini gösterir (ağ). Beklenen: certificate chain + Verify return code.'
    en: Shows remote TLS chain (network). Expect certificate chain + Verify return code.
  risk: caution
  difficulty: advanced
  privilege: none
related:
- ssh-keygen
- gpg
- curl
- nginx
- caddy
intent:
  tr:
  - sertifika incele
  - openssl hash
  - tls test
  - s_client
  - x509 tarih
  en:
  - inspect certificate
  - openssl hash
  - tls test
  - s_client
  - x509 dates
verification:
