schema_version: 2
id: ssh
name: ssh
kind: executable
category: security
summary:
  tr: Uzaktan güvenli kabuk oturumu.
  en: OpenSSH remote login client.
description:
  tr: SSH protokolü ile uzak makinede oturum açar.
  en: Logs into a remote machine using the SSH protocol.
tags:
- security
- network
risk: caution
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: openssh
  debian: openssh-client
  ubuntu: openssh-client
  fedora: openssh-clients
package_refs:
- manager: pacman
  package: openssh
  distributions:
  - arch
- manager: apt
  package: openssh-client
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: openssh-clients
  distributions:
  - fedora
install_notes:
  tr: 'Arch: pacman -S openssh'
  en: 'Arch: pacman -S openssh'
flags:
- flag: -p
  meaning:
    tr: Uzak port.
    en: Remote port.
  verified: true
  takes_value: true
  value_name: port
- flag: -i
  meaning:
    tr: Kimlik dosyası (özel anahtar).
    en: Identity file (private key).
  verified: true
  takes_value: true
  value_name: identity
- flag: -v
  meaning:
    tr: Ayrıntılı hata ayıklama.
    en: Verbose debugging.
  verified: false
- flag: -L
  meaning:
    tr: Yerel port yönlendirme.
    en: Local port forward.
  verified: false
  takes_value: true
  value_name: bind
- flag: -o
  meaning:
    tr: ssh_config seçeneği.
    en: ssh_config option.
  verified: false
  takes_value: true
  value_name: option
examples:
- title:
    tr: Bağlan
    en: Connect
  command: ssh user@host.example
  explanation:
    tr: Uzak oturum açar.
    en: Opens a remote session.
  risk: caution
  privilege: user
- title:
    tr: Port
    en: Port
  command: ssh -p 2222 user@host.example
  explanation:
    tr: 2222 portundan bağlanır.
    en: Connects on port 2222.
  risk: caution
  privilege: user
- title:
    tr: Batch test
    en: Batch test
  command: ssh -o BatchMode=yes -o ConnectTimeout=5 user@host.example true
  explanation:
    tr: Etkileşimsiz bağlantı denemesi (anahtar yoksa fail).
    en: Non-interactive connectivity probe (fails without key).
  risk: caution
  privilege: user
related:
- ssh-keygen
- scp
- sftp
- ssh-copy-id
- ssh-add
- sshd
intent:
  tr:
  - ssh ile bağlan
  - uzak sunucu
  - ssh port
  - anahtar ile ssh
  en:
  - ssh connect
  - remote shell
  - ssh port
  - ssh with key
verification:
  status: reviewed
  sources:
  - man 1 ssh
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
nova:
  concepts:
  - ssh
  - networking
  - permissions
  - networking-basics
purpose:
  tr: Uzak sisteme şifreli oturum; anahtar tabanlı giriş tercih edilir.
  en: Encrypted remote shell; prefer key-based login.
