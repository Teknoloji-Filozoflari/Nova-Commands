schema_version: 2
id: get-executionpolicy
name: Get-ExecutionPolicy
kind: powershell_cmdlet
category: security
summary:
  tr: PowerShell betik yürütme ilkesini gösterir.
  en: Shows the PowerShell script execution policy.
description:
  tr: Get-ExecutionPolicy, betiklerin nasıl çalıştırılacağını kontrol eden ExecutionPolicy değerini gösterir.
    Set-ExecutionPolicy değiştirir ve yönetici / grup ilkesi etkisi olabilir — bu kayıt salt okuma odaklıdır.
    PowerShell 7+ ile Windows PowerShell 5.1 kapsamları farklı olabilir (CurrentUser vs MachinePolicy).
  en: Get-ExecutionPolicy reports how scripts may run. Set-ExecutionPolicy changes it and may need admin
    / be overridden by Group Policy — this record is read-focused. PowerShell 7+ vs Windows PowerShell
    5.1 scopes can differ (CurrentUser vs MachinePolicy).
