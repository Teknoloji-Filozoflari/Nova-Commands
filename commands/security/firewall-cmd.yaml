schema_version: 2
id: firewall-cmd
name: firewall-cmd
kind: executable
category: security
summary:
  tr: firewalld komut satırı.
  en: firewalld command-line client.
description:
  tr: firewalld ile bölge, servis ve port kurallarını yönetir. Kalıcı değişiklikler --permanent ve reload
    ister.
  en: Manage firewalld zones, services, and ports. Permanent changes need --permanent and a reload.
tags:
- security
- firewall
- network
risk: dangerous
requires_elevated: true
platforms:
- linux
operating_systems:
- linux
packages:
  arch: firewalld
  debian: firewalld
  ubuntu: firewalld
  fedora: firewalld
package_refs:
- manager: pacman
  package: firewalld
  distributions:
  - arch
- manager: apt
  package: firewalld
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: firewalld
  distributions:
  - fedora
install_notes:
  tr: |-
    Arch: pacman -S firewalld — systemctl enable --now firewalld
    Fedora’da sık varsayılan; Debian/Ubuntu’da isteğe bağlı.
  en: |-
    Arch: pacman -S firewalld — systemctl enable --now firewalld
    Often default on Fedora; optional on Debian/Ubuntu.
flags:
- flag: --state
  meaning:
    tr: firewalld çalışıyor mu.
    en: Whether firewalld is running.
  verified: true
- flag: --list-all
  meaning:
    tr: Aktif bölge özeti.
    en: Active zone summary.
  verified: true
- flag: --permanent
  meaning:
    tr: Kalıcı kural.
    en: Permanent configuration.
  verified: true
- flag: --reload
  meaning:
    tr: Kuralları yeniden yükle.
    en: Reload firewall rules.
  verified: true
examples:
- title:
    tr: Durum
    en: State
  command: firewall-cmd --state
  explanation:
    tr: Çalışıyorsa running yazar.
    en: Prints running when active.
  risk: safe
  requires_elevated: false
- title:
    tr: Listele
    en: List
  command: sudo firewall-cmd --list-all
  explanation:
    tr: Aktif bölge kuralları.
    en: Active zone rules.
  risk: safe
  requires_elevated: true
- title:
    tr: Port aç (geçici)
    en: Open port (runtime)
  command: sudo firewall-cmd --add-port=8080/tcp
  explanation:
    tr: Runtime; reboot/reload ile kaybolabilir.
    en: Runtime only; may vanish on reload/reboot.
  risk: dangerous
  requires_elevated: true
related:
- nft
- iptables
- ss
- systemctl
intent:
  tr:
  - firewall port aç
  - firewalld
  en:
  - open firewall port
  - firewalld
verification:
  status: reviewed
  sources:
  - man 1 firewall-cmd
  - https://firewalld.org/documentation/
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-coverage
nova:
  concepts:
  - networking
  - ssh
  - permissions
  - firewalls
