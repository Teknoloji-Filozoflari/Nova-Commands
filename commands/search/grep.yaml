schema_version: 2
id: grep
name: grep
kind: executable
category: search
summary:
  tr: Metinde desen arar.
  en: Print lines matching a pattern.
description:
  tr: Dosya veya stdin içinde düzenli ifade / sabit dizgi arar.
  en: Searches files or stdin for regex or fixed strings.
tags:
- search
- text
risk: safe
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: grep
  debian: grep
  ubuntu: grep
  fedora: grep
package_refs:
- manager: pacman
  package: grep
  distributions:
  - arch
- manager: apt
  package: grep
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: grep
  distributions:
  - fedora
flags:
- flag: -i
  long: --ignore-case
  meaning:
    tr: Büyük/küçük harf duyarsız.
    en: Ignore case.
  verified: true
  platforms:
  - gnu
- flag: -r
  long: --recursive
  meaning:
    tr: Dizinlerde özyinelemeli ara.
    en: Read all files under directories.
  verified: true
  platforms:
  - gnu
- flag: -n
  long: --line-number
  meaning:
    tr: Satır numarası yaz.
    en: Print line numbers.
  verified: true
  platforms:
  - gnu
- flag: -E
  long: --extended-regexp
  meaning:
    tr: Genişletilmiş regex.
    en: Extended regular expressions.
  verified: true
  platforms:
  - gnu
examples:
- title:
    tr: Dosyada ara
    en: Search in file
  command: grep -n TODO main.rs
  explanation:
    tr: TODO geçen satırları numarayla gösterir.
    en: Shows TODO lines with numbers.
  risk: safe
- title:
    tr: Ağaçta ara
    en: Search tree
  command: grep -rn "TODO" src/
  explanation:
    tr: src altında özyinelemeli arar.
    en: Recursively searches under src/.
  risk: safe
related:
- find
- rg
intent:
  tr:
  - metin ara
  - dosyada kelime bul
  en:
  - search text
  - find string in files
verification:
  status: reviewed
  sources:
  - man 1 grep
