schema_version: 2
id: find
name: find
kind: executable
category: search
summary:
  tr: Dizin ağacında dosya arar.
  en: Search for files in a directory hierarchy.
description:
  tr: İsim, tip, zaman ve başka ölçütlerle dosya bulur; aksiyonlar çalıştırabilir. macOS/BSD `find` GNU
    findutils’ten farklıdır (ör. `-printf` yok; `-exec` sonlandırma alışkanlıkları kontrol edin).
  en: Finds files by name, type, time, and more; can run actions. macOS/BSD find differs from GNU findutils
    (e.g. no -printf; check -exec termination).
tags:
- search
- files
risk: caution
learning_level: intermediate
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: findutils
  debian: findutils
  ubuntu: findutils
  fedora: findutils
package_refs:
- manager: pacman
  package: findutils
  distributions:
  - arch
- manager: apt
  package: findutils
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: findutils
  distributions:
  - fedora
flags:
- flag: -name
  takes_value: true
  value_name: PATTERN
  meaning:
    tr: Baz ada göre eşle.
    en: Match basename pattern.
  verified: true
- flag: -type
  takes_value: true
  value_name: t
  meaning:
    tr: 'Tür: f dosya, d dizin.'
    en: 'Type: f file, d directory.'
  verified: true
- flag: -delete
  meaning:
    tr: Eşleşenleri sil (dikkat).
    en: Delete matched files (careful).
  verified: true
examples:
- title:
    tr: İsme göre ara
    en: Search by name
  command: find ~ -name "*.pdf"
  explanation:
    tr: Ev dizininde PDF arar.
    en: Finds PDFs under home.
  risk: safe
  difficulty: beginner
- title:
    tr: Boş dizinler
    en: Empty dirs
  command: find . -type d -empty
  explanation:
    tr: Boş dizinleri listeler.
    en: Lists empty directories.
  risk: safe
related:
- grep
- locate
intent:
  tr:
  - dosya bul
  - isme göre ara
  en:
  - find files
  - search by name
verification:
  status: reviewed
  sources:
  - man 1 find
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
  notes: NV-123 teachable fields (when/syntax/mistakes/topics).
nova:
  concepts:
  - files
  - shell-pipes-redirection
when_to_use:
  tr: Dizin ağacında isim/tür/zaman ölçütleriyle dosya bulmak.
  en: Find files in a tree by name/type/time predicates.
syntax: find [PATH]... [EXPRESSION]
expected_effect:
  tr: Eşleşen yolları listeler (varsayılan -print); -delete kullanmadıkça silmez.
  en: Lists matching paths (default -print); does not delete unless -delete is used.
common_mistakes:
- tr: Kökten sınırsız find ile sistemi yormak.
  en: Hammering the system with unbounded find from /.
- tr: -name kalıbını tırnaksız verip kabuğun * genişletmesine izin vermek.
  en: Leaving -name patterns unquoted so the shell expands *.
related_topics:
- finding-files
- permissions
