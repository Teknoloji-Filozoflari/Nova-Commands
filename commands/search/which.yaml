id: which
name: which
summary:
  tr: Komutun PATH üzerindeki konumunu gösterir.
  en: Locate a command on PATH.
description:
  tr: Kabuğun bulacağı yürütülebilir dosyanın yolunu basar.
  en: Prints the path of the executable that would be run.
tags:
- search
- path
risk: safe
requires_elevated: false
platforms:
- linux
- macos
- bsd
packages:
