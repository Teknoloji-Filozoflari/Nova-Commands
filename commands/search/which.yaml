  debian: debianutils
  ubuntu: debianutils
  fedora: which
install_notes:
  tr: 'Arch: pacman -S which

    Debian/Ubuntu: generally in debianutils

    Fedora: dnf install which'
  en: 'Arch: pacman -S which

    Debian/Ubuntu: typically debianutils

    Fedora: dnf install which'
examples:
