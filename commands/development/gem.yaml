  debian: ruby-rubygems
  ubuntu: ruby-rubygems
package_refs:
- manager: pacman
  package: rubygems
  distributions:
  - arch
- manager: apt
  package: ruby-rubygems
  distributions:
  - debian
  - ubuntu
install_notes:
  tr: |-
    Çoğu Ruby kurulumuyla gelir. Arch: pacman -S rubygems
  en: |-
    Ships with most Ruby installs. Arch: pacman -S rubygems
