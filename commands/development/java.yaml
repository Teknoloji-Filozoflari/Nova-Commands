    en: Version
  command: java -version
  explanation:
    tr: JVM sürüm bilgisini stderr’e yazar.
    en: Prints JVM version info to stderr.
  risk: safe
  difficulty: beginner
- title:
    tr: JAR çalıştır
    en: Run JAR
  command: java -jar app.jar
  explanation:
    tr: Executable JAR çalıştırır.
    en: Runs an executable JAR.
  risk: caution
  difficulty: beginner
