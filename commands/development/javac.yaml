schema_version: 2
id: javac
name: javac
kind: executable
category: development
summary:
  tr: Java derleyicisi (javac).
  en: Java compiler (javac).
description:
  tr: >-
    Kaynak .java dosyalarını bytecode’a derler. Çok modüllü projelerde mvn/gradle tercih edilir.
  en: >-
    Compiles .java sources to bytecode. Prefer mvn/gradle for multi-module projects.
purpose:
  tr: Java kaynaklarını derlemek.
  en: Compile Java sources.
when_to_use:
  tr: Küçük örneklerde veya JDK teşhisinde.
  en: For small samples or JDK diagnostics.
syntax: "javac [options] <source files>"
expected_effect:
  tr: .class dosyaları üretir.
  en: Produces .class files.
