summary:
  tr: Aktif Xcode / CLT geliştirici dizinini seçer.
  en: Selects the active Xcode / CLT developer directory.
description:
  tr: xcode-select, derleyici araçlarının hangi Developer dizinini kullanacağını ayarlar. `xcrun` araçları
    bu seçime göre yollar. Yanlış yol derlemeyi bozar.
  en: xcode-select sets which Developer directory compiler tools use. xcrun resolves tools from that selection.
    A wrong path breaks builds.
