schema_version: 2
id: php
name: php
kind: executable
category: development
summary:
  tr: PHP yorumlayıcısı CLI.
  en: PHP interpreter CLI.
description:
  tr: >-
    Betik çalıştırır, yerleşik sunucu açar, sürüm gösterir. Web SAPI ayrıdır.
  en: >-
    Runs scripts, starts the built-in server, shows version. Web SAPI is separate.
purpose:
  tr: PHP betiklerini ve yerel sunucuyu çalıştırmak.
  en: Run PHP scripts and the local server.
when_to_use:
  tr: PHP CLI betikleri veya php -S geliştirme sunucusu için.
  en: For PHP CLI scripts or the php -S dev server.
expected_effect:
  tr: Betik çalıştırır veya yerleşik sunucu dinler.
  en: Runs a script or listens with the built-in server.
syntax: "php [options] [-f] <file> [args...]"
tags:
- software
- backend
- php
- language
risk: caution
learning_level: intermediate
requires_elevated: false
platforms:
- linux
- macos
- windows
packages:
  arch: php
  debian: php-cli
  ubuntu: php-cli
  fedora: php-cli
package_refs:
- manager: pacman
  package: php
  distributions:
  - arch
- manager: apt
  package: php-cli
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: php-cli
  distributions:
  - fedora
- manager: homebrew
  package: php
install_notes:
  tr: |-
    Arch: pacman -S php
    Debian/Ubuntu: apt install php-cli
    Composer ayrı pakettir.
  en: |-
    Arch: pacman -S php
    Debian/Ubuntu: apt install php-cli
    Composer is a separate package.
flags: []
examples:
- title:
    tr: Sürüm
    en: Version
  command: php -v
  explanation:
    tr: PHP sürümü.
    en: PHP version.
