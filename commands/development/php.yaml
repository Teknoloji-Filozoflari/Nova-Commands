  difficulty: beginner
- title:
    tr: Betik
    en: Script
  command: php script.php
  explanation:
    tr: Betik çalıştırır.
    en: Runs a script.
  risk: caution
  difficulty: beginner
- title:
    tr: Dev sunucu
    en: Dev server
  command: "php -S 127.0.0.1:8000"
  explanation:
    tr: Yerleşik HTTP sunucu.
    en: Built-in HTTP server.
  risk: caution
  difficulty: intermediate
