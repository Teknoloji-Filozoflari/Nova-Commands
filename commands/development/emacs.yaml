schema_version: 2
id: emacs
name: emacs
kind: executable
category: development
summary:
  tr: GNU Emacs editörü.
  en: GNU Emacs editor.
description:
  tr: >-
    Genişletilebilir editör/IDE. Terminalde emacs -nw; GUI ayrı.
  en: >-
    Extensible editor/IDE. Terminal via emacs -nw; GUI separate.
purpose:
  tr: Kod ve org-mode düzenleme.
  en: Edit code and org-mode.
when_to_use:
  tr: Emacs iş akışında veya batch --batch scriptlerinde.
  en: In Emacs workflows or --batch scripts.
expected_effect:
  tr: Editör süreci başlatır.
  en: Starts an editor process.
syntax: "emacs [options] [file ...]"
tags:
- software
- editors
- tools
risk: caution
learning_level: intermediate
