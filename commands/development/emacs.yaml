  package: emacs
  distributions:
  - arch
- manager: apt
  package: emacs
  distributions:
  - debian
  - ubuntu
- manager: homebrew
  package: emacs
install_notes:
  tr: |-
    Arch: pacman -S emacs
    Debian/Ubuntu: apt install emacs
    macOS: brew install emacs
  en: |-
    Arch: pacman -S emacs
    Debian/Ubuntu: apt install emacs
    macOS: brew install emacs
flags: []
examples:
- title:
    tr: Sürüm
    en: Version
  command: emacs --version
