  difficulty: beginner
- title:
    tr: Terminal
    en: Terminal
  command: emacs -nw README.md
  explanation:
    tr: TTY modunda açar.
    en: Opens in TTY mode.
  risk: safe
  difficulty: beginner
- title:
    tr: Batch
    en: Batch
  command: emacs --batch --version
  explanation:
    tr: Batch modunda sürüm yazar ve çıkar.
    en: Prints version in batch mode and exits.
  risk: safe
  difficulty: intermediate
