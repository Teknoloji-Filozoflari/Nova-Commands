- manager: homebrew
  package: flutter
- manager: snap
  package: flutter
  notes:
    tr: Snap kanalı resmi olabilir; dokümantasyonu doğrulayın.
    en: Snap channel may be official; verify docs.
install_notes:
  tr: |-
    Resmi: https://docs.flutter.dev/get-started/install
    macOS: brew install --cask flutter
    Android SDK/Xcode ayrıca gerekir.
  en: |-
    Official: https://docs.flutter.dev/get-started/install
    macOS: brew install --cask flutter
    Android SDK/Xcode also required.
flags: []
