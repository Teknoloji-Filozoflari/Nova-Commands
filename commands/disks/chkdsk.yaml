schema_version: 2
id: chkdsk
name: chkdsk
kind: administrative_tool
category: disks
summary:
  tr: NTFS/FAT birim bütünlüğü denetimi.
  en: NTFS/FAT volume integrity check.
description:
  tr: chkdsk dosya sistemi hatalarını tarar; `/f` onarım yapar ve birimi kilitleyebilir. Linux fsck karşılığı
    değildir. Üretimde yedek ve bakım penceresi.
  en: chkdsk scans filesystem errors; /f repairs and may lock the volume. Not an fsck alias. Use backups
    and a maintenance window in production.
