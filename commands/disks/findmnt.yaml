schema_version: 2
id: findmnt
name: findmnt
kind: executable
category: disks
summary:
  tr: Bağlı dosya sistemlerini listeler.
  en: List mounted filesystems (libmount).
description:
  tr: mount çıktısına göre daha düzenli ağaç/JSON görünümü; hedef veya kaynak süzebilir.
  en: Clearer tree/JSON view than raw mount; can filter by target or source.
tags:
- disk
- storage
- mount
risk: safe
requires_elevated: false
platforms:
- linux
operating_systems:
- linux
packages:
  arch: util-linux
  debian: util-linux
  ubuntu: util-linux
  fedora: util-linux
package_refs:
- manager: pacman
  package: util-linux
  distributions:
  - arch
- manager: apt
  package: util-linux
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: util-linux
  distributions:
  - fedora
flags:
- flag: -t
  meaning:
    tr: FS türü süz.
    en: Filter by FS type.
  verified: true
  long: --types
  takes_value: true
  value_name: types
- flag: -J
  meaning:
    tr: JSON çıktı.
    en: JSON output.
  verified: true
  long: --json
- flag: -s
  meaning:
    tr: fstab’dan.
    en: From fstab.
  verified: true
  long: --fstab
examples:
- title:
    tr: Ağaç
    en: Tree
  command: findmnt
  explanation:
    tr: Bağlı FS ağacı.
    en: Mounted FS tree.
  risk: safe
- title:
    tr: Hedef
    en: Target
  command: findmnt /
  explanation:
    tr: Kök FS ayrıntıları.
    en: Root FS details.
  risk: safe
- title:
    tr: fstab
    en: fstab
  command: findmnt --fstab
  explanation:
    tr: fstab girdileri.
    en: fstab entries.
  risk: safe
related:
- mount
- umount
- lsblk
- df
intent:
  tr:
  - ne bağlı
  - findmnt
  en:
  - what is mounted
  - findmnt
verification:
  status: verified
  sources:
  - man 8 findmnt (util-linux)
  - https://man.archlinux.org/man/findmnt.8
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-phase15
  notes: Flags -t/-J/-s confirmed; read-only mount listing.
nova:
  concepts:
  - storage
