install_notes:
  tr: |
    Arch: pacman -S btrfs-progs
    Debian/Ubuntu: apt install btrfs-progs
    Fedora: dnf install btrfs-progs
  en: |
    Arch: pacman -S btrfs-progs
    Debian/Ubuntu: apt install btrfs-progs
    Fedora: dnf install btrfs-progs
flags:
- flag: -L
  long: --label
  meaning:
    tr: Dosya sistemi etiketi.
    en: Set filesystem label.
  verified: true
  takes_value: true
  value_name: label
- flag: -f
  long: --force
  meaning:
    tr: Mevcut dosya sisteminin üzerine yazmayı zorla.
    en: Force overwrite of an existing filesystem.
  verified: true
- flag: -m
  long: --metadata
  meaning:
    tr: Meta veri profili (single, raid1, …).
    en: Metadata profile (single, raid1, …).
  verified: true
  takes_value: true
  value_name: profile
examples:
- title:
    tr: Sürüm / yardım
    en: Version / help
  command: mkfs.btrfs --help
  explanation:
    tr: Seçenekleri listeler; aygıta yazmaz.
    en: Lists options; does not write to a device.
  risk: safe
  requires_elevated: false
- title:
    tr: Tek aygıt Btrfs (UYARI)
    en: Single-device Btrfs (DANGER)
  command: sudo mkfs.btrfs -L root /dev/sdXN
  explanation:
    tr: |
      Yer tutucu. Çok aygıtlı komutları kopyalamayın; önce lsblk ile her üyeyi doğrulayın. Üzerine yazma için `-f` ekstra risk.
    en: |
      Placeholder. Do not copy multi-device recipes blindly; verify each member with lsblk. `-f` adds overwrite risk.
  risk: destructive
  requires_elevated: true
  warnings:
    - tr: Yanlış aygıt seçimi veriyi kalıcı olarak siler; önce lsblk/diskutil ile doğrula.
      en: Wrong device permanently destroys data; verify with lsblk/diskutil first.
