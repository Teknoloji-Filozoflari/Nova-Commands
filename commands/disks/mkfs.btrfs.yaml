schema_version: 2
id: mkfs.btrfs
name: mkfs.btrfs
kind: executable
category: disks
summary:
  tr: Btrfs dosya sistemi oluşturur (yıkıcı).
  en: Create a Btrfs filesystem (destructive).
description:
  tr: |
    btrfs-progs `mkfs.btrfs` bir veya birden fazla aygıtta Btrfs oluşturur. Mevcut FS’yi ezmek `-f` ister. Çok diskli RAID profilleri (`-d`/`-m`) karmaşıktır — yanlış aygıt listesi veri kaybıdır. reviewed, verified değil.
  en: |
    btrfs-progs `mkfs.btrfs` creates Btrfs on one or more devices. Overwrite needs `-f`. Multi-disk RAID profiles (`-d`/`-m`) are easy to get wrong — bad device lists destroy data. Reviewed, not verified.
tags:
- disk
- storage
- filesystem
- btrfs
- format
risk: destructive
learning_level: intermediate
requires_elevated: true
platforms:
- linux
operating_systems:
- linux
packages:
  arch: btrfs-progs
  debian: btrfs-progs
  ubuntu: btrfs-progs
  fedora: btrfs-progs
package_refs:
