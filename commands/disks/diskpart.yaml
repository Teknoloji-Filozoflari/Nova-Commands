schema_version: 2
id: diskpart
name: diskpart
kind: administrative_tool
category: disks
summary:
  tr: Etkileşimli disk bölümleme aracı (yıkıcı olabilir).
  en: Interactive disk partitioning tool (can be destructive).
description:
  tr: diskpart.exe bölüm/disk yönetir. `clean` / yanlış disk numarası veri kaybına yol açar. PowerShell
    Get-Disk ayrı kayıttır. Bu bankada yıkıcı örnek yok — yalnız list.
  en: diskpart.exe manages disks/partitions. clean / wrong disk numbers cause data loss. PowerShell Get-Disk
    is separate. No destructive examples here — list only.
