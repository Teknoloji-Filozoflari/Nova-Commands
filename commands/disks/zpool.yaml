schema_version: 2
id: zpool
name: zpool
kind: administrative_tool
category: disks
summary:
  tr: ZFS depolama havuzu yönetimi (FreeBSD).
  en: ZFS storage pool management (FreeBSD).
description:
  tr: '`zpool`, ZFS havuzlarını oluşturur/yönetir. FreeBSD’de taban ZFS yaygındır; OpenBSD’de yoktur.
    `list`/`status` salt okuma; `destroy`/`replace` yıkıcıdır ve örneklerde yoktur. Linux OpenZFS ayrı
    doğrulanmalıdır.'
  en: zpool creates/manages ZFS pools. Common in FreeBSD base; not in OpenBSD. list/status are read-only;
    destroy/replace are destructive and omitted. Linux OpenZFS must be verified separately.
tags:
- bsd
- freebsd
- zfs
- storage
risk: dangerous
requires_elevated: true
platforms:
- bsd
- freebsd
operating_systems:
- freebsd
flags:
- flag: list
  meaning:
    tr: Havuzları listele.
    en: List pools.
  verified: false
- flag: status
  meaning:
    tr: Havuz durumu.
    en: Pool status.
  verified: false
- flag: get
  meaning:
    tr: Özellik oku.
    en: Get property.
  verified: false
examples:
- title:
    tr: Havuz listesi
    en: List pools
  command: zpool list
  explanation:
    tr: ZFS havuzlarını listeler (yoksa boş/hata).
    en: Lists ZFS pools (empty/error if none).
  risk: safe
  requires_elevated: false
  platforms:
  - bsd
  - freebsd
- title:
    tr: Durum
    en: Status
  command: zpool status
  explanation:
    tr: Havuz sağlığını gösterir.
    en: Shows pool health.
  risk: safe
  requires_elevated: false
  platforms:
  - bsd
  - freebsd
related:
