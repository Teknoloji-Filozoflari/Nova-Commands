schema_version: 2
id: get-disk
name: Get-Disk
kind: powershell_cmdlet
category: disks
summary:
  tr: Fiziksel diskleri listeler (Storage cmdlet).
  en: Lists physical disks (Storage cmdlet).
description:
  tr: Get-Disk, Windows Storage modülü ile fiziksel diskleri gösterir. Linux `lsblk` karşılığı değildir.
    Disk numarası ile Get-Partition/Get-Volume birlikte kullanılır. Yazma işlemleri yönetici ister; bu
    kayıt salt okuma odaklıdır.
  en: Get-Disk lists physical disks via the Windows Storage module. Not an lsblk alias. Often paired with
    Get-Partition/Get-Volume by disk number. Write ops need admin; this record focuses on read-only queries.
