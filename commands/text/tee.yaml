schema_version: 2
id: tee
name: tee
kind: executable
category: text
summary:
  tr: Çıktıyı hem dosyaya hem stdout’a yazar.
  en: Write output to files and stdout.
description:
  tr: Boru hattında çıktıyı kaydederek iletir.
  en: Duplicates stdin to files while passing it through.
tags:
- text
- pipe
risk: caution
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: coreutils
  debian: coreutils
  ubuntu: coreutils
  fedora: coreutils
package_refs:
- manager: pacman
  package: coreutils
  distributions:
  - arch
- manager: apt
  package: coreutils
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: coreutils
  distributions:
  - fedora
flags:
- flag: -a
  long: --append
  meaning:
    tr: Dosyaya ekle, üzerine yazma.
    en: Append to files rather than overwrite.
  verified: true
  platforms:
  - gnu
examples:
- title:
    tr: Hem kaydet hem göster
    en: Save and show
  command: journalctl -u nginx | tee nginx.log
  explanation:
    tr: Çıktıyı dosyaya yazıp ekranda da gösterir.
    en: Saves output while still displaying it.
  risk: caution
related:
- cat
intent:
  tr:
  - çıktıyı dosyaya yaz
  - tee ile kaydet
  en:
  - tee to file
  - save pipeline output
verification:
  status: reviewed
  sources:
  - man 1 tee
  last_reviewed: '2026-11-02'
  reviewer: nova-commands-bootstrap
nova:
  concepts:
  - files
  - shell-pipes-redirection
