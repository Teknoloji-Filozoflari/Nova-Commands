schema_version: 2
id: tail
name: tail
kind: executable
category: text
summary:
  tr: Dosyanın sonunu gösterir.
  en: Show the end of files.
description:
  tr: Varsayılan son 10 satır. -f ile canlı takip.
  en: Last 10 lines by default. -f follows appended data.
tags:
- text
- log
risk: safe
requires_elevated: false
platforms:
- linux
- macos
- bsd
operating_systems:
- linux
- macos
packages:
  arch: coreutils
  debian: coreutils
  ubuntu: coreutils
  fedora: coreutils
package_refs:
- manager: pacman
  package: coreutils
  distributions:
  - arch
- manager: apt
  package: coreutils
  distributions:
  - debian
  - ubuntu
- manager: dnf
  package: coreutils
  distributions:
  - fedora
flags:
- flag: -n
  long: --lines
  takes_value: true
  value_name: N
  meaning:
    tr: Son N satır.
    en: Last N lines.
  verified: true
  platforms:
  - gnu
- flag: -f
  long: --follow
  meaning:
    tr: Eklenen çıktıyı canlı izle.
    en: Follow appended output.
  verified: true
  platforms:
  - gnu
examples:
- title:
    tr: Log takip
    en: Follow log
  command: tail -f /var/log/nginx/access.log
  explanation:
    tr: Yeni satırları canlı gösterir.
    en: Streams new lines as they appear.
  risk: safe
related:
- head
- less
- journalctl
intent:
  tr:
  - log takip
  - dosyanın sonu
  en:
  - follow log
  - tail file
verification:
  status: verified
  sources:
  - man 1 tail (GNU coreutils)
